[build-system]
requires = ["setuptools>=45", "wheel", "cmake>=3.20"]
build-backend = "setuptools.build_meta"

[project]
name = "radia"
version = "4.95.11"
description = "Radia 3D Magnetostatics with NGSolve Integration and TaskManager Parallelization"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [
    {name = "Oleg Chubar", email = "chubar@bnl.gov"},
    {name = "Pascal Elleaume"},
]
maintainers = [
    {name = "Radia Development Team"},
]
keywords = ["magnetostatics", "magnetic field", "radia", "ngsolve", "fem", "synchrotron", "cubit", "mesh", "export", "gmsh", "nastran", "vtk", "netgen"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.20",
    # MKL upper-capped at <2026 because mkl-2026.0.0 ships `mkl_rt.3.dll`
    # instead of `mkl_rt.2.dll`, breaking radia binaries built against
    # the 2024.x/2025.x DLL set (2026-05-27 incident: LAB rebuild was
    # against MKL 2025.0.1).  Bump the upper bound when we rebuild
    # radia against MKL 2026's new .dll naming.
    "mkl>=2024.2.0,<2026",
    "intel-cmplr-lib-rt>=2024.2.0",
    # NGSolve + Netgen-mesher pinned to 6.2.2604 (2026-05-27 radia 4.79.0).
    # Bumped from 6.2.2603 because cubit-mesh-export 0.10.2's transitive
    # deps auto-upgraded the lab machines to 2604, leaving radia 4.78.1
    # (2603 ABI) unrunnable.  Bump consequences:
    #   * BLAS backend: 2604 ships `ngsolve-openblas` (mandatory dep) and
    #     NGSolve uses OpenBLAS exclusively — `libngsolve.dll` links
    #     `openblas.dll`, NOT `mkl_rt.*`.  So ngsolve itself is
    #     mkl-version-agnostic.  The `mkl>=2024.2.0,<2026` cap is purely
    #     RADIA's own requirement: `_radia_pybind.pyd` links `mkl_rt.2.dll`
    #     for its BLAS/LAPACK (CLAUDE.md "Intel MKL only").  mkl-2026.0.0
    #     ships `mkl_rt.3.dll` (renamed from `mkl_rt.2.dll`), which would
    #     break `_radia_pybind.pyd`'s DLL load — hence the `<2026` cap.
    #     (Verified 2026-05-28: `pip show ngsolve` Requires = netgen-mesher,
    #     ngsolve-openblas; no mkl.  libngsolve.dll BLAS string = openblas.dll.)
    #   * ABI change: `ngfem::CoefficientFunction` ABI moved between
    #     2603 and 2604.  `_radia_pybind.pyd` MUST be rebuilt against
    #     2604 — radia wheels older than 4.79.0 will NOT import under
    #     ngsolve 2604.
    #   * HTool callback bridge (NGSolve commit d90c59ea) is added in
    #     2604 but Radia does NOT integrate with it.  Radia has no
    #     ngsolve-side H-matrix path: `rad.RadiaField(...)` has no
    #     `use_hmatrix=` parameter (passing it raises TypeError), and
    #     BEM-A remains dense (H-matrix deferred — see
    #     memory/direction_bem_a_hmatrix_in_radia.md).  Radia-specific
    #     H-matrix acceleration is kept in Radia's C++ kernels, primarily
    #     the HDiv-VIM open-boundary path.
    "ngsolve==6.2.2604",
    "netgen-mesher==6.2.2604",
    # MCP server dependency (optional, for Claude Code / Cursor integration)
    "mcp>=1.0.0",
]

[project.optional-dependencies]
cubit = [
    "cubit-mesh-export",
]
spice = [
    "radia-spice-lab>=0.4.0",
]
ltspice = [
    "radia-spice-lab>=0.4.0",
]
build123d = [
    # Pythonic OCCT front-end used by PEEC coil-from-shape helpers
    # (label / color reading, STEP XCAF access). netgen.occ does not
    # expose XCAF labels, so a pythonocc-core-based reader is required
    # when the user wants labeled STEP ports.
    "build123d>=0.9",
]
viz = [
    "pyvista>=0.40",
    "matplotlib>=3.5",
]
urn = [
    "torch>=2.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-rerunfailures>=12.0",
    "mcp>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-rerunfailures>=12.0",
    "pyvista>=0.40",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/ksugahar/Radia"
Documentation = "https://github.com/ksugahar/Radia/blob/main/README.md"
Repository = "https://github.com/ksugahar/Radia"
Issues = "https://github.com/ksugahar/Radia/issues"
"Original Radia" = "https://github.com/ochubar/Radia"
"ESRF Radia Page" = "https://www.esrf.fr/Accelerators/Groups/InsertionDevices/Software/Radia"

[project.scripts]
# CLI for .vol/.sol viewer (also exposed as a gui-script below).
# Use the CLI form when you want stdout (e.g. --register / probing);
# use the gui-script (radia-vol-viewer-gui.exe) for the Windows file
# association so no console window flashes on double-click.
radia-vol-viewer = "radia.tools.vol_sol_viewer:main"
# radia-ih / radia-em / radia-pcb / radia-streamfunction desktop PySide
# entry points were retired in 2026-06.  Use the notebook workbenches under
# src/radia/panels/notebooks/ and the headless calc_*.py scripts.
# Plugin + panels: cubit-plugin-install (from cubit-mesh-export)
# MCP servers: radia-mcp package (pip install radia-mcp)

[project.gui-scripts]
# Windowless launcher used by the Windows .vol / .sol file
# association (`radia-vol-viewer --register` writes this path into
# the registry).  Linked through pythonw.exe so no console flashes
# on double-click.
radia-vol-viewer-gui = "radia.tools.vol_sol_viewer:main"

[tool.setuptools.package-data]
# Note (2026-06): standalone PySide desktop adapters are retired.  The Cubit
# embedded Export Mesh toolbar remains package data; normal Radia Python uses
# notebook/headless workflows and does not depend on PySide6.
# Note (Tier-2, 2026-06-01): the Cubit plugin binaries (cubit_mesh_export.ccm,
# cubit_mesh_curver.pyd) are NO LONGER bundled in the radia wheel.  They are
# shipped + deployed SOLELY by the cubit-mesh-export package, so radia and
# cubit-mesh-export release fully independently.  "*.ccm" is dropped here;
# cubit_mesh_curver.pyd is excluded below (the "*.pyd" glob ships only
# _radia_pybind.pyd / cln_core.pyd / peec_matrices.pyd /
# sparsesolv_ngsolve.pyd).
radia = [
    "*.pyd", "*.pyi", "*.png", "*.ico",
    "resources/*.png", "resources/*.ico",
    "panels/samples/*.jou",
    "panels/samples/*.sol",
    "panels/samples/*.vol",
    "panels/samples/*.json",
    "panels/samples/*.py",
    "panels/samples/em_sample_bh.txt",
    "panels/samples/em/c_type_dipole/*.md",
    "panels/samples/em/c_type_dipole/*.step",
    "panels/*.json",
    "panels/notebooks/*.ipynb",
    "panels/notebooks/*.json",
    "CONVENTIONS.md",
]

[tool.setuptools.exclude-package-data]
radia = [
    # NOTE: .py files are NOT excludable via exclude-package-data (only
    # non-Python data assets are).  panels/cub5_to_vol.py is therefore
    # not in this repo at all — the reference implementation lives in
    # to_developers/ngsolve/cub5_to_vol.py (gitignored, LAB local).
    # Tier-2 (2026-06-01): the Cubit plugin .pyd is shipped only by the
    # cubit-mesh-export package, never by radia -- exclude it from the
    # "*.pyd" glob in case a stale build artifact lingers in src/radia/.
    "cubit_mesh_curver.pyd",
    # Debug/temp files that match package-data globs but should not ship
    "panels/samples/_*.jou",
    "panels/samples/_*.py",
    "panels/samples/test_*.jou",
    "panels/samples/test_*.py",
    "panels/samples/compare_*.py",
    "panels/_pconv_*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
filterwarnings = [
    "ignore:Netgen fork.*is NOT installed:UserWarning",
]
markers = [
    "basic: Basic functionality tests (fast)",
    "comprehensive: Comprehensive test suite",
    "advanced: Advanced features and edge cases",
    "performance: Performance and scaling tests",
    "slow: Tests that take more than 10 seconds",
    "benchmark: Performance benchmarks (not run by default)",
    "validation: Heavy validation_test suite (manual / release validation)",
    "compute_host: Solver-heavy validation restricted to mdx or hibino",
]
minversion = "7.0"
norecursedirs = [
    ".git",
    ".tox",
    "dist",
    "build",
    "*.egg",
    "__pycache__",
]

[tool.coverage.run]
source = ["radia"]
omit = [
    "tests/*",
    "examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
