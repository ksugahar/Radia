[build-system]
requires = ["setuptools>=45", "wheel", "cmake>=3.20"]
build-backend = "setuptools.build_meta"

[project]
name = "radia"
version = "4.4.0"
description = "Radia 3D Magnetostatics with NGSolve Integration and TaskManager Parallelization"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "BSD-style AND MIT"}
authors = [
    {name = "Oleg Chubar", email = "chubar@bnl.gov"},
    {name = "Pascal Elleaume"},
]
maintainers = [
    {name = "Radia Development Team"},
]
keywords = ["magnetostatics", "magnetic field", "radia", "ngsolve", "fem", "synchrotron", "cubit", "mesh", "export", "gmsh", "nastran", "vtk", "netgen"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.20",
    "mkl>=2024.2.0",
    "intel-cmplr-lib-rt>=2024.2.0",
    # NGSolve pinned to 6.2.2602 (netgen fork is built against this version)
    # ksugahar/netgen fork adds CallbackGeometry + SetGeomInfo (PR#232 pending)
    # Fork wheel: https://github.com/ksugahar/netgen/releases
    # Install: python install_full.py (radia + netgen fork in one command)
    # Without the fork: export_NGSolveCurvedMesh() will not work
    "ngsolve==6.2.2602.post2",
    # MCP server dependency (optional, for Claude Code / Cursor integration)
    "mcp>=1.0.0",
]

[project.optional-dependencies]
cubit = [
    "cubit-mesh-export",
]
gui = [
    "PySide6>=6.5",
]
viz = [
    "pyvista>=0.40",
    "matplotlib>=3.5",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mcp>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyvista>=0.40",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/ksugahar/Radia"
Documentation = "https://github.com/ksugahar/Radia/blob/main/README.md"
Repository = "https://github.com/ksugahar/Radia"
Issues = "https://github.com/ksugahar/Radia/issues"
"Original Radia" = "https://github.com/ochubar/Radia"
"ESRF Radia Page" = "https://www.esrf.fr/Accelerators/Groups/InsertionDevices/Software/Radia"

[project.scripts]
radia-ih = "radia.radia_ih:main"
radia-em = "radia.radia_em:main"
radia-pcb = "radia.radia_pcb:main"
# Plugin + panels: cubit-plugin-install (from cubit-mesh-export)
# MCP servers: radia-mcp package (pip install radia-mcp)

[tool.setuptools.package-data]
radia = [
    "*.pyd", "*.ccm", "*.ccl", "*.png", "*.ico",
    "panels/samples/*.jou",
    "CONVENTIONS.md",
]

[tool.setuptools.exclude-package-data]
radia = ["panels/cub5_to_vol.py", "cubit_netgen_bridge.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
filterwarnings = [
    "ignore:Netgen fork.*is NOT installed:UserWarning",
]
markers = [
    "basic: Basic functionality tests (fast)",
    "comprehensive: Comprehensive test suite",
    "advanced: Advanced features and edge cases",
    "performance: Performance and scaling tests",
    "slow: Tests that take more than 10 seconds",
    "benchmark: Performance benchmarks (not run by default)",
]
minversion = "7.0"
norecursedirs = [
    ".git",
    ".tox",
    "dist",
    "build",
    "*.egg",
    "__pycache__",
]

[tool.coverage.run]
source = ["radia"]
omit = [
    "tests/*",
    "examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
