[build-system]
requires = ["setuptools>=45", "wheel", "cmake>=3.20"]
build-backend = "setuptools.build_meta"

[project]
name = "radia"
version = "4.78.1"
description = "Radia 3D Magnetostatics with NGSolve Integration and TaskManager Parallelization"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "BSD-style AND MIT"}
authors = [
    {name = "Oleg Chubar", email = "chubar@bnl.gov"},
    {name = "Pascal Elleaume"},
]
maintainers = [
    {name = "Radia Development Team"},
]
keywords = ["magnetostatics", "magnetic field", "radia", "ngsolve", "fem", "synchrotron", "cubit", "mesh", "export", "gmsh", "nastran", "vtk", "netgen"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.20",
    "mkl>=2024.2.0",
    "intel-cmplr-lib-rt>=2024.2.0",
    # NGSolve + Netgen-mesher pinned to 6.2.2603 as a matched pair
    # (netgen fork is built against this version; pip's resolver does
    # not auto-tie the two when only ngsolve is constrained — a plain
    # `pip install ngsolve==6.2.2603` can still downgrade netgen-mesher
    # to 6.2.2602.post1 if another path allows it).
    # ksugahar/netgen fork adds CallbackGeometry + SetGeomInfo (PR#232 pending)
    # Fork wheel: https://github.com/ksugahar/netgen/releases
    # Install: python install_full.py (radia + netgen fork in one command)
    # Without the fork: export_NGSolveCurvedMesh() will not work
    # NOTE (2026-05-13): tried bumping to 6.2.2604; reverted because
    # 2604 switched the BLAS backend to OpenBLAS (new `ngsolve-openblas`
    # mandatory dep) which conflicts with CLAUDE.md "Intel MKL only"
    # policy, AND because the upstream HTool callback bridge added in
    # 2604 (commit d90c59ea) is NOT yet wired into `use_hmatrix=` kwargs
    # on LaplaceSL/HelmholtzSL/etc. -- the kwarg is silently absorbed
    # by **kwargs and ignored. Wait for Joachim's full HTool wiring
    # before bumping again; that bump will also need to rebuild the
    # `_radia_pybind.pyd` (NGSolve `ngfem::CoefficientFunction` ABI
    # changed between 2603 and 2604, causing import-time failure).
    "ngsolve==6.2.2603",
    "netgen-mesher==6.2.2603",
    # MCP server dependency (optional, for Claude Code / Cursor integration)
    "mcp>=1.0.0",
]

[project.optional-dependencies]
cubit = [
    "cubit-mesh-export",
]
build123d = [
    # Pythonic OCCT front-end used by PEEC coil-from-shape helpers
    # (label / color reading, STEP XCAF access). netgen.occ does not
    # expose XCAF labels, so a pythonocc-core-based reader is required
    # when the user wants labeled STEP ports.
    "build123d>=0.9",
]
gui = [
    "PySide6>=6.5",
]
viz = [
    "pyvista>=0.40",
    "matplotlib>=3.5",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-rerunfailures>=12.0",
    "mcp>=1.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-rerunfailures>=12.0",
    "pyvista>=0.40",
    "matplotlib>=3.5",
]

[project.urls]
Homepage = "https://github.com/ksugahar/Radia"
Documentation = "https://github.com/ksugahar/Radia/blob/main/README.md"
Repository = "https://github.com/ksugahar/Radia"
Issues = "https://github.com/ksugahar/Radia/issues"
"Original Radia" = "https://github.com/ochubar/Radia"
"ESRF Radia Page" = "https://www.esrf.fr/Accelerators/Groups/InsertionDevices/Software/Radia"

[project.scripts]
radia-ih = "radia.radia_ih:main"
radia-em = "radia.radia_em:main"
radia-pcb = "radia.radia_pcb:main"
# CLI for .vol/.sol viewer (also exposed as a gui-script below).
# Use the CLI form when you want stdout (e.g. --register / probing);
# use the gui-script (radia-vol-viewer-gui.exe) for the Windows file
# association so no console window flashes on double-click.
radia-vol-viewer = "radia.tools.vol_sol_viewer:main"
# radia-heat: removed in v4.62.0; heat analysis is now Method =
# "Thermal" in radia-ih (v4.59.0).  The HeatPanel sub-widget lives
# in src/radia/_heat_panel.py.
# Plugin + panels: cubit-plugin-install (from cubit-mesh-export)
# MCP servers: radia-mcp package (pip install radia-mcp)

[project.gui-scripts]
# Windowless launcher used by the Windows .vol / .sol file
# association (`radia-vol-viewer --register` writes this path into
# the registry).  Linked through pythonw.exe so no console flashes
# on double-click.
radia-vol-viewer-gui = "radia.tools.vol_sol_viewer:main"

[tool.setuptools.package-data]
radia = [
    "*.pyd", "*.pyi", "*.ccm", "*.ccl", "*.png", "*.ico",
    "resources/*.png", "resources/*.ico",
    "panels/samples/*.jou",
    "panels/samples/*.sol",
    "panels/samples/*.vol",
    "panels/samples/*.json",
    "panels/samples/*.py",
    "panels/samples/em_sample_bh.txt",
    "panels/*.json",
    "CONVENTIONS.md",
]

[tool.setuptools.exclude-package-data]
radia = [
    # NOTE: .py files are NOT excludable via exclude-package-data (only
    # non-Python data assets are).  panels/cub5_to_vol.py is therefore
    # not in this repo at all — the reference implementation lives in
    # to_developers/ngsolve/cub5_to_vol.py (gitignored, LAB local).
    # Debug/temp files that match package-data globs but should not ship
    "panels/samples/_*.jou",
    "panels/samples/_*.py",
    "panels/samples/test_*.jou",
    "panels/samples/test_*.py",
    "panels/samples/compare_*.py",
    "panels/_pconv_*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
]
filterwarnings = [
    "ignore:Netgen fork.*is NOT installed:UserWarning",
]
markers = [
    "basic: Basic functionality tests (fast)",
    "comprehensive: Comprehensive test suite",
    "advanced: Advanced features and edge cases",
    "performance: Performance and scaling tests",
    "slow: Tests that take more than 10 seconds",
    "benchmark: Performance benchmarks (not run by default)",
]
minversion = "7.0"
norecursedirs = [
    ".git",
    ".tox",
    "dist",
    "build",
    "*.egg",
    "__pycache__",
]

[tool.coverage.run]
source = ["radia"]
omit = [
    "tests/*",
    "examples/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
