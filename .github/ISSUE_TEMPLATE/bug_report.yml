name: Bug Report
description: Report a bug in Radia
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Please fill out the information below.

  - type: input
    id: radia-version
    attributes:
      label: Radia version
      description: "Output of `python -c \"import radia; print(radia.__version__)\"`"
      placeholder: "e.g. 2.3.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: "Output of `python --version`"
      placeholder: "e.g. Python 3.12.4"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - Windows Server 2022
        - Linux (Ubuntu)
        - Linux (Other)
        - macOS
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal code example or steps to reproduce the bug.
      render: python
      placeholder: |
        import radia as rad
        rad.UtiDelAll()
        rad.FldUnits('m')
        # ... minimal reproduction
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened. Include error messages or tracebacks if applicable.
      render: shell
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context (screenshots, related issues, MKL version, etc.)
    validations:
      required: false
