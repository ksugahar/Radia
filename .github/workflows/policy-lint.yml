name: Policy Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  policy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The 8 source policies live in ONE module, tools/policy_lint.py, which
      # is ALSO what tools/ci_preflight.py runs locally before a push -- so the
      # CI gate and the local pre-push gate can never drift.  See CLAUDE.md
      # "CI Preflight Policy".  The script prints PASS/FAIL per policy and
      # exits non-zero on any violation.
      #   1 no FldUnits() in examples        5 no generated files at repo root
      #   2 no tracked binaries              6 no legacy src/python import path
      #   3 no Helmholtz WAVE kernel in core 7 README.md in every examples/ dir
      #   4 no CblasColMajor in core (allowlist: rad_mmm_matrices /
      #     rad_relaxation_methods / rad_hacapk / rad_stream_function .cpp)
      #   8 central HDiv geometry/order capability table
      - name: Policy lint (8 policies)
        run: python tools/policy_lint.py

      # radia-mcp PUBLISH BOUNDARY (CLAUDE.md 公開境界): the public package must
      # not attribute verification to, design-reference, or leak internal paths
      # of a commercial tool (COMSOL / FEMM / JMAG / CST).  This is a DIFFERENT
      # lint from the 8 source policies above (packages/radia-mcp/tools/, not
      # tools/).  Fast feedback here on every push / PR; build-test.yml ("CI")
      # runs it too so it also gates the PyPI publish.
      - name: Publish-boundary lint (radia-mcp provenance) + selftest
        run: |
          python packages/radia-mcp/tools/policy_lint.py --selftest
          python packages/radia-mcp/tools/policy_lint.py
