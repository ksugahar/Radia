name: Policy Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  policy-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The 8 source policies live in ONE module, tools/policy_lint.py, which
      # is ALSO what tools/ci_preflight.py runs locally before a push -- so the
      # CI gate and the local pre-push gate can never drift.  See CLAUDE.md
      # "CI Preflight Policy".  The script prints PASS/FAIL per policy and
      # exits non-zero on any violation.
      #   1 no FldUnits() in Radia source    5 no generated files at repo root
      #   2 no tracked binaries              6 no legacy src/python import path
      #   3 no Helmholtz WAVE kernel in core 7 no tracked retired examples/ tier
      #   4 no CblasColMajor in core (allowlist: rad_mmm_matrices /
      #     rad_relaxation_methods / rad_hacapk / rad_stream_function .cpp)
      #   8 central HDiv geometry/order capability table
      - name: Policy lint (including external public-name criteria)
        env:
          RADIA_PUBLIC_NAME_RULES_JSON: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && secrets.RADIA_PUBLIC_NAME_RULES_JSON || '' }}
        run: |
          python tools/policy_lint.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Distribution CI contract
        run: |
          python -m pip install pytest pyyaml
          python -m pytest tests/policy/ tests/test_sparsesolv_ci_contract.py -q

  repository-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install repository contract dependencies
        run: python -m pip install pytest pyyaml numpy scipy wheel setuptools -e packages/radia-mcp
      - name: Run cross-distribution source contracts
        run: python tools/run_test_tier.py --profile repo-contracts
      - name: Audit repository-wide TaskManager policy
        run: python tools/audit_taskmanager.py
      - name: Audit CI system installation policy
        run: python tools/audit_ci_no_system_install.py
      - name: Audit repository versions
        run: python tools/ci_preflight.py --only version
