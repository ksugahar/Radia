name: MATLAB LTspice data safety

on:
  push:
    branches: [main]
    paths:
      - 'packages/radia-simulink/matlab/+radia/+ltspice/readRaw*.m'
      - 'packages/radia-simulink/matlab/+radia/+ltspice/*TransientState.m'
      - 'tests/matlab/test_ltspice_data_safety.m'
      - 'tests/matlab/fixtures/ltspice_numdgt7*'
      - '.github/workflows/ltspice-data-safety.yml'
      - 'CMakeLists.txt'
      - 'Build.ps1'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'tests/test_tier_manifest.json'
      - 'tools/sparsesolv_ci_impact.py'
      - 'tools/ci_distribution_contract.py'
      - 'tools/ci_distribution_manifest.json'
      - '!**/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'packages/radia-simulink/matlab/+radia/+ltspice/readRaw*.m'
      - 'packages/radia-simulink/matlab/+radia/+ltspice/*TransientState.m'
      - 'tests/matlab/test_ltspice_data_safety.m'
      - 'tests/matlab/fixtures/ltspice_numdgt7*'
      - '.github/workflows/ltspice-data-safety.yml'
      - 'CMakeLists.txt'
      - 'Build.ps1'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'tests/test_tier_manifest.json'
      - 'tools/sparsesolv_ci_impact.py'
      - 'tools/ci_distribution_contract.py'
      - 'tools/ci_distribution_manifest.json'
      - '!**/*.md'
  workflow_dispatch:
    inputs:
      sha:
        description: Full source commit SHA for LTspice acceptance
        required: true
        type: string

permissions:
  contents: read

env:
  ACCEPTANCE_SHA: ${{ inputs.sha || github.sha }}

concurrency:
  group: ltspice-data-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-impact:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.route.outputs.required }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.ACCEPTANCE_SHA }}
      - name: Verify source commit
        shell: bash
        run: |
          [[ "$ACCEPTANCE_SHA" =~ ^[0-9a-f]{40}$ && "$(git rev-parse HEAD)" == "$ACCEPTANCE_SHA" ]]
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Route distribution impact
        id: route
        run: python tools/sparsesolv_ci_impact.py --lane ltspice-data-safety

  matlab-data-contracts:
    needs: [ci-impact]
    if: ${{ needs.ci-impact.outputs.required == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Windows, X64, "100"]
    timeout-minutes: 5
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.ACCEPTANCE_SHA }}
      - name: Test saved RAW fixtures through a dedicated MATLAB Engine
        shell: pwsh
        run: |
          if ($env:ACCEPTANCE_SHA -cnotmatch '^[0-9a-f]{40}$' -or (git rev-parse HEAD) -cne $env:ACCEPTANCE_SHA) {
            throw 'LTspice checkout does not match the requested source commit'
          }
          @'
          import hashlib, json, os, subprocess, sys, tempfile
          from pathlib import Path
          code = r"""
          import os
          import matlab.engine
          eng = matlab.engine.start_matlab('-nodesktop -nosplash')
          try:
              eng.cd(os.getcwd(), nargout=0)
              eng.eval("r = runtests('tests/matlab/test_ltspice_data_safety.m'); "
                       "disp(table(r)); assert(~isempty(r) && all([r.Passed]) "
                       "&& ~any([r.Incomplete]));", nargout=0)
          finally:
              eng.quit()
          print('LTSPICE_DATA_SAFETY_PASS', flush=True)
          """
          with tempfile.TemporaryFile() as log:
              child = subprocess.Popen([sys.executable, '-c', code],
                                       stdout=log, stderr=subprocess.STDOUT)
              try:
                  result = child.wait(timeout=180)
              except subprocess.TimeoutExpired:
                  subprocess.run(['taskkill', '/PID', str(child.pid), '/T', '/F'],
                                 check=True)
                  child.wait(timeout=20)
                  result = 124
              log.seek(0)
              output = log.read()
              print(output.decode('utf-8', errors='replace'), flush=True)
              marker = "LTSPICE_DATA_SAFETY_PASS"
              if result == 0:
                  if marker.encode() not in output.splitlines():
                      raise RuntimeError("MATLAB pass marker missing")
                  receipt = Path(os.environ["RUNNER_TEMP"]) / (
                      "ltspice-acceptance-" + os.environ["GITHUB_RUN_ID"] + "-" + os.environ["GITHUB_RUN_ATTEMPT"]
                  )
                  receipt.mkdir(exist_ok=False)
                  (receipt / "matlab.log").write_bytes(output)
                  (receipt / "ltspice_acceptance.json").write_text(json.dumps({
                      "source_commit": os.environ["ACCEPTANCE_SHA"],
                      "pass_marker": marker,
                      "log_sha256": hashlib.sha256(output).hexdigest(),
                  }, indent=2) + "\n", encoding="utf-8")
              raise SystemExit(result)
          '@ | python -
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        with:
          name: ltspice-acceptance
          path: ${{ runner.temp }}/ltspice-acceptance-${{ github.run_id }}-${{ github.run_attempt }}/
          if-no-files-found: error
