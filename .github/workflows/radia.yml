permissions:
  contents: read
  actions: write

concurrency:
  group: radia-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-impact:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.route.outputs.required }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Route distribution impact
        id: route
        run: python tools/sparsesolv_ci_impact.py --lane radia

  fast-contracts:
    needs: [ci-impact]
    # Fork code never executes on laboratory infrastructure. GitHub-hosted
    # package/policy workflows still cover that public contribution path.
    if: ${{ needs.ci-impact.outputs.required == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Windows, X64, ci-light]
    timeout-minutes: 20
    env:
      RADIA_SOURCE_ONLY_CONTRACTS: "1"

    steps:
      - name: Initialize runner-owned CI scratch
        shell: pwsh
        run: |
          if (-not $env:RUNNER_TEMP -or -not (Test-Path -LiteralPath $env:RUNNER_TEMP -PathType Container)) { throw 'RUNNER_TEMP is required for CI scratch.' }
          foreach ($key in @('TMP','TEMP','TMPDIR')) {
            "$key=$env:RUNNER_TEMP" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
          $output = Join-Path $env:RUNNER_TEMP "radia-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          "RADIA_CI_OUTPUT_DIR=$output" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          # A push may contain several commits; github.event.before must exist
          # for the impact selector to compare the complete pushed range.
          fetch-depth: 0

      - name: Create isolated fast-CI environment
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "radia-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = Join-Path $venv 'Scripts\python.exe'
          # Scalar BH contracts exercise SciPy PCHIP; wheel contracts repack RECORD.
          & $py -m pip install --disable-pip-version-check --quiet pytest pyyaml numpy scipy 'setuptools>=45' wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RADIA_FAST_PYTHON=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validate runner routing
        shell: pwsh
        run: |
          & $env:RADIA_FAST_PYTHON tools/ci_runner_routing.py
          exit $LASTEXITCODE

      - name: Test runner routing mutations
        shell: pwsh
        run: |
          & $env:RADIA_FAST_PYTHON -m pytest tests/ci_routing/test_runner_routing.py --confcutdir=tests/ci_routing -q -o addopts=
          exit $LASTEXITCODE

      - name: Compile public Python sources
        shell: pwsh
        run: |
          & $env:RADIA_FAST_PYTHON -m compileall -q src/radia
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Audit caller-owned TaskManager regions
        shell: pwsh
        run: |
          & $env:RADIA_FAST_PYTHON tools/audit_taskmanager.py --distribution radia
          exit $LASTEXITCODE

      - name: Check CPU package version
        shell: pwsh
        run: |
          & $env:RADIA_FAST_PYTHON -m pytest 'tests/test_version_consistency.py::test_pyproject_matches_init[radia]' -q
          exit $LASTEXITCODE

      - name: Run fast repository and notebook contracts
        shell: pwsh
        env:
          RADIA_IMPACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:RADIA_CI_OUTPUT_DIR | Out-Null
          & $env:RADIA_FAST_PYTHON tools/run_test_tier.py `
            --profile fast-contracts `
            --since "$env:RADIA_IMPACT_BASE" `
            --junitxml "$env:RADIA_CI_OUTPUT_DIR\fast-contracts.xml"
          exit $LASTEXITCODE

      - name: Check saved showcase results and reader contracts
        shell: pwsh
        run: |
          & $env:RADIA_FAST_PYTHON -m pytest tests/showcase/test_result_readers.py --confcutdir=tests/showcase --basetemp "$env:RADIA_CI_OUTPUT_DIR/showcase-temp" -q -o addopts=
          exit $LASTEXITCODE

      - name: Record exact CI ref context
        shell: pwsh
        run: |
          $context = [ordered]@{
            schema = 'radia.fast-ci-context.v1'
            ref = $env:GITHUB_REF
            ref_name = $env:GITHUB_REF_NAME
            ref_type = $env:GITHUB_REF_TYPE
            sha = $env:GITHUB_SHA
            run_id = [string]$env:GITHUB_RUN_ID
            event_name = $env:GITHUB_EVENT_NAME
          }
          [IO.File]::WriteAllText(
            (Join-Path $env:RADIA_CI_OUTPUT_DIR 'fast-ci-context.json'),
            ($context | ConvertTo-Json),
            [Text.UTF8Encoding]::new($false))

      - name: Upload fast-CI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radia-contracts
          path: ${{ env.RADIA_CI_OUTPUT_DIR }}
          if-no-files-found: ignore
          retention-days: 14
