name: radia-optuna

on:
  push:
    branches: [main]
    tags: ['radia-optuna-v*']
    paths:
      - 'packages/radia-optuna/**'
      - 'tests/matlab/fixtures/*optuna*'
      - 'tests/matlab/fixtures/generate_sobol_direction_numbers.py'
      - 'tests/matlab/fixtures/ltspice_rc.cir'
      - 'tests/matlab/test_optuna*.m'
      - 'tests/matlab/private/optuna*.m'
      - 'Build.ps1'
      - 'CMakeLists.txt'
      - 'validation_test/optimization/validate_optuna_cuda.m'
      - 'validation_test/radia_optuna/validate_cuda.m'
      - '.github/workflows/radia-optuna.yml'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'tests/test_tier_manifest.json'
      - 'tools/sparsesolv_ci_impact.py'
      - 'tools/ci_tree_receipt.py'
      - 'tools/ci_distribution_contract.py'
      - 'tools/ci_distribution_manifest.json'
      - 'tools/ci_gpu_artifact.py'
      - 'tests/test_ci_gpu_artifact.py'
      - '!**/*.md'
      - 'packages/radia-optuna/README.md'
      - 'packages/radia-optuna/MATLAB_README.md'
      - 'packages/radia-optuna/THIRD_PARTY_NOTICES.md'
      - 'packages/radia-optuna/OPTUNA_SIMULINK_LAB.md'
  pull_request:
    branches: [main]
    paths:
      - 'packages/radia-optuna/**'
      - 'tests/matlab/fixtures/*optuna*'
      - 'tests/matlab/fixtures/generate_sobol_direction_numbers.py'
      - 'tests/matlab/fixtures/ltspice_rc.cir'
      - 'tests/matlab/test_optuna*.m'
      - 'tests/matlab/private/optuna*.m'
      - 'Build.ps1'
      - 'CMakeLists.txt'
      - 'validation_test/optimization/validate_optuna_cuda.m'
      - 'validation_test/radia_optuna/validate_cuda.m'
      - '.github/workflows/radia-optuna.yml'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'tests/test_tier_manifest.json'
      - 'tools/sparsesolv_ci_impact.py'
      - 'tools/ci_tree_receipt.py'
      - 'tools/ci_distribution_contract.py'
      - 'tools/ci_distribution_manifest.json'
      - 'tools/ci_gpu_artifact.py'
      - 'tests/test_ci_gpu_artifact.py'
      - '!**/*.md'
      - 'packages/radia-optuna/README.md'
      - 'packages/radia-optuna/MATLAB_README.md'
      - 'packages/radia-optuna/THIRD_PARTY_NOTICES.md'
      - 'packages/radia-optuna/OPTUNA_SIMULINK_LAB.md'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: radia-optuna-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-impact:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.route.outputs.required }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Route distribution impact
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/sparsesolv_ci_impact.py --lane radia-optuna --tree-reuse
      - name: Record tested tree or verified reuse
        uses: actions/upload-artifact@v4
        with:
          name: radia-optuna-tree-identity
          path: ci-tree-receipt.json
          if-no-files-found: error
          retention-days: 30

  build-test:
    needs: [ci-impact]
    if: ${{ needs.ci-impact.outputs.required == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Windows, X64, "100", gpu-rtx]
    steps:
      - uses: actions/checkout@v4

      - name: Create run-local Python environment
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "radia-optuna-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = Join-Path $venv 'Scripts\python.exe'
          "RADIA_OPTUNA_CI_PYTHON=$py" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $venv 'Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build and verify Python kernels before linking plain MEX
        shell: pwsh
        run: |
          $root = (Get-Location).Path
          $package = Join-Path $root 'packages/radia-optuna'
          $requirements = (& $env:RADIA_OPTUNA_CI_PYTHON -c "import json,tomllib; d=tomllib.load(open('packages/radia-optuna/pyproject.toml','rb')); print(json.dumps(d['build-system']['requires']+d['project']['optional-dependencies']['test']+d['project']['optional-dependencies']['native']))") | ConvertFrom-Json
          & $env:RADIA_OPTUNA_CI_PYTHON -m pip install @requirements optuna==5.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $matlabRoot = Join-Path $env:ProgramFiles 'MATLAB/R2026a'
          $build = Join-Path $root 'build-optuna-native'
          & pwsh -NoProfile -File "$package/tools/build_native.ps1" -Stage python -Python $env:RADIA_OPTUNA_CI_PYTHON -MatlabRoot $matlabRoot -BuildDirectory $build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($mode in @('cpu','gpu')) {
            & $env:RADIA_OPTUNA_CI_PYTHON "$package/validation_test/validate_kernels.py" --backend $mode --build-receipt "$build/python-build.json" --report "$build/python-$mode-verification.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          & pwsh -NoProfile -File "$package/tools/build_native.ps1" -Stage matlab -Python $env:RADIA_OPTUNA_CI_PYTHON -MatlabRoot $matlabRoot -BuildDirectory $build -PythonVerification "$build/python-gpu-verification.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $escaped = $root.Replace("'", "''")
          & matlab -batch "addpath('$escaped/packages/radia-optuna/matlab'); addpath('$escaped/packages/radia-optuna/validation_test'); validate_binding_parity('$escaped/build-optuna-native/python-cpu-verification.json','$escaped/build-optuna-native/parity-cpu.json'); validate_binding_parity('$escaped/build-optuna-native/python-gpu-verification.json','$escaped/build-optuna-native/parity-gpu.json');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test, build, and verify radia-optuna wheel
        shell: pwsh
        run: |
          & $env:RADIA_OPTUNA_CI_PYTHON -m pip install build wheel pytest optuna==5.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:RADIA_OPTUNA_CI_PYTHON -m pytest packages\radia-optuna\tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A genuine radia-optuna build also runs the candidate contract at the
          # SHA that produces its wheel.  Release tooling alone does not trigger
          # this workflow; the fast-contracts lane covers it on every push.  The
          # contract needs no NGSolve, so the harness is told this is a partial run.
          $env:RADIA_TESTS_ALLOW_PARTIAL = '1'
          & $env:RADIA_OPTUNA_CI_PYTHON -m pytest tests\test_release_quad_optuna_candidate.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:RADIA_TESTS_ALLOW_PARTIAL
          Push-Location packages\radia-optuna
          try {
            & $env:RADIA_OPTUNA_CI_PYTHON -m build --wheel
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $wheels = @(Get-ChildItem dist\*.whl)
            if ($wheels.Count -ne 1) {
              throw "Expected one radia-optuna wheel, found $($wheels.Count)"
            }
            & $env:RADIA_OPTUNA_CI_PYTHON verify_wheel.py $wheels[0].FullName --json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - name: Verify CPU/GPU upstream TPE parity and density lifecycle
        shell: pwsh
        run: |
          $root = (Get-Location).Path.Replace("'", "''")
          & matlab -batch "addpath('$root/validation_test/optimization'); validate_optuna_cuda('$root','$root/build-optuna-cuda/cpu-selection-validation.json','cpu'); addpath('$root/validation_test/radia_optuna'); validate_cuda('$root','$root/packages/radia-optuna/matlab','$root/build-optuna-cuda/validation.json'); addpath('$root/validation_test/optimization'); validate_optuna_cuda('$root','$root/build-optuna-cuda/selection-validation.json');"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload radia-optuna wheel
        uses: actions/upload-artifact@v4
        with:
          name: radia-optuna-wheel
          path: packages/radia-optuna/dist/*.whl
          if-no-files-found: error
          retention-days: 7

      - name: Seal exact-SHA GPU wheel
        shell: pwsh
        run: |
          python -m pytest tests/test_ci_gpu_artifact.py --confcutdir=tests/ci_routing -q -o addopts=
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci_gpu_artifact.py seal "packages/radia-optuna/dist" --sha ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: gpu-optuna-wheel
          path: |
            packages/radia-optuna/dist/*.whl
            packages/radia-optuna/dist/gpu-artifact.json
          if-no-files-found: error
          retention-days: 30

  installed-wheel-matlab-e2e:
    if: ${{ needs.ci-impact.outputs.required == 'true' && (true) }}
    name: radia-optuna installed-wheel MATLAB/Simulink E2E
    needs: [ci-impact, build-test]
    runs-on: [self-hosted, Windows, X64, "100", gpu-rtx]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download the verified radia-optuna wheel
        uses: actions/download-artifact@v4
        with:
          name: radia-optuna-wheel
          path: dist/radia-optuna

      - name: Install and inspect only the built wheel
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem dist/radia-optuna/*.whl)
          if ($wheels.Count -ne 1) {
            throw "Expected one verified radia-optuna wheel, found $($wheels.Count)"
          }
          $venv = Join-Path $env:RUNNER_TEMP "radia-optuna-e2e-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $venvPython = Join-Path $venv 'Scripts/python.exe'
          & $venvPython -m pip install --disable-pip-version-check --no-deps $wheels[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & (Join-Path $venv 'Scripts/radia-optuna-doctor.exe') --json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installedMatlabPath = (& $venvPython -c 'from radia_optuna import matlab_path; print(matlab_path())').Trim()
          if (-not (Test-Path -LiteralPath $installedMatlabPath -PathType Container)) {
            throw "Installed MATLAB directory is missing: $installedMatlabPath"
          }
          $testDirectory = (Resolve-Path packages/radia-optuna/tests/matlab).ProviderPath
          "RADIA_OPTUNA_MATLAB_PATH=$installedMatlabPath" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RADIA_OPTUNA_TEST_PATH=$testDirectory" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Test installed wheel with standalone Simulink
        uses: matlab-actions/run-command@v3
        with:
          command: >-
            addpath(getenv('RADIA_OPTUNA_MATLAB_PATH'));
            addpath(getenv('RADIA_OPTUNA_TEST_PATH'));
            result=test_standalone_simulink(getenv('RADIA_OPTUNA_MATLAB_PATH'));
            assert(result.ok);
            fid=fopen('installed-wheel-simulink.json','w');
            fprintf(fid,'%s\n',jsonencode(result,PrettyPrint=true));
            fclose(fid);

      - name: Upload installed-wheel GPU and Simulink evidence
        uses: actions/upload-artifact@v4
        with:
          name: radia-optuna-simulink-gpu-acceptance
          path: installed-wheel-simulink.json
          if-no-files-found: error
