name: Release radia-mcp

# Triggered after the radia-mcp distribution CI succeeds.
on:
  workflow_run:
    workflows: ["radia-mcp"]
    types: [completed]

permissions:
  actions: read
  id-token: write
  contents: read

jobs:
  publish:
    # Only publish when CI succeeded AND a radia-mcp-v* tag points at this commit.
    # NOTE: workflow_run.head_branch returns 'main' (not the tag name) when the
    # triggering commit is on both a branch and a tag (GitHub Actions quirk).
    # Use git ls-remote to reliably detect the tag regardless of head_branch.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi

    steps:
      - name: Download exact CI ref context
        uses: actions/download-artifact@v4
        with:
          name: radia-mcp-ci-release-context
          path: radia-mcp-ci-release-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify triggering CI ran on a tag ref
        id: ref_check
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TAG_PREFIX: radia-mcp-v
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path("radia-mcp-ci-release-context/radia-mcp-ci-release-context.json")
          context = json.loads(path.read_text(encoding="utf-8"))
          if context.get("schema") != "radia-mcp.ci-release-context.v1":
              print("::error::Unknown radia-mcp CI release-context schema")
              sys.exit(1)
          if context.get("sha") != os.environ["SHA"] or str(context.get("run_id")) != os.environ["RUN_ID"]:
              print("::error::CI release-context does not match triggering workflow_run")
              sys.exit(1)
          tags = context.get("release_tags")
          if not isinstance(tags, list):
              print("::error::CI release-context has no release-tag snapshot")
              sys.exit(1)
          is_tag = context.get("ref_type") == "tag"
          eligible = is_tag and any(tag.startswith(os.environ["TAG_PREFIX"]) for tag in tags)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"is_tag={str(is_tag).lower()}\n")
              output.write(f"eligible={str(eligible).lower()}\n")
          print(f"CI ref context: {context.get('ref')} (tag={is_tag}, release_tags={tags})")
          PY

      - name: Check if a radia-mcp-v* tag points at this commit
        id: tag_check
        if: steps.ref_check.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          VTAG=$(git ls-remote --tags "$REPO_URL" 'refs/tags/radia-mcp-v*' \
                 | awk -v sha="$SHA" '$1 == sha {print $2}' \
                 | sed 's/\^{}//' | head -1)
          if [ -n "$VTAG" ]; then
            echo "found=true"  >> "$GITHUB_OUTPUT"
            echo "tag=$VTAG"   >> "$GITHUB_OUTPUT"
            echo "radia-mcp-v* tag for $SHA: $VTAG"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No radia-mcp-v* tag found for $SHA -- skipping PyPI publish"
          fi

      - name: Download radia-mcp wheel
        if: steps.tag_check.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: radia-mcp-wheel
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify wheel (exists + version consistency)
        if: steps.tag_check.outputs.found == 'true'
        run: |
          echo "=== radia-mcp wheel ==="
          ls -la dist/
          WHL=$(find dist -name '*.whl' | head -1)
          if [ -z "$WHL" ]; then
            echo "::error::No wheel found"
            exit 1
          fi
          echo "Wheel: $WHL"
          python3 - "$WHL" <<'PY'
          import sys, zipfile, re
          whl = sys.argv[1]
          zf = zipfile.ZipFile(whl)
          names = [f.filename for f in zf.infolist()]

          # Version consistency: the __version__ declared in __init__.py
          # must match the version in the wheel filename.  Mirrors the
          # check shipped in release-cubit-mesh-export.yml.  Without this
          # check, radia-mcp 0.36.6 (2026-05-02) silently published with
          # __init__.__version__ = "0.34.2" baked in, so the published
          # wheel had `radia_mcp.__version__ == "0.34.2"` while pip
          # reported `radia-mcp 0.36.6`.  Discovered + fixed in 0.36.7.
          whl_ver = re.match(r"[^-]+-([^-]+)-", whl.rsplit("/", 1)[-1]).group(1)
          init = zf.read(next(n for n in names
              if n.endswith("radia_mcp/__init__.py"))).decode()
          m = re.search(r'^__version__\s*=\s*"([^"]+)"', init, re.M)
          if not m:
              print("::error::__version__ not found in wheel __init__.py")
              sys.exit(1)
          pkg_ver = m.group(1)
          if whl_ver != pkg_ver:
              print(f"::error::Version mismatch -- wheel={whl_ver} "
                    f"vs __init__.__version__={pkg_ver}. "
                    f"Bump pyproject.toml AND src/radia_mcp/__init__.py "
                    f"in lockstep, not just one.")
              sys.exit(1)
          print(f"OK version consistency: {pkg_ver}")

          # PyPI Warehouse Summary length limit is 512 chars.  v0.72.0
          # / v0.73.0 / v0.74.0 silently failed publish-pypi (twine
          # reject) because pyproject.toml description grew past 512
          # when each release dumped its changelog there.  Fail fast
          # in CI so the next attempt doesn't burn another version
          # number on a Warehouse-side rejection.
          summary = next((l[len("Summary: "):] for l in
              zf.read(next(n for n in names
                  if n.endswith(".dist-info/METADATA"))).decode().splitlines()
              if l.startswith("Summary: ")), "")
          if len(summary) > 512:
              print(f"::error::Summary too long: {len(summary)} chars "
                    f"(PyPI Warehouse hard limit: 512).  Shorten "
                    f"pyproject.toml `description = ...` to <=512 chars; "
                    f"per-release notes go in CHANGELOG.md / README.md.")
              sys.exit(1)
          print(f"OK Summary length: {len(summary)} chars (<= 512)")
          PY

      - name: Publish to PyPI
        if: steps.tag_check.outputs.found == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
