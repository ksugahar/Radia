name: SparseSolv AMS

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ext/sparsesolv/**'
      - 'src/matlab/radia_mex.cpp'
      - 'matlab/+radia/+internal/callMex.m'
      - 'matlab/+radia/setup.m'
      - 'tests/matlab/test_mex_runtime_setup.m'
      - 'matlab/+radia/+sparsesolv/**'
      - 'matlab/+radia/+python/sparsesolv.m'
      - 'matlab/+radia/+python/electromagnetValidation.m'
      - 'matlab/+radia/+python/esrfExamples.m'
      - 'matlab/+radia/+python/staticElectromagnet.m'
      - 'matlab/python_api_parity_manifest.json'
      - 'tests/matlab/*sparsesolv*'
      - 'validation_test/ngsolve_matlab_parity/run_sparsesolv_parity.py'
      - 'src/radia/__init__.py'
      - 'CMakeLists.txt'
      - 'Build.ps1'
      - 'tools/native_build_provenance.ps1'
      - 'tests/test_native_build_provenance.py'
      - 'pyproject.toml'
      - 'tests/test_tier_manifest.json'
      - 'tools/run_test_tier.py'
      - 'tools/sparsesolv_ci_impact.py'
      - 'tests/test_sparsesolv_ci_contract.py'
      - '.github/workflows/sparsesolv.yml'
  push:
    branches: [main]
    paths:
      - 'src/ext/sparsesolv/**'
      - 'src/matlab/radia_mex.cpp'
      - 'matlab/+radia/+internal/callMex.m'
      - 'matlab/+radia/setup.m'
      - 'tests/matlab/test_mex_runtime_setup.m'
      - 'matlab/+radia/+sparsesolv/**'
      - 'matlab/+radia/+python/sparsesolv.m'
      - 'matlab/+radia/+python/electromagnetValidation.m'
      - 'matlab/+radia/+python/esrfExamples.m'
      - 'matlab/+radia/+python/staticElectromagnet.m'
      - 'matlab/python_api_parity_manifest.json'
      - 'tests/matlab/*sparsesolv*'
      - 'validation_test/ngsolve_matlab_parity/run_sparsesolv_parity.py'
      - 'src/radia/__init__.py'
      - 'CMakeLists.txt'
      - 'Build.ps1'
      - 'tools/native_build_provenance.ps1'
      - 'tests/test_native_build_provenance.py'
      - 'pyproject.toml'
      - 'tests/test_tier_manifest.json'
      - 'tools/run_test_tier.py'
      - 'tools/sparsesolv_ci_impact.py'
      - 'tests/test_sparsesolv_ci_contract.py'
      - '.github/workflows/sparsesolv.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sparsesolv-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ams-regression:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64, mdx]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select native AMS impact
        id: native-impact
        shell: pwsh
        run: |
          python tools/sparsesolv_ci_impact.py
          exit $LASTEXITCODE

      - name: Select MATLAB parity impact
        id: matlab-impact
        shell: pwsh
        run: |
          $workspace = $env:GITHUB_WORKSPACE -replace '\\', '/'
          $diff = @(git -c "safe.directory=$workspace" -C "$workspace" diff --name-only 'HEAD~1' HEAD -- 2>&1)
          $diffFailed = $LASTEXITCODE -ne 0
          $changed = @()
          if ($diffFailed) {
            Write-Warning "Cannot determine MATLAB impact in $env:GITHUB_WORKSPACE; running parity. $($diff -join ' ')"
          } else {
            $changed = $diff
          }
          $required = $diffFailed -or '${{ github.event_name }}' -eq 'workflow_dispatch'
          $required = $required -or [bool]($changed -match '^(src/ext/sparsesolv/|src/matlab/|matlab/\+radia/\+sparsesolv/|tests/matlab/.*sparsesolv|validation_test/ngsolve_matlab_parity/run_sparsesolv|CMakeLists.txt|Build.ps1|\.github/workflows/sparsesolv.yml)')
          $required = $required -or [bool]($changed -match '^matlab/(python_api_parity_manifest.json|\+radia/\+python/(sparsesolv|electromagnetValidation|esrfExamples|staticElectromagnet)\.m)')
          $required = $required -or [bool]($changed -match '^(matlab/\+radia/(setup\.m|\+internal/callMex\.m)|tests/matlab/test_mex_runtime_setup\.m)$')
          $required = $required -or ($changed -contains 'tools/native_build_provenance.ps1')
          "required=$($required.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "MATLAB parity required=$required; diff_failed=$diffFailed; changed_files=$($changed.Count)"
          exit 0

      - name: Create isolated native environment
        if: steps.native-impact.outputs.required == 'true'
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "sparsesolv-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ciPython = Join-Path $venv 'Scripts\python.exe'
          $pins = @(& $ciPython -c "import pathlib,tomllib; d=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); print(*[x for x in d['project']['dependencies'] if x.startswith(('ngsolve==','netgen-mesher=='))], sep='\n')")
          if ($LASTEXITCODE -ne 0 -or $pins.Count -ne 2) { throw 'Expected two exact FE runtime pins' }
          & $ciPython -m pip install @pins mkl-devel pybind11==3.0.2 ninja cmake pytest scipy pyyaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RADIA_CI_VENV=$venv" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $venv 'Scripts') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify native build provenance contracts
        if: steps.native-impact.outputs.required == 'true'
        shell: pwsh
        run: |
          python tools/run_test_tier.py --profile native-build-contracts
          exit $LASTEXITCODE

      - name: Build current package and SparseSolv
        if: steps.native-impact.outputs.required == 'true'
        shell: pwsh
        run: |
          # The package facade requires _radia_pybind; never borrow a developer binary.
          & .\Build.ps1 -RadiaOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = (& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vs) { throw 'MSVC installation not found' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          & cmd.exe /d /c "call `"$vcvars`" && cmake --build build-msvc --config Release --target sparsesolv_ngsolve --parallel 4"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify source provenance and run required AMS tests
        if: steps.native-impact.outputs.required == 'true'
        shell: pwsh
        env:
          PYTHONPATH: '${{ github.workspace }}\src'
        run: |
          python -c "import pathlib,radia.sparsesolv_ngsolve as s; p=pathlib.Path(s.__file__).resolve(); assert p.parent == (pathlib.Path.cwd()/'src'/'radia').resolve(), p; assert s.has_compact_ams(), 'AMS support missing'; print('tested native module:',p)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_test_tier.py --profile sparsesolv --junitxml "$env:RUNNER_TEMP\sparsesolv-results.xml"
          exit $LASTEXITCODE

      - name: Build and verify native MATLAB parity
        if: steps.native-impact.outputs.required == 'true' && steps.matlab-impact.outputs.required == 'true'
        shell: pwsh
        env:
          PYTHONPATH: '${{ github.workspace }}\src'
        run: |
          & .\Build.ps1 -MatlabMexOnly
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $matlab = Get-ChildItem "$env:ProgramFiles\MATLAB" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $matlab) { throw 'MATLAB installation required for native parity' }
          python -m pip install (Join-Path $matlab.FullName 'extern\engines\python')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python validation_test/ngsolve_matlab_parity/run_sparsesolv_parity.py --output "$env:RUNNER_TEMP\sparsesolv-matlab.json"
          exit $LASTEXITCODE

      - name: Upload solver test results
        if: always() && steps.native-impact.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sparsesolv-results
          path: |
            ${{ runner.temp }}/sparsesolv-results.xml
            ${{ runner.temp }}/sparsesolv-matlab.json
            build-msvc/build.log
          if-no-files-found: warn
