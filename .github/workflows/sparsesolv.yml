  schedule:
    - cron: '17 16 * * *'
  workflow_dispatch:
    inputs:
      force_validation:
        description: Execute full solver-heavy validation without receipt reuse
        type: boolean
        default: true


permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: sparsesolv-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-impact:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.route.outputs.required }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Route distribution impact
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/sparsesolv_ci_impact.py --lane sparsesolv --tree-reuse
      - name: Record tested tree or verified reuse
        uses: actions/upload-artifact@v4
        with:
          name: sparsesolv-tree-identity
          path: ci-tree-receipt.json
          if-no-files-found: error
          retention-days: 30

  ams-regression:
    needs: [ci-impact]
    if: ${{ needs.ci-impact.outputs.required == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Windows, X64, "100"]
    # CPU Python/pybind11 build and numerical contracts. GPU mexcuda has its own workflow.
    # Pull requests stop after the numerical contracts; other events add solver-heavy validation.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 120 }}
    env:
      RADIA_VALIDATION_HOST_ROLE: cpu_validation
      # Bound library pools before the parent and its fresh Python children
      # import NumPy/SciPy. NGSolve parallel tests select their worker counts.
      OMP_NUM_THREADS: '1'
      NGS_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # Receipt trust requires ancestry against fetched origin/main.
          fetch-depth: 0

      - name: Restore LF text in the reused runner workspace
        shell: pwsh
        run: |
          python tools/check_text_line_endings.py --worktree --repair
          exit $LASTEXITCODE

      - name: Select native AMS impact
        id: native-impact
        shell: pwsh
        run: |
          python tools/ci_numerical_plan.py --github-event --out "$env:RUNNER_TEMP/numerical-plan.json" --github-output "$env:GITHUB_OUTPUT"
          exit $LASTEXITCODE

      - name: Create isolated native environment
        if: steps.native-impact.outputs.required == 'true'
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "sparsesolv-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ciPython = Join-Path $venv 'Scripts\python.exe'
          $pins = @(& $ciPython -c "import pathlib,tomllib; d=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); print(*[x for x in d['project']['dependencies'] if x.startswith(('ngsolve==','netgen-mesher=='))], sep='\n')")
          if ($LASTEXITCODE -ne 0 -or $pins.Count -ne 2) { throw 'Expected two exact FE runtime pins' }
          $cadPins = @(& $ciPython -c "import pathlib,tomllib; d=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); print(*d['project']['optional-dependencies']['build123d'], sep='\n')")
          if ($LASTEXITCODE -ne 0 -or $cadPins.Count -eq 0) { throw 'Expected declared STEP CAD dependencies' }
          & $ciPython -m pip install @pins @cadPins mkl-devel pybind11==3.0.2 ninja cmake pytest scipy pyyaml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RADIA_CI_VENV=$venv" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          (Join-Path $venv 'Scripts') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install the independent Cubit mesh checker
        if: steps.native-impact.outputs.required == 'true' && (steps.native-impact.outputs.python_required == 'true' || steps.native-impact.outputs.heavy_required == 'true')
        shell: pwsh
        run: |
          python -m pip install --only-binary=:all: --no-deps cubit-mesh-export==2.4.0
          exit $LASTEXITCODE

      # Patched Netgen runtime (6.2.2608 + pyramid apex clamp + base-edge blend):
      # the checker refuses pyramid meshes on the stock library. The library lives in
      # a per-run, per-attempt directory; the cache only carries it through a fixed
      # transfer directory in this job's own runner scratch, which must not exist
      # before the restore and is never deleted here.
      - name: Prepare the patched Netgen paths
        id: netgen-overlay-paths
        if: steps.native-impact.outputs.required == 'true' && (steps.native-impact.outputs.python_required == 'true' || steps.native-impact.outputs.heavy_required == 'true')
        shell: pwsh
        run: |
          # The runner empties RUNNER_TEMP for every job, so a transfer directory present
          # before the restore was not made by this job: refuse it rather than delete it.
          $runnerTemp = Get-Item -LiteralPath $env:RUNNER_TEMP -Force
          if ($runnerTemp.Attributes -band [IO.FileAttributes]::ReparsePoint) { throw "$env:RUNNER_TEMP is a link; refusing the Netgen transfer" }
          $transfer = Join-Path $runnerTemp.FullName 'radia-netgen-overlay-cache'
          if (Test-Path -LiteralPath $transfer) { throw "$transfer exists before the restore; this job cannot prove it owns it" }
          $overlay = Join-Path $env:RUNNER_TEMP "radia-netgen-overlay-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if (Test-Path -LiteralPath $overlay) { throw "$overlay already exists; this attempt's library must start empty" }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = & $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $vs) { throw 'VS2022 build tools are required' }
          $toolset = (Get-Content -LiteralPath (Join-Path $vs 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          if ($toolset -notmatch '^14\.44\.[0-9]+$') { throw "MSVC 14.44 required for the Netgen library, found $toolset" }
          "overlay=$overlay" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "toolset=$toolset" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "vcvars=$(Join-Path $vs 'VC/Auxiliary/Build/vcvars64.bat')" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore the patched Netgen library
        id: netgen-overlay-cache
        if: steps.native-impact.outputs.required == 'true' && (steps.native-impact.outputs.python_required == 'true' || steps.native-impact.outputs.heavy_required == 'true')
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/radia-netgen-overlay-cache
          key: netgen-overlay-${{ runner.os }}-msvc${{ steps.netgen-overlay-paths.outputs.toolset }}-${{ hashFiles('tools/netgen_overlay.py', 'tools/patches/netgen-pyramid.patch') }}

      - name: Stage the cached Netgen library
        if: steps.native-impact.outputs.required == 'true' && (steps.native-impact.outputs.python_required == 'true' || steps.native-impact.outputs.heavy_required == 'true') && steps.netgen-overlay-cache.outputs.cache-hit == 'true'
        shell: pwsh
        run: |
          $overlay = '${{ steps.netgen-overlay-paths.outputs.overlay }}'
          New-Item -ItemType Directory -Path $overlay | Out-Null
          $transfer = Get-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'radia-netgen-overlay-cache') -Force
          $entries = @(Get-ChildItem -LiteralPath $transfer.FullName -Force)
          if (($transfer.Attributes -band [IO.FileAttributes]::ReparsePoint) -or
              (($entries | ForEach-Object Name | Sort-Object) -join ',') -ne 'netgen-overlay.json,nglib.dll' -or
              @($entries | Where-Object { $_.PSIsContainer -or ($_.Attributes -band [IO.FileAttributes]::ReparsePoint) }).Count) {
            throw "The restored Netgen transfer is not exactly the library and its receipt: $($entries.Name -join ', ')"
          }
          Copy-Item -LiteralPath (Join-Path $transfer.FullName 'nglib.dll'), (Join-Path $transfer.FullName 'netgen-overlay.json') -Destination $overlay

      - name: Build the patched Netgen library
        if: steps.native-impact.outputs.required == 'true' && (steps.native-impact.outputs.python_required == 'true' || steps.native-impact.outputs.heavy_required == 'true') && steps.netgen-overlay-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ciPython = Join-Path $env:RADIA_CI_VENV 'Scripts/python.exe'
          $vcvars = '${{ steps.netgen-overlay-paths.outputs.vcvars }}'
          $overlay = '${{ steps.netgen-overlay-paths.outputs.overlay }}'
          $work = Join-Path $env:RUNNER_TEMP "radia-netgen-work-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $bat = Join-Path $env:RUNNER_TEMP "build-netgen-overlay-$env:GITHUB_RUN_ID.cmd"
          @('@echo off', "call `"$vcvars`" > nul", 'if errorlevel 1 exit /b %errorlevel%',
            "`"$ciPython`" tools/netgen_overlay.py build --work `"$work`" --out `"$overlay`"",
            'exit /b %errorlevel%') | Set-Content -LiteralPath $bat -Encoding utf8
          & cmd.exe /d /c "`"$bat`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install the patched Netgen library into the CI venv
        if: steps.native-impact.outputs.required == 'true' && (steps.native-impact.outputs.python_required == 'true' || steps.native-impact.outputs.heavy_required == 'true')
        shell: pwsh
        run: |
          $ciPython = Join-Path $env:RADIA_CI_VENV 'Scripts/python.exe'
          # install re-verifies the receipt (upstream SHA, patch hash, library hash) of a restored library.
          & $ciPython tools/netgen_overlay.py install --overlay '${{ steps.netgen-overlay-paths.outputs.overlay }}' --python $ciPython
          if ($LASTEXITCODE -ne 0) { throw 'Patched Netgen install failed' }
          & $ciPython -c "from cubit_mesh_export.check import require_pyramid_netgen; require_pyramid_netgen(); print('patched Netgen pyramid runtime OK')"
          if ($LASTEXITCODE -ne 0) { throw 'The CI venv does not evaluate pyramids with the patched Netgen' }

      # Save as soon as the built library passes its probe, so a later test failure
      # does not force the next run to rebuild it.
      - name: Hand the built Netgen library to the cache
        if: steps.native-impact.outputs.required == 'true' && (steps.native-impact.outputs.python_required == 'true' || steps.native-impact.outputs.heavy_required == 'true') && steps.netgen-overlay-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $overlay = '${{ steps.netgen-overlay-paths.outputs.overlay }}'
          $transfer = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP 'radia-netgen-overlay-cache')
          Copy-Item -LiteralPath (Join-Path $overlay 'nglib.dll'), (Join-Path $overlay 'netgen-overlay.json') -Destination $transfer

      - name: Save the patched Netgen library
        if: steps.native-impact.outputs.required == 'true' && (steps.native-impact.outputs.python_required == 'true' || steps.native-impact.outputs.heavy_required == 'true') && steps.netgen-overlay-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/radia-netgen-overlay-cache
          key: ${{ steps.netgen-overlay-cache.outputs.cache-primary-key }}

      - name: Install Gmsh post-processing reference separately
        if: steps.native-impact.outputs.required == 'true' && steps.native-impact.outputs.gmsh_required == 'true'
        shell: pwsh
        env:
          PYTHONPATH: '${{ github.workspace }}\packages\radia-mcp\src'
        run: |
          # Resolve Gmsh alone; never mix its dedicated index with PyPI.
          python -m pip install --force-reinstall --no-deps --pre -i https://gmsh.info/python-packages-dev --report "$env:RUNNER_TEMP/gmsh-install.json" gmsh
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gmsh = @((Get-Content -Raw "$env:RUNNER_TEMP/gmsh-install.json" | ConvertFrom-Json).install |
            Where-Object { $_.metadata.name -eq 'gmsh' })
          if ($gmsh.Count -ne 1) { throw 'Expected one Gmsh install identity' }
          $url = [uri]$gmsh[0].download_info.url
          if ($url.Scheme -ne 'https' -or $url.Host -ne 'gmsh.info') {
            throw 'Gmsh must come from its official index'
          }
          $expected = $gmsh[0].download_info.archive_info.hashes.sha256
          if ($expected -cnotmatch '^[0-9a-f]{64}$') { throw 'Missing Gmsh wheel SHA256' }
          $archives = Join-Path $env:RUNNER_TEMP 'gmsh-wheel'
          python -m pip download --no-index --no-deps --dest $archives $url.AbsoluteUri
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $archives -Filter '*.whl' -File)
          if ($wheels.Count -ne 1) { throw 'Expected one original Gmsh wheel' }
          $actual = (Get-FileHash -LiteralPath $wheels[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Gmsh wheel hash differs from installer report' }
          $env:RADIA_GMSH_PROVENANCE = Join-Path $env:RUNNER_TEMP 'gmsh-provenance.json'
          # The source-owned recorder verifies both installed Python and DLL bytes.
          python -m radia_mcp.gmsh.runtime --wheel $wheels[0].FullName --record $env:RADIA_GMSH_PROVENANCE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import json,os,pathlib; from radia_mcp.gmsh.runtime import qualify_runtime; identity=qualify_runtime(); (pathlib.Path(os.environ['RUNNER_TEMP'])/'gmsh-runtime.json').write_text(json.dumps(identity,indent=2),encoding='utf-8')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RADIA_GMSH_PROVENANCE=$env:RADIA_GMSH_PROVENANCE" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify native build provenance contracts
        if: steps.native-impact.outputs.required == 'true' && steps.native-impact.outputs.native_required == 'true'
        shell: pwsh
        run: |
          python tools/run_test_tier.py --profile native-build-contracts --numerical-plan "$env:RUNNER_TEMP/numerical-plan.json"
          exit $LASTEXITCODE

      - name: Build current package and SparseSolv
        if: steps.native-impact.outputs.required == 'true' && steps.native-impact.outputs.native_required == 'true'
        shell: pwsh
        run: |
          . ./tools/native_build_provenance.ps1
          $auxiliarySource = Get-NativeBuildSourceIdentity -RepoRoot $PWD.Path
          # The package facade requires _radia_pybind; never borrow a developer binary.
          # Bound MSVC commit usage on shared runners (C1060 at four jobs).
          & .\Build.ps1 -RadiaOnly -BuildJobs 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Required axisymmetric solver tests import radia.axifem; build the
          # native extension explicitly instead of borrowing or skipping it.
          & .\Build.ps1 -AxiFemOnly -BuildJobs 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = (& $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $vs) { throw 'MSVC installation not found' }
          $toolset = (Get-Content -LiteralPath (Join-Path $vs 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          if ($toolset -notmatch '^14\.44\.[0-9]+$') { throw "MSVC 14.44 required, found $toolset" }
          $compiler = Join-Path $vs "VC/Tools/MSVC/$toolset/bin/Hostx64/x64/cl.exe"
          if ((Get-Item -LiteralPath $compiler).VersionInfo.FileVersion -notmatch '^19\.44\.') { throw 'cl.exe 19.44 required' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          & cmd.exe /d /c "call `"$vcvars`" && cmake --build build-msvc --config Release --target sparsesolv_ngsolve peec_matrices --parallel 2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('sparsesolv_ngsolve.pyd', 'peec_matrices.pyd', 'axifem.pyd')) {
            Write-NativeBuildProvenance -BinaryPath (Join-Path $PWD.Path "src/radia/$name") -RepoRoot $PWD.Path -StartIdentity $auxiliarySource -BuildDirectory 'build-msvc'
          }

      - name: Verify source provenance and run required AMS tests
        if: steps.native-impact.outputs.required == 'true' && steps.native-impact.outputs.ams_required == 'true'
        shell: pwsh
        env:
          PYTHONPATH: '${{ github.workspace }}\src'
        run: |
          python -c "import pathlib,radia.sparsesolv_ngsolve as s; p=pathlib.Path(s.__file__).resolve(); assert p.parent == (pathlib.Path.cwd()/'src'/'radia').resolve(), p; assert s.has_compact_ams(), 'AMS support missing'; print('tested native module:',p)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import pathlib,importlib.machinery,radia.peec_matrices as p; assert isinstance(p.__loader__,importlib.machinery.ExtensionFileLoader), p.__file__; assert pathlib.Path(p.__file__).resolve().parent == (pathlib.Path.cwd()/'src'/'radia').resolve(); assert hasattr(p,'PEECBuilder'); print('tested PEEC module:',p.__file__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_test_tier.py --profile sparsesolv --numerical-plan "$env:RUNNER_TEMP/numerical-plan.json" --junitxml "$env:RUNNER_TEMP\sparsesolv-results.xml"
          exit $LASTEXITCODE

      - name: Run required NGSolve numerical contracts
        if: steps.native-impact.outputs.required == 'true' && steps.native-impact.outputs.python_required == 'true'
        shell: pwsh
        env:
          PYTHONPATH: '${{ github.workspace }}\src;${{ github.workspace }}\packages\radia-simulink\src;${{ github.workspace }}\packages\radia-mcp\src'
          RADIA_TESTS_ALLOW_PARTIAL: '0'
          RADIA_TEST_NGSOLVE_THREADS: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import ngsolve, radia; print('NGSolve:', ngsolve.__version__); print('Radia:', radia.__file__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/run_test_tier.py --profile solver-numerics --numerical-plan "$env:RUNNER_TEMP/numerical-plan.json" --junitxml "$env:RUNNER_TEMP\solver-numerics.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import os, pathlib, xml.etree.ElementTree as ET; p=pathlib.Path(os.environ['RUNNER_TEMP'])/'solver-numerics.xml'; cases=list(ET.parse(p).iter('testcase')); assert cases and all(c.find('skipped') is None for c in cases), 'required numerical tests must execute without skips'; print('Executed numerical cases:', len(cases))"
          exit $LASTEXITCODE

      # Solver-heavy validation runs on main pushes, the nightly schedule and dispatch,
      # never as a pull-request gate; the merged source is validated on main.
      - name: Validate solver-heavy source or verify trusted prior evidence
        id: heavy-validation
        if: github.event_name != 'pull_request' && steps.native-impact.outputs.required == 'true' && steps.native-impact.outputs.heavy_required == 'true'
        shell: pwsh
        env:
          PYTHONPATH: '${{ github.workspace }}\src;${{ github.workspace }}\packages\radia-simulink\src'
          RADIA_TESTS_ALLOW_PARTIAL: '0'
          RADIA_TEST_NGSOLVE_THREADS: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c "import ngsolve, radia; print('NGSolve:', ngsolve.__version__); print('Radia:', radia.__file__)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $forceArgs = @()
          # Exact per-case source/environment fingerprints govern trusted reuse; main pushes are not forced.
          if ('${{ github.event_name }}' -ne 'push' -and '${{ inputs.force_validation }}' -ne 'false') { $forceArgs = @('--force') }
          python tools/validation_source_gate.py --numerical-plan "$env:RUNNER_TEMP/numerical-plan.json" --output "$env:RUNNER_TEMP/solver-heavy-validation" @forceArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $verification = Get-Content -Raw "$env:RUNNER_TEMP/solver-heavy-validation/verification.json" | ConvertFrom-Json
          if ($verification.accepted -ne $true) { throw 'solver-heavy validation failed' }
          "mode=$($verification.mode)" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish executed solver-heavy source receipt
        if: success() && steps.heavy-validation.outputs.mode == 'execute'
        uses: actions/upload-artifact@v4
        with:
          name: solver-heavy-validation-v1
          path: |
            ${{ runner.temp }}/solver-heavy-validation/receipt.json
            ${{ runner.temp }}/solver-heavy-validation/solver-heavy.xml
          if-no-files-found: error
          retention-days: 30

      - name: Upload solver test results
        if: always() && steps.native-impact.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sparsesolv-results
          path: |
            ${{ runner.temp }}/numerical-plan.json
            ${{ runner.temp }}/gmsh-install.json
            ${{ runner.temp }}/gmsh-provenance.json
            ${{ runner.temp }}/gmsh-runtime.json
            ${{ runner.temp }}/sparsesolv-results.xml
            ${{ runner.temp }}/solver-numerics.xml
            ${{ runner.temp }}/solver-heavy-validation/verification.json
            ${{ runner.temp }}/solver-heavy-validation/solver-heavy.xml
            build-msvc/build.log
          if-no-files-found: warn

  nightly-failure:
    needs: [ci-impact, ams-regression]
    if: ${{ always() && github.event_name == 'schedule' && (needs.ci-impact.result != 'success' || needs.ams-regression.result != 'success') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'SparseSolv nightly numerical validation failed';
            const body = `Nightly failure: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', creator: 'github-actions[bot]'});
            const issue = issues.find(i => i.title === title && !i.pull_request);
            if (issue) await github.rest.issues.createComment({...context.repo, issue_number: issue.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
