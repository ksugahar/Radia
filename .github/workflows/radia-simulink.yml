  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: radia-simulink-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-impact:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.route.outputs.required }}
      reason: ${{ steps.route.outputs.reason }}
      gpu_required: ${{ steps.route.outputs.gpu_required }}
      gpu_reason: ${{ steps.route.outputs.gpu_reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Route distribution impact
        id: route
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/sparsesolv_ci_impact.py --lane radia-simulink --tree-reuse
      - name: Record tested tree or verified reuse
        uses: actions/upload-artifact@v4
        with:
          name: radia-simulink-tree-identity
          path: ci-tree-receipt.json
          if-no-files-found: error
          retention-days: 30

  python-contracts:
    needs: [ci-impact]
    if: ${{ needs.ci-impact.outputs.required == 'true' && needs.ci-impact.outputs.gpu_required != 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated Python contract environment
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "simulink-python-$env:GITHUB_RUN_ID"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts/python.exe'
          $pins = @(& $python -c "import pathlib,tomllib; d=tomllib.loads(pathlib.Path('packages/radia-simulink/pyproject.toml').read_text(encoding='utf-8')); print(*[x for x in d['project']['optional-dependencies']['gpu'] if x.startswith(('ngsolve==','netgen-mesher=='))],sep='\n')")
          if ($LASTEXITCODE -ne 0 -or $pins.Count -ne 2) { throw 'Expected exact FE contract pins' }
          & $python -m pip install @pins pytest build setuptools wheel numpy scipy h5py schemdraw "mcp>=1.21.1,<2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $venv 'Scripts') | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Run Python contracts and wheel metadata checks without GPU
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD/packages/radia-simulink/src;$PWD/packages/radia-mcp/src"
          python -m pytest packages/radia-simulink/tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = Join-Path $env:RUNNER_TEMP "simulink-metadata-$env:GITHUB_RUN_ID"
          python packages/radia-simulink/tools/check_wheel_metadata.py --out $metadata
          exit $LASTEXITCODE

  cuda-mex:
    needs: [ci-impact]
    if: ${{ needs.ci-impact.outputs.required == 'true' && needs.ci-impact.outputs.gpu_required == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Windows, X64, "100", gpu-rtx]
    timeout-minutes: 60
    env:
      RADIA_GPU_CI_BUILD: "1"
    steps:
      - name: Initialize runner-owned CI scratch
        shell: pwsh
        run: |
          if (-not $env:RUNNER_TEMP -or -not (Test-Path -LiteralPath $env:RUNNER_TEMP -PathType Container)) { throw 'RUNNER_TEMP is required for CI scratch.' }
          foreach ($key in @('TMP','TEMP','TMPDIR')) {
            "$key=$env:RUNNER_TEMP" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          }
      - uses: actions/checkout@v4
      - name: Prepare isolated mexcuda environment
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "radia-simulink-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts/python.exe'
          $pins = @(& $python -c "import pathlib,tomllib; d=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); print(*[x for x in d['project']['dependencies'] if x.startswith(('ngsolve==','netgen-mesher=='))],sep='\n')")
          if ($LASTEXITCODE -ne 0 -or $pins.Count -ne 2) { throw 'Expected exact FE reference pins' }
          $matlab = Get-ChildItem "$env:ProgramFiles/MATLAB" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $matlab) { throw 'MATLAB is required for mexcuda CI' }
          & $python -m pip install @pins numpy scipy h5py psutil build wheel pytest schemdraw mkl-devel "mcp>=1.21.1,<2" (Join-Path $matlab.FullName 'extern/engines/python')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $venv 'Scripts') | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Run owned C++ runtime and sparse symmetry acceptance
        shell: pwsh
        run: |
          python -m pip install cmake ninja
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $nativeBuild = Join-Path $env:RUNNER_TEMP "radia-simulink-native-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = (& $vswhere -latest -version '[17.0,18.0)' -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'MSVC installation not found' }
          $toolset = (Get-Content -LiteralPath (Join-Path $vs 'VC/Auxiliary/Build/Microsoft.VCToolsVersion.default.txt') -Raw).Trim()
          if ($toolset -notmatch '^14\.44\.[0-9]+$') { throw "MSVC 14.44 required, found $toolset" }
          $compiler = Join-Path $vs "VC/Tools/MSVC/$toolset/bin/Hostx64/x64/cl.exe"
          if ((Get-Item -LiteralPath $compiler).VersionInfo.FileVersion -notmatch '^19\.44\.') { throw 'cl.exe 19.44 required' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          & cmd.exe /d /c "call `"$vcvars`" && cmake -S packages/radia-simulink/tests/native -B `"$nativeBuild`" -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=cl"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cmd.exe /d /c "call `"$vcvars`" && cmake --build `"$nativeBuild`" --config Release --target test_radia_mex_sparse_symmetry test_radia_ih_thermal_acceptance test_ih_coupled_config test_ih_coupled_production_unavailable test_ih_coupled_domain_scenarios test_ih_coupled_registry test_ih_coupled_runtime --parallel 2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir $nativeBuild -C Release -R '^radia\.((mex_sparse_symmetry|ih_thermal_acceptance|ih_coupled_config|ih_coupled_registry|ih_coupled_runtime)\.cpp|ih_domain\..+)$' --output-on-failure --no-tests=error
          exit $LASTEXITCODE
      - name: Build GPU mexcuda gateway
        shell: pwsh
        run: |
          & ./Build.ps1 -CudaMexOnly -RequireNativeProvenance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./Build.ps1 -AmsCudaOnly -RequireNativeProvenance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $mklRoot = python -c "import sys; from pathlib import Path; print(Path(sys.prefix)/'Library')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./Build.ps1 -HMatrixCudaOnly -HMatrixMklRoot $mklRoot -RequireNativeProvenance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $projectionStart = [DateTime]::UtcNow
          & ./Build.ps1 -ProjectionCudaOnly -RequireNativeProvenance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./Build.ps1 -FmmCudaOnly -RequireNativeProvenance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $commit = git rev-parse HEAD
          function Select-ExactBuild($candidates) {
            $accepted = @($candidates | Where-Object {
              $receipt = Join-Path $_.FullName 'build.json'
              if (-not (Test-Path -LiteralPath $receipt)) { return $false }
              $record = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
              return ($record.accepted -eq $true -and $record.source_dirty -eq $false -and $record.source_commit -eq $commit)
            } | Sort-Object LastWriteTimeUtc -Descending)
            if ($accepted.Count -eq 0) { throw 'Missing accepted exact-commit CUDA build' }
            return $accepted[0].FullName
          }
          $hmatrix = Select-ExactBuild (Get-ChildItem build-hmatrix-cuda -Directory -Filter 'job-*')
          $projection = Select-ExactBuild (Get-ChildItem -LiteralPath $env:RUNNER_TEMP -Directory -Filter 'projection-cuda-*' | Where-Object LastWriteTimeUtc -ge $projectionStart)
          $fmm = Select-ExactBuild (Get-ChildItem build-fmm-cuda -Directory -Filter 'job-*')
          "RADIA_HDIV_HMATRIX_BUILD=$hmatrix" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RADIA_HDIV_PROJECTION_BUILD=$projection" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "RADIA_FMM_BUILD=$fmm" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Verify GPU boundary and Poisson precision
        shell: pwsh
        run: |
          # Small installation acceptance; CI timings are not performance claims.
          python validation_test/ngsolve_cuda_mex/run_poisson.py --binary-dir build-cuda-mex --out "$env:RUNNER_TEMP/radia-simulink-acceptance-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --maxh 0.24 --threads 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python validation_test/ams_cuda/run.py --out "$env:RUNNER_TEMP/radia-ams-acceptance-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --maxh 0.5 --threads 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python validation_test/ams_cuda/setup_benchmark.py --out "$env:RUNNER_TEMP/radia-ams-setup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --maxh 0.08 --rounds 1 --setup-threads 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python validation_test/ams_cuda/fmm_physics.py --binary "$env:RADIA_FMM_BUILD" --out "$env:RUNNER_TEMP/radia-fmm-physics-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          exit $LASTEXITCODE
      - name: Verify IC accuracy and device-switch release lifecycle
        shell: pwsh
        run: |
          python validation_test/ic_cuda/run.py --binary-dir build-cuda-mex --matlab-dir packages/radia-simulink/matlab --out "$env:RUNNER_TEMP/radia-ic-accuracy-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python validation_test/ic_cuda/lifecycle_simulation.py --out "$env:RUNNER_TEMP/radia-ic-lifecycle-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          exit $LASTEXITCODE
      - name: Package and verify independent distribution
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$PWD/packages/radia-simulink/src;$PWD/packages/radia-mcp/src"
          python -m pytest packages/radia-simulink/tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m build --wheel --outdir "$env:RUNNER_TEMP/radia-simulink-wheel-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" packages/radia-simulink
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem "$env:RUNNER_TEMP/radia-simulink-wheel-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/radia_simulink-*.whl")
          if ($wheels.Count -ne 1) { throw 'Expected exactly one GPU wheel' }
          $wheel = $wheels[0]
          python packages/radia-simulink/verify_wheel.py $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installed = "$env:RUNNER_TEMP/radia-simulink-installed-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python -m venv $installed
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installedPython = Join-Path $installed 'Scripts/python.exe'
          & $installedPython -I -m pip install --no-deps $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python validation_test/radia_simulink/run_installed.py --installed-python $installedPython --wheel $wheel.FullName --out "$env:RUNNER_TEMP/radia-simulink-installed-acceptance-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gpuMatlab = & $installedPython -I -c "import radia_simulink; print(radia_simulink.matlab_path())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python validation_test/ams_cuda/run.py --gpu-dir $gpuMatlab --matlab-dir $gpuMatlab --out "$env:RUNNER_TEMP/radia-ams-installed-acceptance-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --maxh 0.5 --threads 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python validation_test/ams_cuda/nonlinear_resident.py --gpu-dir $gpuMatlab --matlab-dir $gpuMatlab --out "$env:RUNNER_TEMP/radia-ams-nonlinear-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --maxh 0.35 --threads 2 --setup-threads 2 --contract
          exit $LASTEXITCODE
      - name: Select public numerical evidence
        if: always()
        shell: pwsh
        run: |
          python packages/radia-simulink/prepare_ci_evidence.py --poisson "$env:RUNNER_TEMP/radia-simulink-acceptance-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --ams "$env:RUNNER_TEMP/radia-ams-installed-acceptance-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --setup "$env:RUNNER_TEMP/radia-ams-setup-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --nonlinear "$env:RUNNER_TEMP/radia-ams-nonlinear-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --fmm "$env:RUNNER_TEMP/radia-fmm-physics-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT" --output "$env:RUNNER_TEMP/radia-simulink-public-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radia-simulink-cuda-evidence
          path: |
            ${{ runner.temp }}/radia-simulink-wheel-${{ github.run_id }}-${{ github.run_attempt }}/*.whl
            ${{ runner.temp }}/radia-simulink-installed-acceptance-${{ github.run_id }}-${{ github.run_attempt }}/result.json
            ${{ runner.temp }}/radia-simulink-public-${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: error

      - name: Select portable projection build evidence
        if: always()
        shell: pwsh
        run: |
          @'
          import hashlib, json, os, re
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          out = root / ('projection-ci-evidence-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT'])
          out.mkdir()
          for path in root.glob('projection-cuda-*/build.json'):
              raw = path.read_bytes()
              record = json.loads(raw)
              public = {key: record[key] for key in ('accepted','source_commit','source_dirty','binary_sha256','source_sha256','matlab','taskmanager_started','lifecycle_diagnostic','fault_injection') if key in record}
              public['raw_receipt_sha256'] = hashlib.sha256(raw).hexdigest()
              toolchain = path.with_name('toolchain.json')
              if toolchain.is_file():
                  public['toolchain_receipt_sha256'] = hashlib.sha256(toolchain.read_bytes()).hexdigest()
                  details = json.loads(toolchain.read_bytes())
                  public['toolchain'] = {key: details[key] for key in ('cuda_selection','selector_sha256','profile_declared_cuda_version','profile_validation') if key in details}
                  versions = re.findall(r'14[.]44[.][0-9]+', details.get('msvc', ''))
                  public['toolchain']['msvc_toolsets'] = sorted(set(versions))
                  public['toolchain']['nvcc_releases'] = re.findall(r'release ([0-9]+[.][0-9]+)', details.get('nvcc_version', ''))
                  public['toolchain']['inputs'] = [{'name': Path(name).name, 'sha256': digest, 'origin_path_sha256': hashlib.sha256(name.encode()).hexdigest()} for name,digest in sorted(details.get('sha256', {}).items())]
              (out / (path.parent.name + '.json')).write_text(json.dumps(public, indent=2), encoding='utf-8')
          '@ | python
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain portable projection build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radia-simulink-projection-build
          path: ${{ runner.temp }}/projection-ci-evidence-${{ github.run_id }}-${{ github.run_attempt }}/*.json
          if-no-files-found: warn
          retention-days: 30

      - name: Seal exact-SHA GPU wheel
        shell: pwsh
        run: |
          python -m pytest tests/test_ci_gpu_artifact.py --confcutdir=tests/ci_routing -q -o addopts=
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/ci_gpu_artifact.py seal "${{ runner.temp }}/radia-simulink-wheel-${{ github.run_id }}-${{ github.run_attempt }}" --sha ${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: gpu-simulink-wheel
          path: |
            ${{ runner.temp }}/radia-simulink-wheel-${{ github.run_id }}-${{ github.run_attempt }}/*.whl
            ${{ runner.temp }}/radia-simulink-wheel-${{ github.run_id }}-${{ github.run_attempt }}/gpu-artifact.json
          if-no-files-found: error
          retention-days: 30
