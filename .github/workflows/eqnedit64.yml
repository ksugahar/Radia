name: Eqnedit64

on:
  push:
    branches: [main]
    tags: ['eqnedit64-v*']
    paths:
      - 'tools/eqnedit64/**'
      - 'packages/eqnedit64/**'
      - '.github/workflows/eqnedit64.yml'
      - '.github/workflows/release-eqnedit64-pypi.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/eqnedit64/**'
      - 'packages/eqnedit64/**'
      - '.github/workflows/eqnedit64.yml'
      - '.github/workflows/release-eqnedit64-pypi.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eqnedit64-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # Font registration tests run only in this disposable GitHub-hosted
    # session. They must not churn the interactive laboratory desktop's font
    # cache or disturb applications such as LINE and Office.
    runs-on: windows-2022
    env:
      EQNEDIT64_ISOLATED_TEST_SESSION: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: tools/eqnedit64
    steps:
      - uses: actions/checkout@v4

      - name: Record exact Eqnedit64 CI ref context
        working-directory: .
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'eqnedit64-ci-release-context'
          New-Item -ItemType Directory -Path $directory | Out-Null
          [ordered]@{
            schema = 'eqnedit64.ci-release-context.v1'
            ref = $env:GITHUB_REF
            ref_type = $env:GITHUB_REF_TYPE
            sha = $env:GITHUB_SHA
            run_id = [string]$env:GITHUB_RUN_ID
          } | ConvertTo-Json | Set-Content `
            -LiteralPath (Join-Path $directory 'context.json') -Encoding utf8

      - name: Upload exact Eqnedit64 CI ref context
        uses: actions/upload-artifact@v4
        with:
          name: eqnedit64-ci-release-context
          path: ${{ runner.temp }}/eqnedit64-ci-release-context/context.json
          if-no-files-found: error

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test build dependencies
        run: python -m pip install pybind11 pytest

      - name: Configure native build
        run: cmake -S . -B build_cmake -A x64

      - name: Build native targets
        run: cmake --build build_cmake --config Release --parallel 2

      - name: Build Eqnedit64 Python wheel candidate
        working-directory: .
        run: |
          python -m pip install build
          $env:EQNEDIT64_RELEASE_EXE = (Resolve-Path 'tools\eqnedit64\build_cmake\Release\Eqnedit64.exe').Path
          python -m build --wheel packages\eqnedit64

      - name: Verify installed Eqnedit64 wheel
        working-directory: .
        run: |
          $wheel = Get-ChildItem 'packages\eqnedit64\dist\eqnedit64-*.whl' | Select-Object -First 1
          python -m pip install --force-reinstall $wheel.FullName
          python packages\eqnedit64\tests\verify_installed.py

      - uses: actions/upload-artifact@v4
        with:
          name: eqnedit64-wheel-candidate
          path: packages/eqnedit64/dist/*.whl
          if-no-files-found: error

      - name: Run C++ document tests
        run: ctest --test-dir build_cmake -C Release --output-on-failure

      - name: Check Eqnedit64 Web contract
        working-directory: .
        run: python -m pytest tools/eqnedit64/tests/test_web_contract.py -q

      - name: Check Web JavaScript syntax
        run: |
          node --check web/equation-editor.js
          node tests/test_web_insert.cjs

      - name: Build headless model module
        run: cmd.exe /d /c build\build_pymodule.bat

      - name: Run model suites in one font-owning process
        run: python tests\run_model_tests.py

      - name: Run hidden executable checks
        run: |
          $app = Resolve-Path 'build_cmake\Release\Eqnedit64.exe'
          & $app --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $app --visual-scale-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $app --ui-interaction-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reject Windows session font-host damage
        run: >-
          pwsh -NoProfile -File build\test_font_session.ps1
          -AppPath build_cmake\Release\Eqnedit64.exe -Iterations 32

      - name: Check command-line image artifacts
        run: |
          $app = Resolve-Path 'build_cmake\Release\Eqnedit64.exe'
          $tex = Join-Path $env:RUNNER_TEMP 'eqnedit64-ci.tex'
          $png = Join-Path $env:RUNNER_TEMP 'eqnedit64-ci.png'
          $emf = Join-Path $env:RUNNER_TEMP 'eqnedit64-ci.emf'
          [IO.File]::WriteAllText($tex, '\[\frac{x_1+\alpha}{\sqrt{y}}\]', [Text.UTF8Encoding]::new($false))
          & $app $tex $png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $app $tex $emf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item $png).Length -le 8 -or (Get-Item $emf).Length -le 88) {
            throw 'Eqnedit64 CLI produced an empty image artifact'
          }
          $signature = [IO.File]::ReadAllBytes($png)[0..7]
          if ([Convert]::ToHexString($signature) -ne '89504E470D0A1A0A') {
            throw 'Eqnedit64 CLI output is not PNG'
          }

      - name: Check redirectable command-line diagnostics
        run: >-
          pwsh -NoProfile -File tests/test_cli_output.ps1
          -AppPath build_cmake/Release/Eqnedit64.exe
