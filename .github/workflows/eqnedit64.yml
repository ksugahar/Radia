name: Eqnedit64

on:
  push:
    branches: [main]
    tags: ['eqnedit64-v*']
    paths:
      - 'tools/eqnedit64/**'
      - 'packages/eqnedit64/**'
      - '.github/workflows/eqnedit64.yml'
      - '.github/workflows/release-eqnedit64-pypi.yml'
  pull_request:
    branches: [main]
    paths:
      - 'tools/eqnedit64/**'
      - 'packages/eqnedit64/**'
      - '.github/workflows/eqnedit64.yml'
      - '.github/workflows/release-eqnedit64-pypi.yml'
  workflow_dispatch:
    inputs:
      font_diagnostic:
        description: 'Run three isolated font-boundary arms, not release acceptance'
        type: boolean
        default: false
      font_dump:
        description: 'Two isolated same-binary model/self trials with restricted one-day dumps'
        type: boolean
        default: false
      font_dump_public_key:
        description: 'Base64 DER public encryption key; private key stays off GitHub'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: eqnedit64-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    if: ${{ inputs.font_diagnostic != true && inputs.font_dump != true }}
    # The browser edition is pure JavaScript plus a string-contract test, so it
    # answers in seconds on a free runner instead of waiting for the Windows
    # native build.  This is a fast-feedback lane, not a replacement: the
    # native job still runs for every change under tools/eqnedit64, because
    # tests/test_palettes.py compares the differential-geometry palette in
    # web/equation-editor.js against the native catalogue and therefore needs
    # the built module.  Path filters cannot tell which palette a Web edit
    # touched, so the native lane keeps its full scope.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/eqnedit64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test dependencies
        # fonttools reads the shipped math font's cmap so the palette-face
        # contract can be checked without a compiler or a registered font.
        run: python -m pip install pytest fonttools

      - name: Check Eqnedit64 Web contract
        run: |
          python build/generate_palettes.py --check
          python -m pytest tests/test_web_contract.py tests/test_node_dispatch.py tests/test_version_contract.py tests/test_palette_faces.py tests/test_palette_intent.py -q

      - name: Check Web JavaScript syntax and insertion behaviour
        run: |
          node --check web/equation-editor.js
          node tests/test_web_insert.cjs
          node tests/test_palette_intent.cjs

      - name: Check real browser palette rendering
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0 mathjax@3.2.2
          npx playwright install --with-deps chromium
          node tests/test_palette_browser.cjs

  build-test:
    if: ${{ inputs.font_diagnostic != true && inputs.font_dump != true }}
    # Font registration tests run only in this disposable GitHub-hosted
    # session. They must not churn the interactive laboratory desktop's font
    # cache or disturb applications such as LINE and Office.
    runs-on: windows-2022
    env:
      EQNEDIT64_ISOLATED_TEST_SESSION: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: tools/eqnedit64
    steps:
      - uses: actions/checkout@v4

      - name: Record exact Eqnedit64 CI ref context
        working-directory: .
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'eqnedit64-ci-release-context'
          New-Item -ItemType Directory -Path $directory | Out-Null
          [ordered]@{
            schema = 'eqnedit64.ci-release-context.v1'
            ref = $env:GITHUB_REF
            ref_type = $env:GITHUB_REF_TYPE
            sha = $env:GITHUB_SHA
            run_id = [string]$env:GITHUB_RUN_ID
          } | ConvertTo-Json | Set-Content `
            -LiteralPath (Join-Path $directory 'context.json') -Encoding utf8

      - name: Upload exact Eqnedit64 CI ref context
        uses: actions/upload-artifact@v4
        with:
          name: eqnedit64-ci-release-context
          path: ${{ runner.temp }}/eqnedit64-ci-release-context/context.json
          if-no-files-found: error

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test build dependencies
        run: python -m pip install pybind11 pytest

      - name: Configure native build
        run: cmake -S . -B build_cmake -A x64

      - name: Build native targets
        run: cmake --build build_cmake --config Release --parallel 2

      - name: Test font observation failure modes without native execution
        run: python -m pytest tests/test_font_session_observation.py -q

      - name: Enable isolated font lifecycle diagnostics
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'eqnedit64-font-trace'
          New-Item -ItemType Directory -Path $directory | Out-Null
          "EQNEDIT64_FONT_TRACE_DIR=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Observe first executable font lifecycles
        run: >-
          pwsh -NoProfile -File build\test_font_session.ps1
          -AppPath build_cmake\Release\Eqnedit64.exe -Iterations 32
          -OutputPath font-session-first.json

      - name: Build Eqnedit64 Python wheel candidate
        working-directory: .
        run: |
          python -m pip install build
          $env:EQNEDIT64_RELEASE_EXE = (Resolve-Path 'tools\eqnedit64\build_cmake\Release\Eqnedit64.exe').Path
          python -m build --wheel packages\eqnedit64

      - name: Verify installed Eqnedit64 wheel
        working-directory: .
        run: |
          $wheel = Get-ChildItem 'packages\eqnedit64\dist\eqnedit64-*.whl' | Select-Object -First 1
          python -m pip install --force-reinstall $wheel.FullName
          python packages\eqnedit64\tests\verify_installed.py

      - uses: actions/upload-artifact@v4
        with:
          name: eqnedit64-wheel-candidate
          path: packages/eqnedit64/dist/*.whl
          if-no-files-found: error

      - name: Run C++ document tests
        run: ctest --test-dir build_cmake -C Release --output-on-failure

      # The Web contract and JavaScript checks belong to the `web` job above,
      # which reports them in seconds on a free runner.

      - name: Build headless model module
        run: cmd.exe /d /c build\build_pymodule.bat

      - name: Run model suites in one font-owning process
        run: python tests\run_model_tests.py

      - name: Run hidden executable checks
        run: |
          $app = Resolve-Path 'build_cmake\Release\Eqnedit64.exe'
          $commands = @()
          try {
            foreach ($argument in @('--self-test', '--visual-scale-test', '--ui-interaction-test')) {
              $started = (Get-Date).ToUniversalTime().ToString('o')
              $process = Start-Process -FilePath $app -ArgumentList $argument -WindowStyle Hidden -Wait -PassThru
              $commands += [ordered]@{
                argument = $argument; pid = $process.Id; exit_code = $process.ExitCode
                started_utc = $started; ended_utc = (Get-Date).ToUniversalTime().ToString('o')
              }
              if ($process.ExitCode -ne 0) { throw "Hidden check failed: $argument" }
            }
          } finally {
            ConvertTo-Json -InputObject $commands -Depth 4 | Set-Content -LiteralPath `
              (Join-Path $env:EQNEDIT64_FONT_TRACE_DIR 'hidden-commands.json') -Encoding utf8
          }

      - name: Render native palette review proofs
        run: |
          New-Item -ItemType Directory palette-proofs | Out-Null
          & build_cmake\Release\test_palette_visual.exe palette-proofs > palette-proofs\cells.csv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (@(Get-ChildItem palette-proofs -Filter '*.png').Count -ne 120) {
            throw 'Expected 19 palettes at 3 DPIs in normal and selected states'
          }

      - uses: actions/upload-artifact@v4
        with:
          name: eqnedit64-palette-proofs
          path: tools/eqnedit64/palette-proofs/
          if-no-files-found: error

      - name: Reject Windows session font-host damage
        run: >-
          pwsh -NoProfile -File build\test_font_session.ps1
          -AppPath build_cmake\Release\Eqnedit64.exe -Iterations 32
          -OutputPath font-session-after-suites.json

      - name: Preserve font-host acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eqnedit64-font-session
          path: tools/eqnedit64/font-session-*.json
          if-no-files-found: warn

      - name: Check command-line image artifacts
        run: |
          $app = Resolve-Path 'build_cmake\Release\Eqnedit64.exe'
          $tex = Join-Path $env:RUNNER_TEMP 'eqnedit64-ci.tex'
          $png = Join-Path $env:RUNNER_TEMP 'eqnedit64-ci.png'
          $emf = Join-Path $env:RUNNER_TEMP 'eqnedit64-ci.emf'
          [IO.File]::WriteAllText($tex, '\[\frac{x_1+\alpha}{\sqrt{y}}\]', [Text.UTF8Encoding]::new($false))
          & $app $tex $png
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $app $tex $emf
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((Get-Item $png).Length -le 8 -or (Get-Item $emf).Length -le 88) {
            throw 'Eqnedit64 CLI produced an empty image artifact'
          }
          $signature = [IO.File]::ReadAllBytes($png)[0..7]
          if ([Convert]::ToHexString($signature) -ne '89504E470D0A1A0A') {
            throw 'Eqnedit64 CLI output is not PNG'
          }

      - name: Check redirectable command-line diagnostics
        run: >-
          pwsh -NoProfile -File tests/test_cli_output.ps1
          -AppPath build_cmake/Release/Eqnedit64.exe

      - name: Preserve isolated font lifecycle traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eqnedit64-font-trace
          path: ${{ runner.temp }}/eqnedit64-font-trace/
          if-no-files-found: warn

  font-boundary-diagnostic:
    if: ${{ inputs.font_diagnostic == true && inputs.font_dump != true }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        arm: [self, model-idle, model-self]
    env:
      EQNEDIT64_ISOLATED_TEST_SESSION: '1'
    defaults:
      run:
        shell: pwsh
        working-directory: tools/eqnedit64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile identical diagnostic sources without executing fonts
        run: |
          python -m pip install pybind11 pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S . -B build_cmake -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build_cmake --config Release --target Eqnedit64 --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd.exe /d /c build\build_pymodule.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe one fresh-session arm
        run: >-
          pwsh -NoProfile -File build/diagnose_font_boundary.ps1
          -Arm '${{ matrix.arm }}'
          -OutputDirectory '${{ runner.temp }}/font-boundary'
      - name: Preserve all diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-boundary-${{ matrix.arm }}
          path: ${{ runner.temp }}/font-boundary/
          if-no-files-found: warn

  font-dump-build:
    if: ${{ inputs.font_dump == true }}
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
        working-directory: tools/eqnedit64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build once without font execution
        run: |
          python -m pip install pybind11 pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S . -B build_cmake -A x64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build_cmake --config Release --target Eqnedit64 --parallel 2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmd.exe /d /c build\build_pymodule.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $files = @('build_cmake/Release/Eqnedit64.exe') + @(Get-ChildItem build/eqnedit_core*.pyd | ForEach-Object { 'build/' + $_.Name })
          if ($files.Count -ne 2) { throw 'Expected exactly one executable and one module.' }
          $records = @($files | ForEach-Object { [ordered]@{path=$_; sha256=(Get-FileHash $_ -Algorithm SHA256).Hash} })
          [ordered]@{source_sha=$env:GITHUB_SHA; files=$records} | ConvertTo-Json -Depth 4 | Set-Content font-binary-manifest.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: font-dump-binaries
          retention-days: 1
          if-no-files-found: error
          path: |
            tools/eqnedit64/build_cmake/Release/Eqnedit64.exe
            tools/eqnedit64/build/eqnedit_core*.pyd
            tools/eqnedit64/font-binary-manifest.json

  font-dump-trial:
    needs: font-dump-build
    if: ${{ inputs.font_dump == true }}
    runs-on: windows-2022
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2]
    env:
      EQNEDIT64_ISOLATED_TEST_SESSION: '1'
      FONT_DUMP_PUBLIC_KEY: ${{ inputs.font_dump_public_key }}
    defaults:
      run:
        shell: pwsh
        working-directory: tools/eqnedit64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: font-dump-binaries
          path: tools/eqnedit64
      - name: Verify identical binary payload
        run: |
          if (-not $env:FONT_DUMP_PUBLIC_KEY) { throw 'Public encryption key is required.' }
          python -m pip install cryptography
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python build/font_dump_crypto.py selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content font-binary-manifest.json -Raw | ConvertFrom-Json
          if ($manifest.source_sha -ne $env:GITHUB_SHA) { throw 'Source identity mismatch.' }
          foreach ($file in $manifest.files) {
            if ((Get-FileHash $file.path -Algorithm SHA256).Hash -ne $file.sha256) { throw 'Binary identity mismatch.' }
          }
      - name: Configure VM-only restricted crash dump collection
        run: >-
          pwsh -NoProfile -File build/enable_isolated_font_dumps.ps1
          -DumpDirectory '${{ runner.temp }}/font-dumps'
      - name: Observe model then self-test once
        run: >-
          pwsh -NoProfile -File build/diagnose_font_boundary.ps1
          -Arm model-self -OutputDirectory '${{ runner.temp }}/font-boundary'
      - name: Allow bounded WER dump completion
        if: always()
        run: Start-Sleep -Seconds 15
      - name: Preserve timeline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: font-dump-timeline-${{ matrix.trial }}
          path: ${{ runner.temp }}/font-boundary/
          if-no-files-found: warn
      - name: Encrypt private dump evidence before upload
        if: always()
        run: >-
          python build/font_dump_crypto.py encrypt
          --path '${{ runner.temp }}/font-dumps'
          --output '${{ runner.temp }}/encrypted-font-dumps/evidence.enc'
      - name: Preserve encrypted dumps for one day only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sensitive-font-dump-${{ matrix.trial }}
          retention-days: 1
          path: ${{ runner.temp }}/encrypted-font-dumps/
          if-no-files-found: warn
