name: cubit-mesh-export

on:
  push:
    branches: [main]
    tags: ['cubit-mesh-export-v*']
    paths:
      - 'packages/cubit-mesh-export/**'
      - 'src/cubit_plugin/**'
      - 'tests/test_cubit_standalone_gui.py'
      - 'tools/check_cubit_standalone.py'
      - 'tools/release_cubit_dual.py'
      - 'tests/test_release_cubit_dual.py'
      - 'tests/test_cubit_installers.py'
      - 'tests/test_cubit_mesh_quality.py'
      - 'tests/test_cubit_menu_startup.py'
      - 'tests/test_cubit_auto_kelvin_entry.py'
      - 'tools/audit_pyside6_only.py'
      - 'validation_test/cubit_mesh_export/**'
      - '.github/workflows/cubit-mesh-export.yml'
      - 'CMakeLists.txt'
      - 'Build.ps1'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'tests/test_tier_manifest.json'
      - 'tools/sparsesolv_ci_impact.py'
      - 'tools/ci_distribution_contract.py'
      - 'tools/ci_distribution_manifest.json'
      - '!**/*.md'
      - 'packages/cubit-mesh-export/README.md'
      - 'packages/cubit-mesh-export/src/cubit_mesh_export/mcp/README.md'
      - 'packages/cubit-mesh-export/src/cubit_mesh_export/mcp/_support/*.md'
  pull_request:
    branches: [main]
    paths:
      - 'packages/cubit-mesh-export/**'
      - 'src/cubit_plugin/**'
      - 'tests/test_cubit_standalone_gui.py'
      - 'tools/check_cubit_standalone.py'
      - 'tools/release_cubit_dual.py'
      - 'tests/test_release_cubit_dual.py'
      - 'tests/test_cubit_installers.py'
      - 'tests/test_cubit_mesh_quality.py'
      - 'tests/test_cubit_menu_startup.py'
      - 'tests/test_cubit_auto_kelvin_entry.py'
      - 'tools/audit_pyside6_only.py'
      - 'validation_test/cubit_mesh_export/**'
      - '.github/workflows/cubit-mesh-export.yml'
      - 'CMakeLists.txt'
      - 'Build.ps1'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'tests/test_tier_manifest.json'
      - 'tools/sparsesolv_ci_impact.py'
      - 'tools/ci_distribution_contract.py'
      - 'tools/ci_distribution_manifest.json'
      - '!**/*.md'
      - 'packages/cubit-mesh-export/README.md'
      - 'packages/cubit-mesh-export/src/cubit_mesh_export/mcp/README.md'
      - 'packages/cubit-mesh-export/src/cubit_mesh_export/mcp/_support/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cubit-mesh-export-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-impact:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.route.outputs.required }}
      reason: ${{ steps.route.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Route distribution impact
        id: route
        run: python tools/sparsesolv_ci_impact.py --lane cubit-mesh-export

  build-test:
    if: ${{ needs.ci-impact.outputs.required == 'true' && (true) }}
    needs: [ci-impact]
    outputs:
      wheel_artifact_id: ${{ steps.wheel-upload.outputs.artifact-id }}
      audit_artifact_id: ${{ steps.audit-upload.outputs.artifact-id }}
      build_identity_artifact_id: ${{ steps.built-identity-upload.outputs.artifact-id }}
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch the hash-pinned native curver
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $destination = 'packages\cubit-mesh-export\src\cubit_mesh_export'
          $manifestPath = Join-Path $destination 'native_payloads.json'
          $payload = (Get-Content -LiteralPath $manifestPath -Raw |
            ConvertFrom-Json).payloads.'cubit_mesh_curver.pyd'
          python tools\download_release_asset.py `
            --repo ${{ github.repository }} `
            --tag $payload.github_release_tag `
            --name $payload.asset_name `
            --dest $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $downloaded = Join-Path $destination $payload.asset_name
          $actualHash = (Get-FileHash -LiteralPath $downloaded `
            -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $payload.sha256 -or
              (Get-Item -LiteralPath $downloaded).Length -ne $payload.size) {
            throw "native curver does not match native_payloads.json"
          }
          Move-Item -LiteralPath $downloaded `
            -Destination (Join-Path $destination 'cubit_mesh_curver.pyd') `
            -Force
          python packages\cubit-mesh-export\src\cubit_mesh_export\_native_provenance.py `
            verify --repo-root . --package-dir $destination
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Materialize exact tagged package bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, subprocess, shutil
          sha = os.environ['GITHUB_SHA']
          stage = pathlib.Path(os.environ['RUNNER_TEMP']) / 'cubit-wheel-source'
          if stage.exists():
              raise SystemExit('wheel source stage must be fresh')
          stage.mkdir(parents=True)
          paths = subprocess.check_output(['git', 'ls-tree', '-r', '--name-only', '-z', sha, '--', 'packages/cubit-mesh-export', 'src/cubit_plugin', 'tools/find_cubit.ps1']).split(b'\0')
          for value in filter(None, paths):
              relative = pathlib.Path(value.decode('utf-8'))
              target = stage / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(subprocess.check_output(['git', 'show', sha + ':' + relative.as_posix()]))
          payload = pathlib.Path('packages/cubit-mesh-export/src/cubit_mesh_export/cubit_mesh_curver.pyd')
          shutil.copyfile(payload, stage / payload)
          with pathlib.Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as stream:
              stream.write('CUBIT_BUILD_ROOT=' + str(stage) + '\n')
          PY

      - name: Build and verify cubit-mesh-export wheel
        shell: pwsh
        run: |
          python -m pip install build wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stagedPackage = Join-Path $env:CUBIT_BUILD_ROOT 'packages\cubit-mesh-export'
          $wheelDir = Join-Path $env:GITHUB_WORKSPACE 'packages\cubit-mesh-export\dist'
          python -m build --wheel --outdir $wheelDir $stagedPackage
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheel = Get-ChildItem packages\cubit-mesh-export\dist\*.whl |
            Select-Object -First 1
          @'
          import hashlib, json, re, sys, zipfile
          wheel = sys.argv[1]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              required = ('cubit_mesh_export/cubit_mesh_export.ccm',
                          'cubit_mesh_export/cubit_mesh_curver.pyd',
                          'cubit_mesh_export/cubit_gui/solver_ready_sample.jou',
                          'cubit_mesh_export/cubit_gui/cubit_export_menu.py',
                          'cubit_mesh_export/cubit_gui/cubit_toolbar/toolbars/cubit_mesh_export_toolbar.ttb.tmpl',
                          'cubit_mesh_export/native_payloads.json')
              missing = [name for name in required if name not in names]
              if missing:
                  raise SystemExit(f'missing required wheel payloads: {missing}')
              retired = (
                  'cubit_mesh_export/cubit_gui/radia_export_menu.py',
                  'cubit_mesh_export/cubit_gui/cubit_toolbar/icons/radia_export.svg',
                  'cubit_mesh_export/cubit_gui/cubit_toolbar/toolbars/radia_export_toolbar.ttb.tmpl',
                  'cubit_mesh_export/cubit_gui/ih_bem_sample.jou',
                  'cubit_mesh_export/mcp/bootstrap.py',
              )
              leaked = [name for name in retired if name in names]
              if leaked:
                  raise SystemExit(f'retired GUI payloads leaked into wheel: {leaked}')
              init = archive.read('cubit_mesh_export/__init__.py').decode()
              native_manifest = json.loads(archive.read(
                  'cubit_mesh_export/native_payloads.json'))
              payload_contents = {
                  name: archive.read(f'cubit_mesh_export/{name}')
                  for name in ('cubit_mesh_export.ccm',
                               'cubit_mesh_curver.pyd')
              }
              wheel_meta_path = next(
                  name for name in names
                  if name.endswith('.dist-info/WHEEL'))
              wheel_meta = archive.read(wheel_meta_path).decode()
          package_version = re.search(r'^__version__\s*=\s*"([^"]+)"', init, re.M).group(1)
          wheel_version = re.match(r'[^-]+-([^-]+)-', wheel.rsplit('\\', 1)[-1]).group(1)
          if package_version != wheel_version:
              raise SystemExit(f'version mismatch: {package_version} != {wheel_version}')
          if not wheel.endswith('-cp312-cp312-win_amd64.whl'):
              raise SystemExit(f'wheel is not natively tagged: {wheel}')
          if 'Root-Is-Purelib: false' not in wheel_meta:
              raise SystemExit('native wheel incorrectly declares purelib root')
          for name in ('cubit_mesh_export.ccm', 'cubit_mesh_curver.pyd'):
              content = payload_contents[name]
              expected = native_manifest['payloads'][name]
              if (len(content) != expected['size'] or
                      hashlib.sha256(content).hexdigest() != expected['sha256']):
                  raise SystemExit(
                      f'wheel payload {name} does not match native_payloads.json')
          ccm = payload_contents['cubit_mesh_export.ccm']
          for retired_token in (b'CoilCommand', b'export jmag_nastran',
                                b'RadiaPlugin', b'RADIA_LAUNCHER_CONFIG'):
              if retired_token in ccm:
                  raise SystemExit(
                      f'retired native token leaked into wheel: {retired_token!r}')
          print(f'PASS cubit-mesh-export {package_version}: mandatory payloads present')
          '@ | python - $wheel.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record freshly built wheel bytes
        shell: bash
        env:
          WHEEL_DIR: packages/cubit-mesh-export/dist
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import zipfile
          wheels = list(Path(os.environ['WHEEL_DIR']).glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit('expected exactly one freshly built wheel')
          wheel = wheels[0]
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              if len(names) != len(set(names)):
                  raise SystemExit('duplicate wheel members')
              members = {name: hashlib.sha256(archive.read(name)).hexdigest() for name in names}
          identity = {'schema': 'cubit.built-wheel.v1', 'source_sha': os.environ['GITHUB_SHA'], 'wheel': wheel.name, 'sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(), 'members': members}
          target = Path('build-identity/built-wheel.json')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(identity, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Upload cubit-mesh-export wheel
        id: wheel-upload
        uses: actions/upload-artifact@v4
        with:
          name: cubit-mesh-export-wheel
          path: packages/cubit-mesh-export/dist/*.whl
          if-no-files-found: error
      - name: Upload freshly built wheel identity
        id: built-identity-upload
        uses: actions/upload-artifact@v4
        with:
          name: cubit-built-wheel-identity
          path: build-identity/built-wheel.json
          if-no-files-found: error

      - name: Check standalone Python sources
        shell: pwsh
        run: |
          python -m compileall -q packages\cubit-mesh-export\src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install setuptools pytest psutil numpy pefile `
            "netgen-mesher==6.2.2608" "ngsolve==6.2.2608"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PYTHONPATH = 'packages\cubit-mesh-export\src'
          python -m pytest tests\test_cubit_installers.py `
            tests\test_cubit_mesh_quality.py `
            tests\test_cubit_menu_startup.py tests\test_cubit_standalone_gui.py `
            tests\test_cubit_auto_kelvin_entry.py `
            packages\cubit-mesh-export\tests\test_toolbar_smoke.py `
            packages\cubit-mesh-export\tests\test_smoke_command.py `
            packages\cubit-mesh-export\tests\test_runtime_contract.py `
            packages\cubit-mesh-export\tests\test_native_curver_connectivity.py `
            packages\cubit-mesh-export\tests\test_native_curver_edge_callback.py `
            packages\cubit-mesh-export\tests\test_native_debug_paths.py `
            packages\cubit-mesh-export\tests\test_native_plugin_registry.py `
            tests\test_release_cubit_dual.py -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools\audit_pyside6_only.py
      - name: Verify installed standalone GUI assets without Radia
        shell: pwsh
        run: |
          $wheel = Get-ChildItem packages\cubit-mesh-export\dist\*.whl |
            Select-Object -First 1
          # Resolve Gmsh alone from its official dev index; other dependencies
          # stay on PyPI. Retain pip's original wheel hash for runtime evidence.
          $env:CUBIT_GMSH_INSTALL_REPORT = Join-Path $env:RUNNER_TEMP 'cubit-gmsh-install.json'
          python -m pip install --force-reinstall --no-deps --pre -i https://gmsh.info/python-packages-dev `
            gmsh --report $env:CUBIT_GMSH_INSTALL_REPORT
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "CUBIT_GMSH_INSTALL_REPORT=$env:CUBIT_GMSH_INSTALL_REPORT" >> $env:GITHUB_ENV
          $gmsh = @((Get-Content -Raw $env:CUBIT_GMSH_INSTALL_REPORT | ConvertFrom-Json).install |
            Where-Object { $_.metadata.name -eq 'gmsh' })
          if ($gmsh.Count -ne 1) { throw 'Expected one Gmsh install identity' }
          $url = [uri]$gmsh[0].download_info.url
          if ($url.Scheme -ne 'https' -or $url.Host -ne 'gmsh.info') {
            throw 'Gmsh must come from its official development index'
          }
          $archives = Join-Path $env:RUNNER_TEMP 'cubit-gmsh-wheel'
          python -m pip download --no-index --no-deps --dest $archives $url.AbsoluteUri
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wheels = @(Get-ChildItem -LiteralPath $archives -Filter '*.whl' -File)
          if ($wheels.Count -ne 1) { throw 'Expected one original Gmsh wheel' }
          $env:CUBIT_GMSH_WHEEL = $wheels[0].FullName
          $actual = (Get-FileHash -LiteralPath $env:CUBIT_GMSH_WHEEL -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $gmsh[0].download_info.archive_info.hashes.sha256) {
            throw 'Original Gmsh wheel hash does not match installer report'
          }
          "CUBIT_GMSH_WHEEL=$env:CUBIT_GMSH_WHEEL" >> $env:GITHUB_ENV
          # Resolve declared public dependencies normally; absence probes reject
          # Radia/private foundations. Feature tests use the wheel's extras.
          python -m pip install "$($wheel.FullName)[mesh-quality,sculpt,youtube]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          import json, os
          from pathlib import Path
          from cubit_mesh_export._gmsh_runtime import probe_gmsh5
          identity = probe_gmsh5()
          identity['source_sha'] = os.environ['GITHUB_SHA']
          (Path(os.environ['RUNNER_TEMP']) / 'cubit-gmsh-runtime.json').write_text(
              json.dumps(identity, indent=2), encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I tools\check_cubit_standalone.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m cubit_mesh_export.mcp.server --selftest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I packages\cubit-mesh-export\tools\check_mcp_standalone.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pytest packages\cubit-mesh-export\tests\mcp --confcutdir=packages\cubit-mesh-export\tests\mcp -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Retain Gmsh runtime identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cubit-mesh-export-gmsh-runtime
          path: ${{ runner.temp }}/cubit-gmsh-runtime.json
          if-no-files-found: warn
          retention-days: 30

      - name: Verify exact release identity before-approval
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'tag' && startsWith(github.ref_name, 'cubit-mesh-export-v') }}
        shell: bash
        env:
          WHEEL_DIR: packages/cubit-mesh-export/dist
          AUDIT_PHASE: before-approval
          WHEEL_ARTIFACT_ID: ${{ steps.wheel-upload.outputs.artifact-id }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, hashlib, subprocess, importlib.util, tomllib
          import urllib.request, urllib.error
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          env = os.environ
          ref = env['GITHUB_REF']
          tag = env['GITHUB_REF_NAME']
          sha = env['GITHUB_SHA']
          require(env['GITHUB_EVENT_NAME'] in {'push', 'workflow_dispatch'}, 'release event must be tag push or tag dispatch')
          require(env['GITHUB_REF_TYPE'] == 'tag' and ref == 'refs/tags/' + tag and tag.startswith('cubit-mesh-export-v'), 'publication requires exact Cubit tag ref')
          require(len(sha) == 40 and all(c in '0123456789abcdef' for c in sha), 'invalid source SHA')
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True, encoding='utf-8').strip()
          require(head == sha, 'checkout does not match triggering tag source')
          # Resolve annotated tags by their peeled commit; never trust a local stale tag.
          remote = subprocess.check_output(['git', '-c', 'credential.helper=', 'ls-remote', '--exit-code', 'origin', ref, ref + '^{}'], text=True, encoding='utf-8')
          refs = dict((name, value) for value, name in (line.split() for line in remote.splitlines()))
          require(ref in refs and refs.get(ref + '^{}', refs[ref]) == sha, 'remote tag moved or differs from source')
          expected = tag.removeprefix('cubit-mesh-export-v')
          package = Path('packages/cubit-mesh-export')
          project_version = tomllib.loads((package / 'pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          require(expected == project_version, 'tag differs from source package version')
          wheels = list(Path(env['WHEEL_DIR']).glob('*.whl'))
          require(len(wheels) == 1 and wheels[0].name.startswith('cubit_mesh_export-'), 'expected exactly one Cubit wheel')
          wheel = wheels[0]
          import email
          import pathlib
          import zipfile

          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata_name = next(
                  name for name in names if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(archive.read(metadata_name))
              ccm = archive.read("cubit_mesh_export/cubit_mesh_export.ccm")
          actual = metadata["Version"]
          if actual != expected:
              raise SystemExit(
                  f"wheel/tag version mismatch: wheel={actual}, tag={expected}"
              )
          required = ("cubit_mesh_export.ccm", "cubit_mesh_curver.pyd",
                      "cubit_gui/solver_ready_sample.jou",
                      "cubit_gui/cubit_export_menu.py",
                      "cubit_gui/cubit_toolbar/toolbars/cubit_mesh_export_toolbar.ttb.tmpl",
                      "native_payloads.json")
          missing = [item for item in required if not any(name.endswith(item) for name in names)]
          if missing:
              raise SystemExit(f"release wheel lacks mandatory payloads: {missing}")
          retired = ("radia_export_menu.py", "radia_export.svg",
                     "radia_export_toolbar.ttb.tmpl", "ih_bem_sample.jou",
                     "mcp/bootstrap.py")
          leaked = [item for item in retired if any(name.endswith(item) for name in names)]
          if leaked:
              raise SystemExit(f"release wheel contains retired GUI payloads: {leaked}")
          for retired_token in (b"CoilCommand", b"export jmag_nastran",
                                b"RadiaPlugin", b"RADIA_LAUNCHER_CONFIG"):
              if retired_token in ccm:
                  raise SystemExit(
                      f"release wheel contains retired native token: {retired_token!r}"
                  )
          print(f"release wheel verified: {wheel.name} ({actual})")
          with zipfile.ZipFile(wheel) as archive:
              require(len(archive.namelist()) == len(set(archive.namelist())), 'duplicate wheel members')
              manifest_bytes = archive.read('cubit_mesh_export/native_payloads.json')
              manifest = json.loads(manifest_bytes)
              source_manifest = json.loads((package / 'src/cubit_mesh_export/native_payloads.json').read_text(encoding='utf-8'))
              require(manifest == source_manifest, 'wheel native manifest differs from tagged source')
              require(metadata['Name'] == 'cubit-mesh-export', 'wrong wheel distribution')
              for name in ('cubit_mesh_export.ccm', 'cubit_mesh_curver.pyd'):
                  content = archive.read('cubit_mesh_export/' + name)
                  evidence = manifest['payloads'][name]
                  require(hashlib.sha256(content).hexdigest() == evidence['sha256'] and len(content) == evidence['size'], 'native payload hash/size differs: ' + name)
              require(archive.read('cubit_mesh_export/cubit_mesh_export.ccm') == (package / 'src/cubit_mesh_export/cubit_mesh_export.ccm').read_bytes(), 'CCM differs from tagged source')
          spec = importlib.util.spec_from_file_location('release_native_provenance', package / 'src/cubit_mesh_export/_native_provenance.py')
          provenance = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(provenance)
          digest, count = provenance.native_source_digest(Path.cwd())
          require(manifest['source']['tree_sha256'] == digest and manifest['source']['file_count'] == count, 'native source digest differs')
          require(bool(manifest['source']['commit']), 'native source provenance commit absent')
          require(env['WHEEL_ARTIFACT_ID'].isdigit(), 'invalid immutable wheel artifact ID')
          built_path = Path('build-identity/built-wheel.json')
          built = json.loads(built_path.read_text(encoding='utf-8'))
          require(built['schema'] == 'cubit.built-wheel.v1' and built['source_sha'] == sha and built['wheel'] == wheel.name, 'built wheel identity differs from tag')
          require(built['sha256'] == hashlib.sha256(wheel.read_bytes()).hexdigest(), 'wheel differs from immediate post-build identity')
          with zipfile.ZipFile(wheel) as archive:
              require(built['members'] == {name: hashlib.sha256(archive.read(name)).hexdigest() for name in archive.namelist()}, 'wheel members differ from immediate post-build identity')
              dist_info = 'cubit_mesh_export-' + expected + '.dist-info/'
              generated = {dist_info + name for name in ('METADATA', 'WHEEL', 'RECORD', 'entry_points.txt', 'top_level.txt')}
              for name in archive.namelist():
                  if name in generated:
                      # These are generated metadata, not source files: frozen by the
                      # immediate post-build artifact above, with version/name checked.
                      continue
                  if name in {'cubit_mesh_export/cubit_mesh_export.ccm', 'cubit_mesh_export/cubit_mesh_curver.pyd'}:
                      continue  # Independently checked against the signed native manifest.
                  if name.startswith('cubit_mesh_export/'):
                      relative = 'packages/cubit-mesh-export/src/' + name
                  elif name.startswith(dist_info + 'licenses/'):
                      relative = 'packages/cubit-mesh-export/' + name.removeprefix(dist_info + 'licenses/')
                  else:
                      raise SystemExit('unexpected non-source wheel member: ' + name)
                  require('..' not in Path(relative).parts, 'unsafe wheel member: ' + name)
                  tagged_bytes = subprocess.check_output(['git', 'show', sha + ':' + relative])
                  require(archive.read(name) == tagged_bytes, 'wheel member differs from tagged source: ' + name)
          receipt = {'schema': 'cubit.release-audit.v1', 'repository': env['GITHUB_REPOSITORY'], 'ref': ref, 'source_sha': sha, 'run_id': env['GITHUB_RUN_ID'], 'run_attempt': env['GITHUB_RUN_ATTEMPT'], 'artifact_id': env['WHEEL_ARTIFACT_ID'], 'wheel': wheel.name, 'wheel_sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(), 'native_manifest_sha256': hashlib.sha256(manifest_bytes).hexdigest(), 'built_identity_sha256': hashlib.sha256(built_path.read_bytes()).hexdigest()}
          record = Path('audit/release-audit.json')
          if env['AUDIT_PHASE'] == 'after-approval':
              require(json.loads(record.read_text(encoding='utf-8')) == receipt, 'approved artifact/ref identity changed')
          else:
              require(env['AUDIT_PHASE'] == 'before-approval', 'unknown audit phase')
          # Existing versions are failures, including an upload racing this check.
          try:
              with urllib.request.urlopen('https://pypi.org/pypi/cubit-mesh-export/' + expected + '/json', timeout=30):
                  raise SystemExit('version already exists on PyPI')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          if env['AUDIT_PHASE'] == 'before-approval':
              record.parent.mkdir(parents=True, exist_ok=True)
              record.write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print('exact tag, source, wheel, native provenance and immutable identity verified')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'tag' && startsWith(github.ref_name, 'cubit-mesh-export-v') }}
        id: audit-upload
        with:
          name: cubit-release-audit
          path: audit/release-audit.json
          if-no-files-found: error


  # Recovery: rerun ALL jobs and obtain approval again. Re-running publish
  # alone changes run_attempt and must fail the immutable audit comparison.
  publish:
    needs: [ci-impact, build-test]
    if: ${{ needs.ci-impact.outputs.required == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_type == 'tag' && startsWith(github.ref_name, 'cubit-mesh-export-v') }}
    environment: pypi
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download wheel built by this tag CI
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-test.outputs.wheel_artifact_id }}
          merge-multiple: true
          path: dist
      - name: Download immediate post-build identity
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-test.outputs.build_identity_artifact_id }}
          merge-multiple: true
          path: build-identity
      - name: Download pre-approval audit
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.build-test.outputs.audit_artifact_id }}
          merge-multiple: true
          path: audit
      - name: Verify exact release identity after-approval
        shell: bash
        env:
          WHEEL_DIR: dist
          AUDIT_PHASE: after-approval
          WHEEL_ARTIFACT_ID: ${{ needs.build-test.outputs.wheel_artifact_id }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, json, hashlib, subprocess, importlib.util, tomllib
          import urllib.request, urllib.error
          from pathlib import Path

          def require(condition, message):
              if not condition:
                  raise SystemExit(message)

          env = os.environ
          ref = env['GITHUB_REF']
          tag = env['GITHUB_REF_NAME']
          sha = env['GITHUB_SHA']
          require(env['GITHUB_EVENT_NAME'] in {'push', 'workflow_dispatch'}, 'release event must be tag push or tag dispatch')
          require(env['GITHUB_REF_TYPE'] == 'tag' and ref == 'refs/tags/' + tag and tag.startswith('cubit-mesh-export-v'), 'publication requires exact Cubit tag ref')
          require(len(sha) == 40 and all(c in '0123456789abcdef' for c in sha), 'invalid source SHA')
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True, encoding='utf-8').strip()
          require(head == sha, 'checkout does not match triggering tag source')
          # Resolve annotated tags by their peeled commit; never trust a local stale tag.
          remote = subprocess.check_output(['git', '-c', 'credential.helper=', 'ls-remote', '--exit-code', 'origin', ref, ref + '^{}'], text=True, encoding='utf-8')
          refs = dict((name, value) for value, name in (line.split() for line in remote.splitlines()))
          require(ref in refs and refs.get(ref + '^{}', refs[ref]) == sha, 'remote tag moved or differs from source')
          expected = tag.removeprefix('cubit-mesh-export-v')
          package = Path('packages/cubit-mesh-export')
          project_version = tomllib.loads((package / 'pyproject.toml').read_text(encoding='utf-8'))['project']['version']
          require(expected == project_version, 'tag differs from source package version')
          wheels = list(Path(env['WHEEL_DIR']).glob('*.whl'))
          require(len(wheels) == 1 and wheels[0].name.startswith('cubit_mesh_export-'), 'expected exactly one Cubit wheel')
          wheel = wheels[0]
          import email
          import pathlib
          import zipfile

          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              metadata_name = next(
                  name for name in names if name.endswith(".dist-info/METADATA")
              )
              metadata = email.message_from_bytes(archive.read(metadata_name))
              ccm = archive.read("cubit_mesh_export/cubit_mesh_export.ccm")
          actual = metadata["Version"]
          if actual != expected:
              raise SystemExit(
                  f"wheel/tag version mismatch: wheel={actual}, tag={expected}"
              )
          required = ("cubit_mesh_export.ccm", "cubit_mesh_curver.pyd",
                      "cubit_gui/solver_ready_sample.jou",
                      "cubit_gui/cubit_export_menu.py",
                      "cubit_gui/cubit_toolbar/toolbars/cubit_mesh_export_toolbar.ttb.tmpl",
                      "native_payloads.json")
          missing = [item for item in required if not any(name.endswith(item) for name in names)]
          if missing:
              raise SystemExit(f"release wheel lacks mandatory payloads: {missing}")
          retired = ("radia_export_menu.py", "radia_export.svg",
                     "radia_export_toolbar.ttb.tmpl", "ih_bem_sample.jou",
                     "mcp/bootstrap.py")
          leaked = [item for item in retired if any(name.endswith(item) for name in names)]
          if leaked:
              raise SystemExit(f"release wheel contains retired GUI payloads: {leaked}")
          for retired_token in (b"CoilCommand", b"export jmag_nastran",
                                b"RadiaPlugin", b"RADIA_LAUNCHER_CONFIG"):
              if retired_token in ccm:
                  raise SystemExit(
                      f"release wheel contains retired native token: {retired_token!r}"
                  )
          print(f"release wheel verified: {wheel.name} ({actual})")
          with zipfile.ZipFile(wheel) as archive:
              require(len(archive.namelist()) == len(set(archive.namelist())), 'duplicate wheel members')
              manifest_bytes = archive.read('cubit_mesh_export/native_payloads.json')
              manifest = json.loads(manifest_bytes)
              source_manifest = json.loads((package / 'src/cubit_mesh_export/native_payloads.json').read_text(encoding='utf-8'))
              require(manifest == source_manifest, 'wheel native manifest differs from tagged source')
              require(metadata['Name'] == 'cubit-mesh-export', 'wrong wheel distribution')
              for name in ('cubit_mesh_export.ccm', 'cubit_mesh_curver.pyd'):
                  content = archive.read('cubit_mesh_export/' + name)
                  evidence = manifest['payloads'][name]
                  require(hashlib.sha256(content).hexdigest() == evidence['sha256'] and len(content) == evidence['size'], 'native payload hash/size differs: ' + name)
              require(archive.read('cubit_mesh_export/cubit_mesh_export.ccm') == (package / 'src/cubit_mesh_export/cubit_mesh_export.ccm').read_bytes(), 'CCM differs from tagged source')
          spec = importlib.util.spec_from_file_location('release_native_provenance', package / 'src/cubit_mesh_export/_native_provenance.py')
          provenance = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(provenance)
          digest, count = provenance.native_source_digest(Path.cwd())
          require(manifest['source']['tree_sha256'] == digest and manifest['source']['file_count'] == count, 'native source digest differs')
          require(bool(manifest['source']['commit']), 'native source provenance commit absent')
          require(env['WHEEL_ARTIFACT_ID'].isdigit(), 'invalid immutable wheel artifact ID')
          built_path = Path('build-identity/built-wheel.json')
          built = json.loads(built_path.read_text(encoding='utf-8'))
          require(built['schema'] == 'cubit.built-wheel.v1' and built['source_sha'] == sha and built['wheel'] == wheel.name, 'built wheel identity differs from tag')
          require(built['sha256'] == hashlib.sha256(wheel.read_bytes()).hexdigest(), 'wheel differs from immediate post-build identity')
          with zipfile.ZipFile(wheel) as archive:
              require(built['members'] == {name: hashlib.sha256(archive.read(name)).hexdigest() for name in archive.namelist()}, 'wheel members differ from immediate post-build identity')
              dist_info = 'cubit_mesh_export-' + expected + '.dist-info/'
              generated = {dist_info + name for name in ('METADATA', 'WHEEL', 'RECORD', 'entry_points.txt', 'top_level.txt')}
              for name in archive.namelist():
                  if name in generated:
                      # These are generated metadata, not source files: frozen by the
                      # immediate post-build artifact above, with version/name checked.
                      continue
                  if name in {'cubit_mesh_export/cubit_mesh_export.ccm', 'cubit_mesh_export/cubit_mesh_curver.pyd'}:
                      continue  # Independently checked against the signed native manifest.
                  if name.startswith('cubit_mesh_export/'):
                      relative = 'packages/cubit-mesh-export/src/' + name
                  elif name.startswith(dist_info + 'licenses/'):
                      relative = 'packages/cubit-mesh-export/' + name.removeprefix(dist_info + 'licenses/')
                  else:
                      raise SystemExit('unexpected non-source wheel member: ' + name)
                  require('..' not in Path(relative).parts, 'unsafe wheel member: ' + name)
                  tagged_bytes = subprocess.check_output(['git', 'show', sha + ':' + relative])
                  require(archive.read(name) == tagged_bytes, 'wheel member differs from tagged source: ' + name)
          receipt = {'schema': 'cubit.release-audit.v1', 'repository': env['GITHUB_REPOSITORY'], 'ref': ref, 'source_sha': sha, 'run_id': env['GITHUB_RUN_ID'], 'run_attempt': env['GITHUB_RUN_ATTEMPT'], 'artifact_id': env['WHEEL_ARTIFACT_ID'], 'wheel': wheel.name, 'wheel_sha256': hashlib.sha256(wheel.read_bytes()).hexdigest(), 'native_manifest_sha256': hashlib.sha256(manifest_bytes).hexdigest(), 'built_identity_sha256': hashlib.sha256(built_path.read_bytes()).hexdigest()}
          record = Path('audit/release-audit.json')
          if env['AUDIT_PHASE'] == 'after-approval':
              require(json.loads(record.read_text(encoding='utf-8')) == receipt, 'approved artifact/ref identity changed')
          else:
              require(env['AUDIT_PHASE'] == 'before-approval', 'unknown audit phase')
          # Existing versions are failures, including an upload racing this check.
          try:
              with urllib.request.urlopen('https://pypi.org/pypi/cubit-mesh-export/' + expected + '/json', timeout=30):
                  raise SystemExit('version already exists on PyPI')
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
          if env['AUDIT_PHASE'] == 'before-approval':
              record.parent.mkdir(parents=True, exist_ok=True)
              record.write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n', encoding='utf-8')
          print('exact tag, source, wheel, native provenance and immutable identity verified')
          PY
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
