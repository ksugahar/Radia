name: GPU compute validation
on:
  schedule:
    - cron: '43 17 * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: gpu-a100-validation-${{ github.event_name }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: [self-hosted, Windows, X64, gpu-a100]
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Select validation source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = '${{ github.sha }}'
          if ('${{ github.event_name }}' -eq 'schedule') {
            python tools/ci_gpu_artifact.py select chosen-sha.txt
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            $sha = (Get-Content chosen-sha.txt).Trim()
          }
          "sha=$sha" | Out-File $env:GITHUB_OUTPUT -Append -Encoding utf8
          "Validated source SHA: $sha" | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
      - name: Fetch hash-verified exact-SHA GPU wheels built on RTX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/ci_gpu_artifact.py fetch gpu-input --sha ${{ steps.source.outputs.sha }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install verified wheels into a run-local environment
        run: |
          python -m venv "$env:RUNNER_TEMP/gpu-compute-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = "$env:RUNNER_TEMP/gpu-compute-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT/Scripts/python.exe"
          $wheels = @(Get-ChildItem gpu-input -Recurse -Filter *.whl)
          if ($wheels.Count -ne 2) { throw 'Expected two verified GPU wheels' }
          & $py -I -m pip install --no-deps $wheels.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sim = & $py -I -c "import radia_simulink as r; x=r.verify(); assert x['passed']; assert x['source_commit']=='${{ steps.source.outputs.sha }}'; print(r.matlab_path())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $opt = & $py -I -c "from radia_optuna import matlab_path; print(matlab_path())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "GPU_SIMULINK_PAYLOAD=$sim" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "GPU_OPTUNA_PAYLOAD=$opt" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Execute existing installed GPU drivers and larger CSR cases without compilation
        run: |
          & matlab -batch "assert(strcmp(version('-release'),'2026a')); addpath('validation_test/radia_simulink'); validate_compute_lane(getenv('GPU_SIMULINK_PAYLOAD'),getenv('GPU_OPTUNA_PAYLOAD'),'gpu-results');"
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpu-a100-validation-${{ steps.source.outputs.sha }}
          path: |
            gpu-results/**/*.json
            gpu-input/**/gpu-artifact.json
            gpu-input/**/download.json
          if-no-files-found: error
          retention-days: 30
  nightly-failure:
    needs: [validate]
    if: ${{ always() && github.event_name == 'schedule' && needs.validate.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = 'GPU compute validation failed';
            const body = `GPU validation failure: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', creator: 'github-actions[bot]'});
            const issue = issues.find(i => i.title === title && !i.pull_request);
            if (issue) await github.rest.issues.createComment({...context.repo, issue_number: issue.number, body});
            else await github.rest.issues.create({...context.repo, title, body});
