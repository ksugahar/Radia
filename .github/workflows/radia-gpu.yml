name: radia-gpu

on:
  pull_request:
    branches: [main]
    paths:
      - 'packages/radia-gpu/**'
      - 'src/matlab/cuda/**'
      - 'tools/build_cuda_mex.py'
      - 'validation_test/ngsolve_cuda_mex/**'
      - 'Build.ps1'
      - '.github/workflows/radia-gpu.yml'
  push:
    branches: [main]
    paths:
      - 'packages/radia-gpu/**'
      - 'src/matlab/cuda/**'
      - 'tools/build_cuda_mex.py'
      - 'validation_test/ngsolve_cuda_mex/**'
      - 'Build.ps1'
      - '.github/workflows/radia-gpu.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: radia-gpu-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cuda-mex:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64, "100"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated mexcuda environment
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "radia-gpu-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = Join-Path $venv 'Scripts/python.exe'
          $pins = @(& $python -c "import pathlib,tomllib; d=tomllib.loads(pathlib.Path('pyproject.toml').read_text()); print(*[x for x in d['project']['dependencies'] if x.startswith(('ngsolve==','netgen-mesher=='))],sep='\n')")
          if ($LASTEXITCODE -ne 0 -or $pins.Count -ne 2) { throw 'Expected exact FE reference pins' }
          $matlab = Get-ChildItem "$env:ProgramFiles/MATLAB" -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $matlab) { throw 'MATLAB is required for mexcuda CI' }
          & $python -m pip install @pins numpy scipy psutil (Join-Path $matlab.FullName 'extern/engines/python')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $venv 'Scripts') | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build GPU mexcuda gateway
        shell: pwsh
        run: |
          & ./Build.ps1 -CudaMexOnly -RequireNativeProvenance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify GPU boundary and Poisson precision
        shell: pwsh
        run: |
          # Small installation acceptance; CI timings are not performance claims.
          python validation_test/ngsolve_cuda_mex/run_poisson.py --binary-dir build-cuda-mex --out "$env:RUNNER_TEMP/radia-gpu-acceptance" --maxh 0.24 --threads 2
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radia-gpu-cuda-evidence
          path: |
            build-cuda-mex/*.mexw64
            build-cuda-mex/build.json
            ${{ runner.temp }}/radia-gpu-acceptance/**/result.json
            ${{ runner.temp }}/radia-gpu-acceptance/failed-result.json
          if-no-files-found: error
