name: Release cubit-mesh-export

# Triggered after the cubit-mesh-export distribution CI succeeds.
on:
  workflow_run:
    workflows: ["cubit-mesh-export"]
    types: [completed]

permissions:
  actions: read
  id-token: write
  contents: read

jobs:
  publish:
    # Only publish when CI succeeded AND a cubit-mesh-export-v* tag points at
    # this commit.  Uses git ls-remote (not head_branch) to avoid the GitHub
    # Actions quirk where head_branch = 'main' even for tag-triggered CI.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download exact CI ref context
        uses: actions/download-artifact@v4
        with:
          name: cubit-mesh-export-ci-release-context
          path: cubit-mesh-export-ci-release-context
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify triggering CI ran on a tag ref
        id: ref_check
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          TAG_PREFIX: cubit-mesh-export-v
        run: |
          python3 - <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path("cubit-mesh-export-ci-release-context/cubit-mesh-export-ci-release-context.json")
          context = json.loads(path.read_text(encoding="utf-8"))
          if context.get("schema") != "cubit-mesh-export.ci-release-context.v1":
              print("::error::Unknown cubit-mesh-export CI release-context schema")
              sys.exit(1)
          if context.get("sha") != os.environ["SHA"] or str(context.get("run_id")) != os.environ["RUN_ID"]:
              print("::error::CI release-context does not match triggering workflow_run")
              sys.exit(1)
          tags = context.get("release_tags")
          if not isinstance(tags, list):
              print("::error::CI release-context has no release-tag snapshot")
              sys.exit(1)
          is_tag = context.get("ref_type") == "tag"
          eligible = is_tag and any(tag.startswith(os.environ["TAG_PREFIX"]) for tag in tags)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"is_tag={str(is_tag).lower()}\n")
              output.write(f"eligible={str(eligible).lower()}\n")
          print(f"CI ref context: {context.get('ref')} (tag={is_tag}, release_tags={tags})")
          PY

      - name: Check if a cubit-mesh-export-v* tag points at this commit
        id: tag_check
        if: steps.ref_check.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          VTAG=$(git ls-remote --tags "$REPO_URL" 'refs/tags/cubit-mesh-export-v*' \
                 | awk -v sha="$SHA" '$1 == sha {print $2}' \
                 | sed 's/\^{}//' | head -1)
          if [ -n "$VTAG" ]; then
            echo "found=true"  >> "$GITHUB_OUTPUT"
            echo "tag=$VTAG"   >> "$GITHUB_OUTPUT"
            echo "cubit-mesh-export-v* tag for $SHA: $VTAG"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No cubit-mesh-export-v* tag found for $SHA -- skipping"
          fi

      - name: Download cubit-mesh-export wheel
        if: steps.tag_check.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: cubit-mesh-export-wheel
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify wheel (mandatory plugin binaries + version consistency)
        if: steps.tag_check.outputs.found == 'true'
        run: |
          echo "=== cubit-mesh-export wheel ==="
          ls -la dist/
          WHL=$(find dist -name '*.whl' | head -1)
          if [ -z "$WHL" ]; then
            echo "::error::No wheel found"
            exit 1
          fi
          echo "Wheel: $WHL"
          python3 - "$WHL" <<'PY'
          import sys, zipfile, re
          whl = sys.argv[1]
          zf = zipfile.ZipFile(whl)
          names = [f.filename for f in zf.infolist()]

          # Plugin binaries that MUST ship in every wheel. The Cubit plugin is
          # useless without any of these: .ccm (APREPRO commands) or .pyd
          # (cubit-mesh-export pybind11 module).  We refuse to publish a
          # partial wheel (2026-04-14 hardening; 2026-04-24 strengthened
          # to include .pyd after PyPI 0.6.0 shipped without it and left mdx
          # in a half-deployed state).
          # Note (radia 4.80.0): .ccl removed — Qt5 GUI deleted, replaced
          # by PySide6 toolbar src/radia/panels/radia_export_menu.py.
          required = ["cubit_mesh_export.ccm", "cubit_mesh_curver.pyd"]
          missing = [r for r in required if not any(n.endswith(r) for n in names)]
          if missing:
              print(f"::error::Wheel missing mandatory plugin binaries: {missing}")
              print(f"  Wheel contents: {names}")
              sys.exit(1)
          print(f"OK mandatory: {required}")

          # Version consistency: the __version__ declared in __init__.py
          # must match the version in the wheel filename.
          whl_ver = re.match(r"[^-]+-([^-]+)-", whl.rsplit("/", 1)[-1]).group(1)
          init = zf.read(next(n for n in names if n.endswith("__init__.py"))).decode()
          m = re.search(r'^__version__\s*=\s*"([^"]+)"', init, re.M)
          if not m:
              print("::error::__version__ not found in wheel __init__.py")
              sys.exit(1)
          pkg_ver = m.group(1)
          if whl_ver != pkg_ver:
              print(f"::error::Version mismatch — wheel={whl_ver} "
                    f"vs __init__.__version__={pkg_ver}. "
                    f"Someone forgot to bump one of them.")
              sys.exit(1)
          print(f"OK version consistency: {pkg_ver}")
          PY

      - name: Publish to PyPI
        if: steps.tag_check.outputs.found == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
