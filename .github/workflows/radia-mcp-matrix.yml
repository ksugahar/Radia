name: radia-mcp matrix (lightweight selftest)

# Complements `build-test.yml` (self-hosted Windows, full integration).
# This workflow:
#   - Runs on the FREE GitHub-hosted ubuntu-latest
#   - Across Python 3.10 / 3.11 / 3.12
#   - With minimal deps (no radia C++ ext, no ngsolve, no Cubit)
#   - Checks: (a) all cataloged subpackages import (b) every server has
#     register_status_tool wired (c) per-server --selftest runs
#
# Why a separate workflow:
#   - Catches MCP-only regressions in MINUTES vs 45-min self-hosted build
#   - Validates the lightweight install path (the one new external
#     users will hit when they `pip install radia-mcp` and try a tool)
#   - Independent of the self-hosted runner availability

on:
  push:
    branches: [main, "claude/**", "feature/**"]
    paths:
      - "packages/radia-mcp/**"
      - ".github/workflows/radia-mcp-matrix.yml"
  pull_request:
    branches: [main]
    paths:
      - "packages/radia-mcp/**"
      - ".github/workflows/radia-mcp-matrix.yml"
  workflow_dispatch:

concurrency:
  group: radia-mcp-matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Minimal install: just mcp + radia-mcp itself.
      # NO radia (heavy MKL+MSVC build), NO ngsolve, NO cubit binaries.
      # MCP servers must import cleanly without these heavy deps
      # (they are knowledge servers; runtime deps are optional).
      - name: Install minimal deps
        run: |
          python -m pip install --upgrade pip
          # tomli: tomllib backport for Python 3.10 (tools/policy_lint.py reads pyproject.toml;
          # tomllib is stdlib only on 3.11+).  No-op on 3.11/3.12 via the env marker.
          python -m pip install pytest pytest-rerunfailures "mcp>=1.0" "tomli; python_version < '3.11'"
          python -m pip install -e packages/radia-mcp --no-deps

      - name: Compile check (catch SyntaxError on Py ${{ matrix.python-version }})
        run: |
          python -m compileall -q packages/radia-mcp/src

      - name: Meta health (all cataloged subpackages must import)
        run: |
          python -c "
          from radia_mcp.meta.server import radia_mcp_health
          h = radia_mcp_health()
          print(f'healthy: {h[\"n_servers_healthy\"]}/{h[\"n_servers_total\"]}')
          if not h['all_healthy']:
              for r in h['results']:
                  if not r['import_ok']:
                      print(f'  - {r[\"name\"]}: {r.get(\"error\", \"?\")[:120]}')
              raise SystemExit(1)
          "

      - name: Pytest (meta health + language features + versioning)
        run: |
          cd packages/radia-mcp
          # --reruns 2: test_each_server_selftest spawns each of the ~40
          # server console-scripts as a subprocess; the heavy-ML servers
          # (e.g. gnn -> torch) can transiently crash (rc=-1, empty
          # stdout/stderr) under the full-suite resource pressure, then
          # pass on a clean rerun.  Mirrors build-test.yml's --reruns
          # flaky-handling.  -r aR surfaces any rerun in the log.
          python -m pytest -v -r aR -m "not xval" --reruns 2 --reruns-delay 1 tests/

      # TOOLS.md drift gate — regenerate the auto-generated inventory
      # and fail if it differs from the committed copy. Catches the
      # 2026-05-24 release-time regression where TOOLS.md silently
      # carried a 9-server / 129-tool snapshot while the catalog had
      # grown to 37 / 281.
      - name: TOOLS.md drift gate
        shell: bash
        run: |
          python packages/radia-mcp/scripts/gen_tools_doc.py
          if ! git diff --exit-code -- packages/radia-mcp/docs/TOOLS.md; then
            echo "::error::packages/radia-mcp/docs/TOOLS.md is stale."
            echo "::error::Run locally: python packages/radia-mcp/scripts/gen_tools_doc.py"
            echo "::error::then commit the resulting docs/TOOLS.md change."
            exit 1
          fi

      # Run --selftest for every cataloged server (catches runtime issues
      # the static checks miss).
      - name: Per-server --selftest
        shell: bash
        run: |
          cd packages/radia-mcp
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "src")
          from radia_mcp.meta import catalog

          failed = []
          for short, info in catalog.CATALOG.items():
              cmd = [sys.executable, "-c",
                     f"import sys; sys.path.insert(0, 'src'); "
                     f"from {info['subpackage']}.server import main; "
                     f"sys.argv = ['{info['entry_point']}', '--selftest']; "
                     f"main()"]
              r = subprocess.run(cmd, capture_output=True, text=True, timeout=60)
              ok = (r.returncode == 0)
              tag = "OK  " if ok else "FAIL"
              print(f"  {tag}  {short}")
              if not ok:
                  failed.append((short, r.stderr[-300:].strip()))

          print(f"\nTotal: {len(catalog.CATALOG)}, failed: {len(failed)}")
          for n, err in failed:
              print(f"\n--- {n} ---")
              print(err)
          if failed:
              sys.exit(1)
          PY
