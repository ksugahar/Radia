name: Release

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful exact-tag native build run ID (no rebuild)
        required: true
        type: string
      wheel_sha256:
        description: SHA-256 of the wheel accepted on build and validation targets
        required: true
        type: string
      acceptance_commit:
        description: Full main-reachable commit containing both required host acceptance records
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  upload-binaries:
    needs: [verify-promotion, publish-pypi]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') &&
      needs.verify-promotion.result == 'success' &&
      needs.publish-pypi.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-promotion.outputs.native_artifact_id }}
          path: pyd-files
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-promotion.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-promotion.outputs.receipt_artifact_id }}
          path: evidence
          merge-multiple: true
      - name: Recheck approved tag, attempt and exact bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          ACCEPTANCE_COMMIT: ${{ inputs.acceptance_commit }}
        run: |
          python tools/verify_radia_promotion.py --repo "$GITHUB_REPOSITORY" \
            --run-id "$CI_RUN_ID" --wheel-sha256 "$WHEEL_SHA256" \
            --acceptance-commit "$ACCEPTANCE_COMMIT" --wheel-dir dist \
            --context-dir ci-release-context --native-dir pyd-files \
            --output evidence/promotion.json --after-approval
      - name: Upload native binaries to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(find pyd-files -type f \( -name '*.pyd' -o -name '*.dll' -o -name '*.so' -o -name '*.dylib' \))
          test -n "$FILES"
          python tools/upload_release_asset.py --repo "$GITHUB_REPOSITORY" \
            --tag binaries --create-if-missing $FILES

  verify-promotion:
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_id: ${{ steps.accepted.outputs.artifact-id }}
      native_artifact_id: ${{ steps.native.outputs.artifact-id }}
      receipt_artifact_id: ${{ steps.receipt.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: radia-wheel
          path: dist
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: ci-release-context
          path: ci-release-context
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          name: radia-pyd
          path: pyd-files
          run-id: ${{ inputs.ci_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact artifact and main-reachable acceptance data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          ACCEPTANCE_COMMIT: ${{ inputs.acceptance_commit }}
        run: |
          python tools/verify_radia_promotion.py --repo "$GITHUB_REPOSITORY" \
            --run-id "$CI_RUN_ID" --wheel-sha256 "$WHEEL_SHA256" \
            --acceptance-commit "$ACCEPTANCE_COMMIT" --wheel-dir dist \
            --context-dir ci-release-context --native-dir pyd-files --output promotion.json
      - uses: actions/upload-artifact@v4
        id: accepted
        with:
          name: accepted-radia-wheel
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: native
        with:
          name: accepted-radia-native
          path: pyd-files/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        id: receipt
        with:
          name: radia-promotion-evidence
          path: promotion.json
          if-no-files-found: error

  publish-pypi:
    needs: verify-promotion
    if: github.event_name == 'workflow_dispatch' && github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.verify-promotion.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-promotion.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-promotion.outputs.native_artifact_id }}
          path: pyd-files
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify-promotion.outputs.receipt_artifact_id }}
          path: evidence
          merge-multiple: true
      - name: Recheck approved tag, attempt and exact bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
          WHEEL_SHA256: ${{ inputs.wheel_sha256 }}
          ACCEPTANCE_COMMIT: ${{ inputs.acceptance_commit }}
        run: |
          python tools/verify_radia_promotion.py --repo "$GITHUB_REPOSITORY" \
            --run-id "$CI_RUN_ID" --wheel-sha256 "$WHEEL_SHA256" \
            --acceptance-commit "$ACCEPTANCE_COMMIT" --wheel-dir dist \
            --context-dir ci-release-context --native-dir pyd-files \
            --output evidence/promotion.json --after-approval
      - name: Publish the accepted wheel without rebuilding
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: false
