name: Release

# Runs automatically after CI succeeds (master push or version tag).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  upload-binaries:
    # Only on master CI success (not PRs, not tags).
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # Download the .pyd artifact produced by CI
      # ----------------------------------------------------------------
      - name: Download .pyd artifact
        uses: actions/download-artifact@v4
        with:
          name: radia-pyd
          path: pyd-files
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ----------------------------------------------------------------
      # Upload .pyd to GitHub Releases (tag: binaries)
      # ----------------------------------------------------------------
      - name: Upload .pyd to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Uploading .pyd files to GitHub Releases ==="

          # Ensure 'binaries' release exists
          if ! gh release view binaries >/dev/null 2>&1; then
            gh release create binaries --title "Binary Files" \
              --notes "Pre-built modules. Updated by CI." --latest=false
          fi

          # Collect .pyd files
          FILES=$(find pyd-files -name '*.pyd' 2>/dev/null)
          if [ -z "$FILES" ]; then
            echo "::warning::No .pyd files found to upload"
            exit 0
          fi

          echo "Uploading files..."
          for f in $FILES; do
            echo "  Uploading $(basename "$f")..."
            gh release upload binaries "$f" --clobber
          done
          echo "Upload complete."

  # ==================================================================
  # Publish to PyPI (only on version tags: v*)
  # ==================================================================
  # IMPORTANT: workflow_run.head_branch returns the BRANCH name ('main'),
  # NOT the tag name, when the triggering commit is on both a branch and a
  # tag simultaneously (GitHub Actions known quirk, 2026-06-03).
  # Fix: first check CI success, then use the GitHub API to confirm a v*
  # tag actually points at the triggering SHA before publishing.
  publish-pypi:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write

    steps:
      - name: Check if a v* release tag points at this commit
        id: tag_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # List all tags whose object SHA (direct for lightweight, or
          # dereferenced ^{} for annotated) matches the triggering commit.
          # The ^{} deref endpoint returns lines like:
          #   refs/tags/v4.90.1^{} <sha>
          VTAG=$(git ls-remote --tags origin 'refs/tags/v*' \
                 | awk -v sha="$SHA" '($1==sha) && /\^\{\}/ {print $2}' \
                 | sed 's/\^{}//' | head -1)
          if [ -n "$VTAG" ]; then
            echo "found=true"  >> "$GITHUB_OUTPUT"
            echo "tag=$VTAG"   >> "$GITHUB_OUTPUT"
            echo "v* tag for $SHA: $VTAG"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No v* tag found for $SHA -- skipping PyPI publish"
          fi

      - name: Download wheel artifact
        if: steps.tag_check.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: radia-wheel
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify wheel (exists + version consistency)
        if: steps.tag_check.outputs.found == 'true'
        run: |
          echo "=== Wheel files ==="
          ls -la dist/
          WHL=$(find dist -name '*.whl' | head -1)
          if [ -z "$WHL" ]; then
            echo "::error::No wheel found in dist/"
            exit 1
          fi
          echo "Wheel: $WHL"
          python3 - "$WHL" <<'PY'
          import sys, zipfile, re
          whl = sys.argv[1]
          zf = zipfile.ZipFile(whl)
          names = [f.filename for f in zf.infolist()]
          # pyproject.toml version vs __init__.py __version__ must match
          # the wheel filename. 2026-04-14 hardening after a missed
          # __init__.py bump would have silently shipped the wrong
          # __version__ attribute.
          whl_ver = re.match(r"[^-]+-([^-]+)-", whl.rsplit("/", 1)[-1]).group(1)
          init = zf.read(next(n for n in names if n.endswith("radia/__init__.py"))).decode()
          m = re.search(r'^__version__\s*=\s*"([^"]+)"', init, re.M)
          if not m:
              print("::error::__version__ not found in wheel radia/__init__.py")
              sys.exit(1)
          pkg_ver = m.group(1)
          if whl_ver != pkg_ver:
              print(f"::error::Version mismatch — wheel={whl_ver} "
                    f"vs radia.__version__={pkg_ver}.")
              sys.exit(1)
          print(f"OK version consistency: {pkg_ver}")
          PY

      - name: Publish to PyPI
        if: steps.tag_check.outputs.found == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
