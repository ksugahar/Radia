name: CI

on:
  push:
    branches: [main]
    tags: ['v*', 'cubit-mesh-export-v*', 'radia-mcp-v*']
  pull_request:
    branches: [main]

# On main: never cancel a running build (only pending ones get replaced).
# On PRs:    cancel the previous run to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-test:
    runs-on: [self-hosted, windows-radia]
    timeout-minutes: 45

    # NGSolve + Netgen from pip install (6.2.2602)
    env:
      NGSOLVE_ROOT: 'C:\Program Files\Python312\Lib\site-packages\ngsolve'
      NGSOLVE_DIR: 'C:\Program Files\Python312\Lib\site-packages\ngsolve\cmake'
      Netgen_DIR: 'C:\Program Files\Python312\Lib\site-packages\netgen\cmake'
      CUBIT_PATH: 'C:\Program Files\Coreform Cubit 2025.3\bin'

    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # Install test dependencies (MCP server tests need mcp package).
      #
      # Also editable-install radia-mcp from the freshly-checked-out
      # source so `import radia_mcp.<subpkg>.server` resolves to THIS
      # commit, not a stale wheel that a previous tag CI may have
      # left in system site-packages.  Without this,
      # test_tools_doc.py silently runs against an older radia_mcp;
      # if any tool docstring changed between releases, the
      # committed TOOLS.md (regenerated from this commit's source)
      # will NOT match the `render()` output (stale source) and the
      # test fails as "stale".  2026-05-18 v4.55.1 hit this when the
      # IH MCP tool docstrings were updated.
      # ----------------------------------------------------------------
      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install mcp pytest-rerunfailures --quiet
          python -m pip install -e packages/radia-mcp --no-deps --quiet
          Write-Host "mcp + pytest-rerunfailures + radia-mcp (editable from this checkout) installed"

      # ----------------------------------------------------------------
      # Verify NGSolve: pip-installed version (6.2.2602+)
      # ----------------------------------------------------------------
      - name: Verify NGSolve
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:NGSOLVE_DIR\NGSolveConfig.cmake")) {
            Write-Host "::error::NGSolve not found at $env:NGSOLVE_DIR"
            Write-Host "Install: pip install ngsolve"
            exit 1
          }
          Write-Host "NGSolve: $env:NGSOLVE_ROOT"

      # ----------------------------------------------------------------
      # Build: MSVC + MKL + NGSolve TaskManager
      # ----------------------------------------------------------------
      - name: Build with MSVC + MKL
        shell: pwsh
        timeout-minutes: 20
        run: |
          Write-Host "Starting Radia build..."
          & "${{ github.workspace }}\Build.ps1"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "Build completed successfully."

      # ----------------------------------------------------------------
      # Verify: Check that .pyd was produced
      # ----------------------------------------------------------------
      - name: Verify .pyd output
        shell: pwsh
        run: |
          $pyd = "${{ github.workspace }}\src\radia\_radia_pybind.pyd"
          if (-not (Test-Path $pyd)) {
            Write-Host "::error::_radia_pybind.pyd not found at $pyd"
            exit 1
          }
          $sz = [math]::Round((Get-Item $pyd).Length / 1MB, 2)
          Write-Host "_radia_pybind.pyd: ${sz} MB"

      # ----------------------------------------------------------------
      # Fetch radia_cubit_mesh.pyd from GitHub Releases binaries tag.
      #
      # CI runners do NOT have the Coreform Cubit SDK (cmake module),
      # pybind11, or the qt5_sdk needed to build the Cubit plugin
      # locally. Build.ps1 silently SKIPs this target on CI ("SKIP:
      # Cubit SDK not found at C:/Program Files/Coreform Cubit
      # 2025.3/cmake"). The pyd is built on LAB (which has the full
      # Cubit Pro install) and uploaded to the `binaries` release tag
      # by the pre-push hook (.git/hooks/pre-push). CI downloads it
      # so the cubit-mesh-export wheel ships with the bundled pyd.
      #
      # Without this step, Build_Wheel.ps1 / build-cubit-mesh-export
      # would fail their pyd-mandate check (added 2026-04-24 after
      # the PyPI 0.6.0 partial-wheel incident).
      # ----------------------------------------------------------------
      - name: Fetch radia_cubit_mesh.pyd from binaries release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pyd = "${{ github.workspace }}\src\radia\radia_cubit_mesh.pyd"
          $needFetch = $true
          if (Test-Path $pyd) {
            $sz = (Get-Item $pyd).Length
            if ($sz -gt 100000) {
              Write-Host "  radia_cubit_mesh.pyd already built locally: $sz bytes (skip download)"
              $needFetch = $false
            } else {
              Write-Host "  radia_cubit_mesh.pyd present but suspicious size ($sz bytes), re-fetching"
            }
          }
          if ($needFetch) {
            # Retry loop: when a tag is pushed, the binary upload from
            # the pre-push hook on the main branch can race against the
            # tag-triggered CI start.  The asset re-uploads with --clobber
            # are not atomic on GitHub's side -- there is a brief window
            # (~few seconds) where `gh release download -p <name>` reports
            # "no assets match the file pattern" even though the asset
            # exists (or is about to exist).  Retry up to 6 times with
            # exponential-ish backoff so a transient race does not fail
            # the entire CI run.  This reproduced 2026-05-02 on
            # v4.25.1 + radia-mcp-v0.37.0 + radia-mcp-v0.37.1 tag CIs.
            $maxAttempts = 6
            $delays = @(0, 5, 10, 20, 40, 60)   # seconds before each attempt
            $ok = $false
            for ($i = 0; $i -lt $maxAttempts; $i++) {
              if ($i -gt 0) {
                Write-Host "  Retry $i/$($maxAttempts-1) after $($delays[$i])s ..."
                Start-Sleep -Seconds $delays[$i]
              }
              Write-Host "  Downloading radia_cubit_mesh.pyd from binaries release tag (attempt $($i+1)) ..."
              # --repo bypasses gh's git-based repo detection (which fails on
              # the self-hosted runner with "dubious ownership" because the
              # workspace is owned by NETWORK SERVICE but gh runs as SYSTEM).
              gh release download binaries --repo ${{ github.repository }} `
                -p "radia_cubit_mesh.pyd" -D "${{ github.workspace }}\src\radia" --clobber 2>&1 | Write-Host
              if ($LASTEXITCODE -eq 0 -and (Test-Path $pyd)) {
                $sz = (Get-Item $pyd).Length
                if ($sz -gt 100000) {
                  $ok = $true
                  Write-Host "  Downloaded radia_cubit_mesh.pyd: $sz bytes"
                  break
                } else {
                  Write-Host "  Downloaded but suspicious size ($sz bytes), retrying..."
                }
              }
            }
            if (-not $ok) {
              Write-Host "::error::Failed to download radia_cubit_mesh.pyd from binaries release after $maxAttempts attempts."
              Write-Host "         The pre-push hook on LAB uploads this file on every push;"
              Write-Host "         if it is missing, run on LAB:"
              Write-Host "           gh release upload binaries src/radia/radia_cubit_mesh.pyd --clobber"
              exit 1
            }
          }

      # ----------------------------------------------------------------
      # Test: Run basic pytest tests (~2 sec)
      # ----------------------------------------------------------------
      - name: Run basic tests
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: '${{ github.workspace }}\src;${{ github.workspace }}\src\radia'
        run: |
          Write-Host "Running pytest (excluding cubit + OCC-dependent tests)..."
          python -m pytest tests/ -v --tb=short --junitxml=test-results.xml `
            --ignore=tests/cubit `
            --ignore=tests/panels `
            --ignore=tests/test_far_field_accuracy.py `
            --ignore=tests/test_rad_ngsolve_function.py `
            --ignore=tests/test_tetrahedral_solver.py `
            --ignore=tests/test_batch_evaluation.py `
            --ignore=tests/test_curlA_equals_B.py `
            --ignore=tests/test_mesh_import.py `
            --ignore=tests/test_scalar_bie_sibc.py
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Basic tests failed"
            exit $LASTEXITCODE
          }

      # ----------------------------------------------------------------
      # Upload test results for GitHub Actions summary
      # ----------------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

      # ----------------------------------------------------------------
      # Build wheel (DryRun: build + verify only, no upload)
      # ----------------------------------------------------------------
      - name: Build wheel
        if: success()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          & "${{ github.workspace }}\Build_Wheel.ps1" -DryRun
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Wheel build failed"
            exit $LASTEXITCODE
          }

      # ----------------------------------------------------------------
      # Upload .pyd as artifact for the CD workflow to consume
      # ----------------------------------------------------------------
      - name: Upload .pyd artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radia-pyd
          path: src/radia/*.pyd
          retention-days: 7

      # ----------------------------------------------------------------
      # Upload wheel as artifact for PyPI publishing
      # ----------------------------------------------------------------
      - name: Upload wheel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radia-wheel
          path: dist/*.whl
          retention-days: 7

      # ----------------------------------------------------------------
      # Build cubit-mesh-export wheel (includes .pyd, .ccm, .ccl)
      # ----------------------------------------------------------------
      - name: Build cubit-mesh-export wheel
        if: success()
        shell: pwsh
        env:
          # Skip the dev-side mtime freshness gate in CI: self-hosted
          # runners have persistent workspaces and git checkout does not
          # reliably normalise mtimes, producing false positives that
          # block unrelated commits (2026-04-14 incident: 2D axisym
          # validation commit blocked by stale-binary false alarm). CI
          # has its own wheel-content guard in release-cubit-mesh-export
          # .yml that verifies .ccm/.ccl are present at publish time.
          CUBIT_MESH_EXPORT_SKIP_FRESHNESS_CHECK: "1"
        run: |
          $pkgDir = "${{ github.workspace }}\packages\cubit-mesh-export\src\cubit_mesh_export"
          # Copy binaries to cubit-mesh-export package
          $binaries = @(
            @{ src = "src\radia\radia_cubit_mesh.pyd"; dst = "radia_cubit_mesh.pyd" },
            @{ src = "src\radia\radia_cubit.ccm";      dst = "radia_cubit.ccm" },
            @{ src = "src\radia\radia_cubit.ccl";      dst = "radia_cubit.ccl" }
          )
          # All 3 binaries are MANDATORY. Missing any of them indicates
          # Build.ps1 failed silently for the corresponding artifact —
          # we refuse to ship a wheel that cubit-plugin-install would
          # then leave half-deployed (2026-04-24: PyPI 0.6.0 shipped
          # without radia_cubit_mesh.pyd because this step warned only).
          $missing = @()
          foreach ($b in $binaries) {
            $s = "${{ github.workspace }}\$($b.src)"
            $d = "$pkgDir\$($b.dst)"
            if (Test-Path $s) {
              Copy-Item $s $d -Force
              Write-Host "Copied $($b.dst) to cubit-mesh-export"
            } else {
              $missing += $b.src
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::Build.ps1 did not produce required binaries: $($missing -join ', ')"
            Write-Host "         Refusing to build a partial wheel."
            exit 1
          }
          pip install build wheel --quiet
          Push-Location "${{ github.workspace }}\packages\cubit-mesh-export"
          python -m build --wheel
          # All 3 binaries are present (verified above) → retag as cp312/win_amd64
          $whl = Get-ChildItem dist\*.whl | Select-Object -First 1
          python -m wheel tags --python-tag cp312 --abi-tag cp312 --platform-tag win_amd64 --remove $whl.FullName
          Write-Host "Retagged: $(Get-ChildItem dist\*.whl | Select-Object -First 1)"
          Pop-Location

      - name: Upload cubit-mesh-export wheel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cubit-mesh-export-wheel
          path: packages/cubit-mesh-export/dist/*.whl
          retention-days: 7

      # ----------------------------------------------------------------
      # Build radia-mcp wheel (pure Python, no binaries)
      # ----------------------------------------------------------------
      - name: Build radia-mcp wheel
        if: success()
        shell: pwsh
        run: |
          pip install build --quiet
          Push-Location "${{ github.workspace }}\packages\radia-mcp"
          python -m build --wheel
          Pop-Location

      - name: Upload radia-mcp wheel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radia-mcp-wheel
          path: packages/radia-mcp/dist/*.whl
          retention-days: 7

      # ----------------------------------------------------------------
      # Post-install selftest: install the just-built radia-mcp wheel
      # and invoke --selftest on every public MCP server.  This catches:
      #   - broken CLI entrypoint (console_scripts mis-wired)
      #   - missing imports only reachable from __main__
      #   - lint-rule regressions against the fixture examples
      # It's complementary to `tests/mcp_server/test_selftest.py` (which
      # calls _selftest() directly in the source tree) — here we verify
      # the *installed* wheel behaves the same.
      # ----------------------------------------------------------------
      - name: Post-install MCP selftest (all 6 public servers)
        if: success()
        shell: pwsh
        run: |
          $whl = Get-ChildItem "${{ github.workspace }}\packages\radia-mcp\dist\*.whl" `
                 | Select-Object -First 1
          if (-not $whl) {
            Write-Host "::error::No radia-mcp wheel found"
            exit 1
          }

          # Install into a fresh venv so we don't fight with the
          # self-hosted runner's persistent Python state.  Previous runs'
          # mcp-server-*.exe in C:\Program Files\Python312\Scripts can be
          # locked (WinError 32) if any orphan process holds them open,
          # and those script wrappers are what `pip install --force-
          # reinstall` tries to overwrite.  A dedicated venv side-steps
          # the whole class of locking problems.
          $venv = Join-Path $env:RUNNER_TEMP "radia-mcp-selftest-venv"
          if (Test-Path $venv) { Remove-Item $venv -Recurse -Force }
          python -m venv $venv
          $pyInVenv = Join-Path $venv "Scripts\python.exe"
          & $pyInVenv -m pip install --upgrade pip --quiet
          Write-Host "Installing $($whl.Name) into selftest venv..."
          & $pyInVenv -m pip install "$($whl.FullName)" --quiet
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::radia-mcp wheel install failed in venv"
            exit $LASTEXITCODE
          }

          # Drive each server via `python -m` rather than the .exe shim.
          # Equivalent entrypoint (same module main()), but bypasses the
          # console-script wrapper entirely — matches how end users would
          # invoke these from `uv run --with radia-mcp -m ...` or
          # `python -m radia_mcp.X.server`.
          $servers = @(
            @{ name = 'mcp-server-radia-ngsolve';  mod = 'radia_mcp.radia_ngsolve.server' },
            @{ name = 'mcp-server-cubit';          mod = 'radia_mcp.cubit.server' },
            @{ name = 'mcp-server-build123d';      mod = 'radia_mcp.build123d.server' },
            @{ name = 'mcp-server-gmsh';           mod = 'radia_mcp.gmsh.server' },
            @{ name = 'mcp-server-radia-interop';  mod = 'radia_mcp.interop.server' }
          )
          $failed = @()
          foreach ($s in $servers) {
            Write-Host ""
            Write-Host "=== $($s.name) --selftest ==="
            & $pyInVenv -m $s.mod --selftest
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$($s.name) --selftest exited $LASTEXITCODE"
              $failed += $s.name
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::selftest failed on: $($failed -join ', ')"
            exit 1
          }
          Write-Host ""
          Write-Host "All 6 MCP servers passed --selftest."

      # ----------------------------------------------------------------
      # MCP response regression tests (topic coverage + unknown-topic
      # graceful-degrade checks across all knowledge servers). These
      # run against the installed wheel so they also serve as a second
      # validation pass on the --selftest step above.
      # ----------------------------------------------------------------
      - name: MCP response regression tests
        if: success()
        shell: pwsh
        run: |
          python -m pytest tests/mcp_server/ -v --tb=short `
            --junitxml=mcp-test-results.xml
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::MCP response regression tests failed"
            exit $LASTEXITCODE
          }

      - name: Upload MCP test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-test-results
          path: mcp-test-results.xml
          retention-days: 30
