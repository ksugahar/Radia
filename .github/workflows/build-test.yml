name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

# On master: never cancel a running build (only pending ones get replaced).
# On PRs:    cancel the previous run to save runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build-test:
    runs-on: [self-hosted, windows-radia]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # Build: MSVC + MKL (RadiaOnly mode for speed)
      # ----------------------------------------------------------------
      - name: Build with MSVC + MKL
        shell: pwsh
        run: |
          Write-Host "Starting Radia build (RadiaOnly mode)..."
          & "${{ github.workspace }}\Build.ps1" -RadiaOnly -Verbose
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Build failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "Build completed successfully."

      # ----------------------------------------------------------------
      # Verify: Check that .pyd was produced
      # ----------------------------------------------------------------
      - name: Verify .pyd output
        shell: pwsh
        run: |
          $pyd = "${{ github.workspace }}\src\radia\_radia_pybind.pyd"
          if (-not (Test-Path $pyd)) {
            Write-Host "::error::_radia_pybind.pyd not found at $pyd"
            exit 1
          }
          $sz = [math]::Round((Get-Item $pyd).Length / 1MB, 2)
          Write-Host "_radia_pybind.pyd: ${sz} MB"

      # ----------------------------------------------------------------
      # Test: Run basic pytest tests (~2 sec)
      # ----------------------------------------------------------------
      - name: Run basic tests
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Write-Host "Running pytest -m basic..."
          python -m pytest tests/ -m "basic" -v --tb=short --junitxml=test-results.xml
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Basic tests failed"
            exit $LASTEXITCODE
          }

      # ----------------------------------------------------------------
      # Upload test results for GitHub Actions summary
      # ----------------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml
          retention-days: 30

      # ----------------------------------------------------------------
      # Build wheel (DryRun: build + verify only, no upload)
      # ----------------------------------------------------------------
      - name: Build wheel
        if: success()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          & "${{ github.workspace }}\Publish_to_PyPI.ps1" -DryRun
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Wheel build failed"
            exit $LASTEXITCODE
          }

      # ----------------------------------------------------------------
      # Upload .pyd as artifact for the CD workflow to consume
      # ----------------------------------------------------------------
      - name: Upload .pyd artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radia-pyd
          path: src/radia/*.pyd
          retention-days: 7

      # ----------------------------------------------------------------
      # Upload wheel as artifact for PyPI publishing
      # ----------------------------------------------------------------
      - name: Upload wheel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radia-wheel
          path: dist/*.whl
          retention-days: 7
