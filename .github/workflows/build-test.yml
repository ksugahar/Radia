name: CI

on:
  push:
    branches: [main]
    tags: ['v*', 'cubit-mesh-export-v*', 'radia-mcp-v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      run_golden:
        description: 'Compatibility alias: run validation_test/ without @pytest.mark.slow'
        required: false
        default: false
        type: boolean
      run_validation_test:
        description: 'Run validation_test/ (manual heavy validation gate)'
        required: false
        default: false
        type: boolean
      full_slow:
        description: 'Run @pytest.mark.slow validation tests too'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: write

# Concurrency: serialize per-SHA, NOT per-ref.
#
# Why: a release pushes BOTH main and a tag (e.g. main + v4.78.1 +
# radia-mcp-v0.72.0) for the SAME commit SHA.  Per-ref grouping put
# main and each tag in separate concurrency groups, so they raced
# on the shared self-hosted [windows-radia] runner.  Build.ps1
# writes to S:\...\src\radia\*.pyd (NAS-shared editable path on
# LAB); two concurrent builds linking the same .pyd produced
# linker-side file-lock failures that surfaced as non-timeout
# Build step failures (verified 2026-05-25: sha 0c0ef5d had main
# CI FAIL + radia-mcp-v0.75.0 tag CI OK, only 5 s apart -- same
# SHA, two runs, different outcomes).
#
# Grouping by SHA forces serial execution per commit so the
# linker only ever has one writer at a time.
#
# On main: keep per-SHA serialization to protect the shared LAB build tree.
# A stale-main guard below cancels an older main push as soon as it starts,
# before it spends ~40 min in tests while a newer SHA is queued.
# On tags: a duplicate-tag guard below keeps one release-tag CI per SHA even
# when v* + radia-mcp-v* are pushed together.
# On PRs: cancel the previous run to save runner time.
concurrency:
  group: ci-${{ github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    # Public-repo safety: never run fork PR code on the lab self-hosted
    # runner.  Same-repository PRs are still allowed for maintainer-owned
    # branches; fork PRs get the GitHub-hosted policy/radia-mcp checks only.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, windows-radia]
    # No timeout-minutes -- per 2026-05-25 user decision after
    # 45-min cap (sha 357da370 cancelled) and 70-min cap (sha
    # c1ed3dc9 in flight) kept slicing different steps. Self-
    # hosted runner has no hard limit; GitHub Actions default
    # is 6h, far more than needed. Letting every step complete
    # to its natural end is the only way to capture full stderr
    # for diagnosis without chasing the next cliff.

    # The exact NGSolve/Netgen paths are replaced below with a per-run venv.
    # These defaults only keep pre-venv policy steps independent of runner state.
    env:
      NGSOLVE_ROOT: 'C:\Program Files\Python312\Lib\site-packages\ngsolve'
      NGSOLVE_DIR: 'C:\Program Files\Python312\Lib\site-packages\ngsolve\cmake'
      Netgen_DIR: 'C:\Program Files\Python312\Lib\site-packages\netgen\cmake'
      # Was hardcoded 'Cubit 2025.3\bin' until 2026-05-25; LAB now has
      # 2025.12 only. Build.ps1 + cubit_plugin scripts now auto-discover
      # via tools/find_cubit.ps1, so this env var is informational. Set
      # CUBIT_INSTALL_DIR to pin a specific install on the self-hosted
      # runner if needed.
      CUBIT_PATH: ''
      # Heavy validation tests are an explicit manual gate. Main, PR, and
      # release-tag CI stay fast by default so the self-hosted runner does
      # not spend hours revalidating the same SHA.
      RUN_SLOW_TESTS: ${{ github.event_name == 'workflow_dispatch' && inputs.full_slow == true }}
      RUN_GOLDEN_TESTS: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_golden == true || inputs.full_slow == true) }}
      RUN_VALIDATION_TESTS: ${{ github.event_name == 'workflow_dispatch' && (inputs.run_validation_test == true || inputs.run_golden == true || inputs.full_slow == true) }}

    steps:
      - uses: actions/checkout@v4

      - name: Cancel stale main push before build/test
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $repo = "${{ github.repository }}"
          $refUri = "https://api.github.com/repos/$repo/git/ref/heads/main"
          $tip = $null
          foreach ($attempt in 1..3) {
            try {
              $mainRef = Invoke-RestMethod -Method Get -Uri $refUri -Headers $headers
              $tip = $mainRef.object.sha
              break
            } catch {
              Write-Host "::warning::GitHub API ref lookup attempt $attempt/3 failed: $($_.Exception.Message)"
              if ($attempt -lt 3) {
                Start-Sleep -Seconds (5 * $attempt)
              }
            }
          }
          if (-not $tip) {
            Write-Host "::warning::Main-ref freshness check unavailable; continuing because stale-run cancellation is an optimization."
            $tip = $env:GITHUB_SHA
          }
          Write-Host "origin/main tip: $tip"
          Write-Host "this run sha: $env:GITHUB_SHA"
          if ($tip -ne $env:GITHUB_SHA) {
            Write-Host "::warning::Stale main CI: $env:GITHUB_SHA is no longer origin/main ($tip). Cancelling before build/test."
            $uri = "https://api.github.com/repos/$repo/actions/runs/${{ github.run_id }}/cancel"
            Invoke-RestMethod -Method Post -Uri $uri -Headers $headers | Out-Null

            $deadline = (Get-Date).AddSeconds(90)
            while ((Get-Date) -lt $deadline) {
              Start-Sleep -Seconds 5
              Write-Host "Waiting for GitHub to cancel this stale run..."
            }
            Write-Host "::error::Cancellation request did not stop the stale run in time."
            exit 1
          }
          Write-Host "This main CI is current; continuing."

      - name: Cancel duplicate release-tag CI before build/test
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $patterns = @('refs/tags/v*', 'refs/tags/radia-mcp-v*', 'refs/tags/cubit-mesh-export-v*')
          $releaseTags = [System.Collections.Generic.List[string]]::new()

          foreach ($line in (git ls-remote --tags origin @patterns)) {
            $parts = $line -split '\s+'
            if ($parts.Count -lt 2 -or $parts[0] -ne $env:GITHUB_SHA) {
              continue
            }
            $ref = $parts[1] -replace '\^\{\}$', ''
            if ($ref -notlike 'refs/tags/*') {
              continue
            }
            $name = $ref.Substring('refs/tags/'.Length)
            if (-not $releaseTags.Contains($name)) {
              [void]$releaseTags.Add($name)
            }
          }

          if ($releaseTags.Count -le 1) {
            Write-Host "Release tags on this SHA: $($releaseTags -join ', ')"
            Write-Host "No duplicate release-tag CI to cancel."
            exit 0
          }

          $canonical = @(
            $releaseTags | Sort-Object `
              @{ Expression = {
                if ($_ -like 'v*') { 0 }
                elseif ($_ -like 'radia-mcp-v*') { 1 }
                elseif ($_ -like 'cubit-mesh-export-v*') { 2 }
                else { 9 }
              } },
              @{ Expression = { $_ } }
          )[0]

          Write-Host "Release tags on this SHA: $($releaseTags -join ', ')"
          Write-Host "Canonical release-tag CI for this SHA: $canonical"
          Write-Host "Current tag: $env:GITHUB_REF_NAME"
          if ($env:GITHUB_REF_NAME -eq $canonical) {
            Write-Host "This is the canonical release-tag CI; continuing."
            exit 0
          }

          Write-Host "::warning::Duplicate release-tag CI for $env:GITHUB_SHA. $canonical will represent this SHA; cancelling $env:GITHUB_REF_NAME before build/test."
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $repo = "${{ github.repository }}"
          $uri = "https://api.github.com/repos/$repo/actions/runs/${{ github.run_id }}/cancel"
          Invoke-RestMethod -Method Post -Uri $uri -Headers $headers | Out-Null

          $deadline = (Get-Date).AddSeconds(90)
          while ((Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 5
            Write-Host "Waiting for GitHub to cancel this duplicate tag run..."
          }
          Write-Host "::error::Cancellation request did not stop the duplicate tag run in time."
          exit 1

      # Release workflows consume this artifact from the exact triggering CI
      # run.  Looking up tags by SHA alone is racy: a successful main CI can
      # finish, then tags can be added to that SHA before workflow_run inspects
      # the repository.  The immutable per-run context proves whether CI itself
      # was launched from a tag ref.
      - name: Record exact CI ref context
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $patterns = @('refs/tags/v*', 'refs/tags/radia-mcp-v*', 'refs/tags/cubit-mesh-export-v*')
          $releaseTags = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $repoUrl = "https://x-access-token:$env:GITHUB_TOKEN@github.com/${{ github.repository }}.git"
            foreach ($line in (git ls-remote --tags $repoUrl @patterns)) {
              $parts = $line -split '\s+'
              if ($parts.Count -lt 2 -or $parts[0] -ne $env:GITHUB_SHA) {
                continue
              }
              $ref = $parts[1] -replace '\^\{\}$', ''
              if ($ref -like 'refs/tags/*') {
                $releaseTags += $ref.Substring('refs/tags/'.Length)
              }
            }
          }
          $context = [ordered]@{
            schema = 'radia.ci-release-context.v1'
            ref = $env:GITHUB_REF
            ref_name = $env:GITHUB_REF_NAME
            ref_type = $env:GITHUB_REF_TYPE
            sha = $env:GITHUB_SHA
            run_id = [string]$env:GITHUB_RUN_ID
            event_name = $env:GITHUB_EVENT_NAME
            release_tags = @($releaseTags | Sort-Object -Unique)
          }
          $json = $context | ConvertTo-Json
          [IO.File]::WriteAllText(
            (Join-Path $env:GITHUB_WORKSPACE 'ci-release-context.json'),
            $json,
            [Text.UTF8Encoding]::new($false))
          Write-Host $json

      - name: Upload exact CI ref context
        uses: actions/upload-artifact@v4
        with:
          name: ci-release-context
          path: ci-release-context.json
          retention-days: 30

      # ----------------------------------------------------------------
      # Guard (2026-05-28): a self-hosted job must NOT pip-install a lab
      # package into LAB's shared system Python -- it rewrites LAB's editable
      # pointer and breaks the dev loop on every run (the recurring radia-mcp
      # drift).  This static audit fails the build if a workflow reintroduces
      # such an install; the repo is imported via PYTHONPATH instead.
      # ----------------------------------------------------------------
      - name: Audit -- no lab installs into LAB's shared Python
        shell: pwsh
        run: python tools/audit_ci_no_system_install.py

      # ----------------------------------------------------------------
      # radia-mcp PUBLISH BOUNDARY lint (CLAUDE.md 公開境界): fail fast,
      # BEFORE the ~25-min build, if the public package attributes
      # verification to / design-references / leaks an internal path of a
      # commercial tool (COMSOL / FEMM / JMAG / CST).  Because
      # release-radia-mcp.yml gates the PyPI publish on THIS "CI" workflow
      # succeeding, running it here makes the boundary lint a hard
      # publish gate (not just the separate policy-lint.yml feedback run).
      # ----------------------------------------------------------------
      - name: Publish-boundary lint (radia-mcp provenance)
        shell: pwsh
        run: |
          python packages/radia-mcp/tools/policy_lint.py --selftest
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::radia-mcp boundary-lint selftest failed"; exit 1 }
          python packages/radia-mcp/tools/policy_lint.py
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::radia-mcp publish-boundary lint failed -- commercial-tool attribution / design-reference / internal-path leak in the public package"; exit 1 }

      # ----------------------------------------------------------------
      # Isolate NGSolve/Netgen from LAB's shared Python. Other editable
      # development tasks may legitimately install an older Radia release and
      # therefore change the shared NGSolve ABI while CI is queued. Building
      # against one header set and testing against another produces a valid-
      # looking .pyd that fails to load in subprocesses. A run-local venv keeps
      # the exact pyproject pins stable for the complete build/test/package job.
      # ----------------------------------------------------------------
      - name: Create isolated NGSolve environment
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP "radia-ci-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          $basePython = (Get-Command python).Source
          $gitDir = Split-Path -Parent (Get-Command git -ErrorAction Stop).Source
          & $basePython -m venv --system-site-packages $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $ciPython = Join-Path $venv 'Scripts\python.exe'
          $pins = @(& $basePython -c "import pathlib,tomllib; d=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8')); print(*[x for x in d['project']['dependencies'] if x.startswith(('ngsolve==','netgen-mesher=='))], sep='\n')")
          if ($pins.Count -ne 2) {
            Write-Host "::error::Expected exact ngsolve and netgen-mesher pins in pyproject.toml; got $($pins -join ', ')"
            exit 1
          }
          & $ciPython -m pip install --upgrade --force-reinstall --no-cache-dir @pins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $ngsolveRoot = (& $ciPython -c "import ngsolve,pathlib; print(pathlib.Path(ngsolve.__file__).parent)").Trim()
          $netgenRoot = (& $ciPython -c "import netgen,pathlib; print(pathlib.Path(netgen.__file__).parent)").Trim()
          $scripts = Join-Path $venv 'Scripts'
          [IO.File]::AppendAllText(
            $env:GITHUB_PATH,
            "$gitDir`n$scripts`n",
            [Text.UTF8Encoding]::new($false))
          "RADIA_CI_VENV=$venv" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NGSOLVE_ROOT=$ngsolveRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "NGSOLVE_DIR=$(Join-Path $ngsolveRoot 'cmake')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "Netgen_DIR=$(Join-Path $netgenRoot 'cmake')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MKLROOT=C:\Program Files\Python312\Library" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          & $ciPython -c "import importlib.metadata as m,ngsolve,tomllib,pathlib; deps=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['dependencies']; want={x.split('==',1)[0]:x.split('==',1)[1] for x in deps if x.startswith(('ngsolve==','netgen-mesher=='))}; assert ngsolve.__version__==want['ngsolve']; assert m.version('netgen-mesher')==want['netgen-mesher']; print('isolated ABI',ngsolve.__version__,m.version('netgen-mesher'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ----------------------------------------------------------------
      # Install test dependencies (MCP server tests need the mcp package).
      #
      # radia_mcp itself is NOT pip-installed.  The self-hosted runner
      # shares LAB's system Python; `pip install -e packages/radia-mcp`
      # rewrites LAB's editable radia-mcp pointer to this CI checkout
      # (C:\actions-runner\...), silently breaking the LAB dev loop on
      # every CI run (2026-05-26/27/28 recurring drift).  Instead,
      # radia_mcp is put on PYTHONPATH in every step that imports it
      # (see the PYTHONPATH env: keys below).  PYTHONPATH is prepended to
      # sys.path, so `import radia_mcp.<subpkg>.server` resolves to THIS
      # checkout (not a stale wheel / LAB editable) -- exactly what
      # test_tools_doc.py needs -- WITHOUT touching the shared system
      # Python's install registry.
      # ----------------------------------------------------------------
      - name: Install test dependencies
        shell: pwsh
        run: |
          # Pre-cleanup: orphan mcp-server-*.exe processes from a
          # previous CI run hold Scripts/mcp-server-*.exe and block
          # the editable install with WinError 32 (file in use).
          # 2026-05-22 v4.72.0 hit this on mcp-server-build123d.exe;
          # mirror release_qud.py phase 8's force-kill.
          Write-Host "Stopping any orphan mcp-server-*.exe..."
          Get-Process -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -like 'mcp-server*'
          } | ForEach-Object {
            Write-Host "  killing $($_.Name) pid=$($_.Id)"
            Stop-Process -Id $_.Id -Force
          }
          Start-Sleep -Seconds 2

          # Pre-cleanup: ~adia-mcp orphan dist-info from a botched
          # uninstall is the second known cause of CI install
          # failures (pip refuses to install on top of an "invalid
          # distribution").  Remove any *.dist-info named ~adia*.
          $sp = python -c "import site, sys; print(site.getsitepackages()[0])"
          Get-ChildItem -Path $sp -Filter "~adia*" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "  removing orphan $($_.Name)"
              Remove-Item -Path $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
            }

          python -m pip install mcp pytest-rerunfailures --quiet
          Write-Host "mcp + pytest-rerunfailures installed (radia_mcp via PYTHONPATH, not pip-installed)"

      # ----------------------------------------------------------------
      # Verify NGSolve: exact pyproject-pinned version in the run-local venv.
      # ----------------------------------------------------------------
      - name: Verify NGSolve
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:NGSOLVE_DIR\NGSolveConfig.cmake")) {
            Write-Host "::error::NGSolve not found at $env:NGSOLVE_DIR"
            Write-Host "Install: pip install ngsolve"
            exit 1
          }
          Write-Host "NGSolve: $env:NGSOLVE_ROOT"
          git --version
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::git is unavailable after activating the isolated test environment"
            exit $LASTEXITCODE
          }
          python -c "import shutil,subprocess; p=shutil.which('git'); assert p, 'git is absent from subprocess PATH'; subprocess.run([p,'--version'],check=True)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ----------------------------------------------------------------
      # Build: MSVC + MKL + NGSolve TaskManager
      # ----------------------------------------------------------------
      - name: Build with MSVC + MKL
        shell: pwsh
        # No step-level timeout-minutes -- see job-level note above.
        # Build.ps1 cold-cache on the self-hosted runner has been
        # observed at 20:04 (sha 0c0ef5d), 26 min (sha 357da370),
        # and the natural full-rebuild on LAB is ~25-35 min.
        run: |
          Write-Host "Starting Radia build..."
          # 2026-05-25: capture full stdout+stderr to file so we can upload
          # as artifact on failure. Tee-Object keeps the live console log
          # too. The embedded batch file's cmd.exe child output goes through
          # PowerShell stdout because we pipe via the *>&1 merge.
          $buildLog = "$env:GITHUB_WORKSPACE\build-msvc-stdout.log"

          # 2026-05-28: tag pushes get -Rebuild to force clean build.
          # Reason: Build.ps1 line 140-141 documents that ninja "records
          # #deps 0 for all .obj files and misses header changes".  On
          # the persistent self-hosted runner, CMakeLists.txt edits (e.g.
          # the v4.80.0 `BEFORE PRIVATE NGSOLVE_BUNDLED_INC` pybind11 ABI
          # override) do NOT trigger _radia_pybind.pyd rebuild because
          # ninja's cached .obj commands look unchanged.  Result: the
          # stale pre-fix .pyd is shipped and tests fail with
          # `ImportError: generic_type: type "RadiaField" referenced
          # unknown base type "ngfem::CoefficientFunction"` (the v4.80.0
          # CI failure that motivated this gate).
          #
          # 2026-05-30: EXTENDED to main + PR pushes too.  Motivation:
          # 2026-05-27 the ngsolve install was upgraded (bundled pybind11
          # 3.0.2 -> 3.1.0a0).  3 main-push CI runs on 2026-05-30
          # (e7bae1db / 0f8c3528 / a91e0a5b) failed at the `Run basic
          # tests` step with 0 artifacts (junit XML never written), a
          # symptom consistent with mixed-ABI .pyd files built from a
          # ninja .obj cache predating the ngsolve upgrade.  138da784's
          # CI happened to coincide with a clean rebuild and passed.
          # User-confirmed hypothesis: "src changes are too large, CI
          # can't keep up" -- the persistent runner's ninja cache lets
          # ABI drift survive across pushes when only main-push
          # incremental builds are used.  Forcing -Rebuild on every push
          # eliminates the entire stale-.obj class of bugs.  Cost: ~10-15
          # min extra per main push (full rebuild vs incremental); ~25
          # min total Build step.  Acceptable trade-off for correctness.
          $isTag = $env:GITHUB_REF -like 'refs/tags/*'
          $rebuildFlag = @('-Rebuild')
          if ($isTag) {
              Write-Host "Tag push detected ($env:GITHUB_REF) -- forcing -Rebuild for clean build"
          } else {
              Write-Host "Non-tag push -- forcing -Rebuild to defeat ninja #deps 0 stale-.obj bug"
          }
          & "${{ github.workspace }}\Build.ps1" @rebuildFlag *>&1 | Tee-Object -FilePath $buildLog
          $rc = $LASTEXITCODE
          Write-Host "Build.ps1 exit=$rc"
          Write-Host "Captured log size: $((Get-Item $buildLog -EA SilentlyContinue).Length) bytes"
          if ($rc -ne 0) {
            Write-Host "::error::Build failed with exit code $rc"
            Write-Host "=== first 5 error/Error/FAILED lines in build log ==="
            Select-String -Path $buildLog -Pattern 'error|Error|FAILED|fatal' -EA SilentlyContinue |
              Select-Object -First 5 |
              ForEach-Object { Write-Host "  $($_.LineNumber): $($_.Line)" }
            exit $rc
          }
          Write-Host "Build completed successfully."

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.sha }}
          path: build-msvc-stdout.log
          if-no-files-found: ignore
          retention-days: 7

      # ----------------------------------------------------------------
      # Verify: Check that Python and standalone C ABI binaries were produced
      # ----------------------------------------------------------------
      - name: Verify .pyd output
        shell: pwsh
        run: |
          $pyd = "${{ github.workspace }}\src\radia\_radia_pybind.pyd"
          if (-not (Test-Path $pyd)) {
            Write-Host "::error::_radia_pybind.pyd not found at $pyd"
            exit 1
          }
          $sz = [math]::Round((Get-Item $pyd).Length / 1MB, 2)
          Write-Host "_radia_pybind.pyd: ${sz} MB"
          $motorDll = "${{ github.workspace }}\src\radia\radia_motor_rom.dll"
          if (-not (Test-Path $motorDll)) {
            Write-Host "::error::radia_motor_rom.dll not found at $motorDll"
            exit 1
          }
          $motorSz = [math]::Round((Get-Item $motorDll).Length / 1KB, 1)
          Write-Host "radia_motor_rom.dll: ${motorSz} KB"

      # ----------------------------------------------------------------
      # Fetch cubit_mesh_curver.pyd from GitHub Releases binaries tag.
      #
      # CI runners do NOT have the Coreform Cubit SDK (cmake module),
      # pybind11, or the qt5_sdk needed to build the Cubit plugin
      # locally. Build.ps1 silently SKIPs this target on CI ("SKIP:
      # Cubit SDK not found at C:/Program Files/Coreform Cubit
      # 2025.3/cmake"). The pyd is built on LAB (which has the full
      # Cubit Pro install) and uploaded to the `binaries` release tag
      # by the pre-push hook (.git/hooks/pre-push). CI downloads it
      # so the cubit-mesh-export wheel ships with the bundled pyd.
      #
      # Without this step, Build_Wheel.ps1 / build-cubit-mesh-export
      # would fail their pyd-mandate check (added 2026-04-24 after
      # the PyPI 0.6.0 partial-wheel incident).
      # ----------------------------------------------------------------
      - name: Ensure cubit_mesh_curver.pyd (Build.ps1 local; binaries fallback)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tier-2 (2026-06): the .pyd now lives in the cubit-mesh-export
          # package (Build.ps1 propagates it there; the self-hosted runner
          # has Cubit 2025.12 + the SDK cmake module).  Only fetch from the
          # binaries release as a FALLBACK when Build.ps1 did not supply it.
          # download_release_asset.py is stdlib-only (urllib+json); gh CLI
          # was retired from the runner 2026-05-24.
          $pkgDir = "${{ github.workspace }}\packages\cubit-mesh-export\src\cubit_mesh_export"
          if (Test-Path "$pkgDir\cubit_mesh_curver.pyd") {
            Write-Host "cubit_mesh_curver.pyd present (Build.ps1) -- skipping binaries fetch"
          } else {
            Write-Host "cubit_mesh_curver.pyd absent -- fetching from binaries release"
            python tools\download_release_asset.py `
              --repo ${{ github.repository }} `
              --tag binaries `
              --name cubit_mesh_curver.pyd `
              --dest $pkgDir
          }

      # ----------------------------------------------------------------
      # Test: Run simple Windows integration pytest tests.
      # ----------------------------------------------------------------
      - name: Run simple tests
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: '${{ github.workspace }}\src;${{ github.workspace }}\src\radia;${{ github.workspace }}\packages\radia-mcp\src'
        run: |
          Write-Host "Running lightweight pytest gate from tests/..."
          # --reruns 2: retry transient failures up to 2x.  Commit
          # a61cecdf added pytest-rerunfailures as a dependency
          # specifically for test_omega_reduced_omega flakiness but
          # never enabled the flag.  v4.64.0 main push CI hit the same
          # test_B_accuracy_inside_iron flake (2026-05-20 02:34 JST)
          # so the flag is wired up here.
          # L0 (2026-05-30): -r aR prints per-test RERUN/FAIL summary
          # so flaky tests are visible IN the log even when the run
          # is green via reruns.  L1: Tee pytest stdout to a file so
          # that a hard crash (no junit XML written, as happened on
          # commits e7bae1db / 0f8c3528 / a91e0a5b on 2026-05-30 where
          # the artifact upload step succeeded with 0 files) still
          # leaves a parseable log for the "Annotate test failures"
          # step below.
          $pytestArgs = @(
            'tests/',
            '-v',
            '--tb=short',
            '-r', 'aR',
            '--junitxml=test-results.xml',
            '--durations=50',
            '--durations-min=1.0',
            '--reruns', '2',
            '--reruns-delay', '1'
          )
          $markerExpr = 'not golden'
          if ($env:RUN_SLOW_TESTS -ne 'true') {
            $markerExpr = 'not slow and not golden'
            Write-Host "Fast CI -- excluding @pytest.mark.slow and @pytest.mark.golden tests."
          } else {
            Write-Host "Manual full gate -- running slow simple tests here; golden tests run in their own step."
          }
          $pytestArgs += @('-m', $markerExpr)
          python -m pytest @pytestArgs 2>&1 | Tee-Object -FilePath pytest-basic-stdout.log
          $rc = $LASTEXITCODE
          Write-Host "pytest simple exit=$rc"
          if ($rc -ne 0) {
            Write-Host "::error::Simple tests failed (rc=$rc) -- see Annotate step for the test list"
            # Record the exit code; the Annotate step below re-exits
            # so that failures surface as ::error annotations BEFORE
            # the job is marked failed (otherwise GitHub UI shows no
            # failed-test names without an artifact download).
            "$rc" | Out-File -Encoding ascii pytest-basic-exit.txt
            exit $rc
          }

      - name: Run validation tests
        if: success() && env.RUN_VALIDATION_TESTS == 'true'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: '${{ github.workspace }}\src;${{ github.workspace }}\src\radia;${{ github.workspace }}\packages\radia-mcp\src'
        run: |
          Write-Host "Running validation_test pytest gate..."
          $pytestArgs = @(
            'validation_test/',
            '-v',
            '--tb=short',
            '-r', 'aR',
            '--junitxml=golden-test-results.xml',
            '--durations=50',
            '--durations-min=1.0'
          )
          $markerExpr = 'not slow and not compute_host'
          if ($env:RUN_SLOW_TESTS -ne 'true') {
            Write-Host "Manual validation gate -- excluding @pytest.mark.slow tests. Use full_slow=true for the full validation set."
          } else {
            $markerExpr = 'not compute_host'
            Write-Host "Manual full validation gate -- running validation_test including slow tests; compute_host tests remain mdx/hibino-only."
          }
          if ($markerExpr) { $pytestArgs += @('-m', $markerExpr) }
          python -m pytest @pytestArgs 2>&1 | Tee-Object -FilePath pytest-golden-stdout.log
          $rc = $LASTEXITCODE
          Write-Host "pytest validation exit=$rc"
          if ($rc -ne 0) {
            Write-Host "::error::Validation tests failed (rc=$rc) -- see Annotate step for the test list"
            "$rc" | Out-File -Encoding ascii pytest-golden-exit.txt
            exit $rc
          }

      # ----------------------------------------------------------------
      # Panel tests (NGSolve + PySide6, no Cubit).  Runs:
      #   validation_test/panels/test_motor_transient_golden.py     (3 tests)
      #   validation_test/panels/test_motor_lamination_golden.py    (4 tests)
      #   validation_test/panels/test_panel_output_health.py        (5 tests)
      #   validation_test/panels/test_combo_wheel_guard.py          (6 tests, parametrized)
      # PySide6 tests added 2026-05-30 once the Qt6 DLL preload in
      # tests/conftest.py made `from PySide6.QtCore import ...` survive
      # the MKL bin add_dll_directory (was 0xc0000139 on LAB pytest).
      # ----------------------------------------------------------------
      - name: Run panel smoke tests
        if: success() && env.RUN_VALIDATION_TESTS == 'true'
        # Panel smoke tests: UX/output health only. Motor golden tests
        # are separated into the manual golden gate below.
        # Re-enabled 2026-05-28: the tests pass `--linear-solver sparsecholesky`
        # (ngsolve built-in, no MKL) -- identical direct-solver solution to the
        # production pardiso default, but immune to the MKL PARDISO threading-
        # layer load that FATALs under the pytest subprocess.  (The CST Studio
        # Suite unversioned-MKL-DLL shadow that originally broke these in
        # v4.80.4 was also removed from the runner.)  The 3 TaskManager-import
        # NameErrors the disabled period hid were fixed in the same change.
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: '${{ github.workspace }}\src;${{ github.workspace }}\src\radia'
          PYTHONIOENCODING: utf-8
        run: |
          Write-Host "Running motor panel smoke tests..."
          python -c "import importlib.util, sys; sys.exit(0 if importlib.util.find_spec('PySide6') else 2)"
          if ($LASTEXITCODE -eq 2) {
            Write-Host "PySide6 is not installed; skipping legacy Qt panel smoke tests."
            exit 0
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Ensure C:\temp exists for the test fixtures
          New-Item -ItemType Directory -Force -Path C:\temp | Out-Null
          # L0+L1 (2026-05-30): -r aR + Tee to stdout file, same
          # pattern as "Run simple tests" above.  See note there.
          python -m pytest validation_test/panels/test_panel_output_health.py `
                            validation_test/panels/test_combo_wheel_guard.py `
            -v --tb=short -r aR `
            --junitxml=panel-test-results.xml `
            --durations=25 --durations-min=0.5 `
            --reruns 1 --reruns-delay 1 `
            2>&1 | Tee-Object -FilePath pytest-panel-stdout.log
          $rc = $LASTEXITCODE
          Write-Host "pytest panel smoke exit=$rc"
          if ($rc -ne 0) {
            Write-Host "::error::Panel smoke tests failed (rc=$rc) -- see Annotate step for the test list"
            "$rc" | Out-File -Encoding ascii pytest-panel-exit.txt
            exit $rc
          }

      - name: Run panel golden tests
        if: success() && env.RUN_GOLDEN_TESTS == 'true'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        env:
          PYTHONPATH: '${{ github.workspace }}\src;${{ github.workspace }}\src\radia'
          PYTHONIOENCODING: utf-8
        run: |
          Write-Host "Running motor panel golden tests..."
          New-Item -ItemType Directory -Force -Path C:\temp | Out-Null
          python -m pytest validation_test/panels/test_motor_transient_golden.py `
                            validation_test/panels/test_motor_lamination_golden.py `
            -v --tb=short -r aR `
            --junitxml=panel-golden-test-results.xml `
            --durations=25 --durations-min=0.5 `
            --reruns 1 --reruns-delay 1 `
            2>&1 | Tee-Object -FilePath pytest-panel-golden-stdout.log
          $rc = $LASTEXITCODE
          Write-Host "pytest panel golden exit=$rc"
          if ($rc -ne 0) {
            Write-Host "::error::Panel golden tests failed (rc=$rc) -- see Annotate step for the test list"
            "$rc" | Out-File -Encoding ascii pytest-panel-golden-exit.txt
            exit $rc
          }

      # ----------------------------------------------------------------
      # L1 (2026-05-30): Surface failed / flaky tests as GitHub
      # Actions annotations so they show inline in the workflow page
      # WITHOUT requiring the user to download the test-results.xml
      # artifact.  Parses both junit XMLs (if present) and the stdout
      # logs (fallback if pytest crashed before writing the XML, which
      # was the silent-fail mode on 2026-05-30 commits e7bae1db /
      # 0f8c3528 / a91e0a5b -- the upload-artifact step succeeded with
      # 0 files because no XML was ever written).
      #
      # Output:
      #   ::error::tests/foo.py::test_bar -- <message>      (failed)
      #   ::warning::FLAKY tests/foo.py::test_bar           (passed after rerun)
      #   ::error::pytest crashed without writing junit XML -- see stdout log
      # ----------------------------------------------------------------
      - name: Annotate test failures and reruns
        if: always()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $found = $false
          foreach ($pair in @(
            @{ xml = 'test-results.xml';              log = 'pytest-basic-stdout.log';        label = 'simple' },
            @{ xml = 'golden-test-results.xml';       log = 'pytest-golden-stdout.log';       label = 'golden' },
            @{ xml = 'panel-test-results.xml';        log = 'pytest-panel-stdout.log';        label = 'panel-smoke' },
            @{ xml = 'panel-golden-test-results.xml'; log = 'pytest-panel-golden-stdout.log'; label = 'panel-golden' }
          )) {
            $xmlPath = $pair.xml
            $logPath = $pair.log
            $label   = $pair.label
            if (Test-Path $xmlPath) {
              $found = $true
              Write-Host "=== Annotating from $xmlPath ($label) ==="
              try {
                $xml = [xml](Get-Content $xmlPath -Encoding utf8 -Raw)
                $fails = 0; $errors = 0; $reruns = 0
                foreach ($tc in $xml.SelectNodes('//testcase')) {
                  $cn = $tc.classname; $nm = $tc.name
                  $f = $tc.SelectSingleNode('failure')
                  $e = $tc.SelectSingleNode('error')
                  $r = $tc.SelectNodes('rerun')
                  if ($f) {
                    $fails++
                    $msg = ($f.message -replace "`r?`n", ' ').Substring(0, [Math]::Min(200, $f.message.Length))
                    Write-Host "::error::[$label FAIL] ${cn}::${nm} -- $msg"
                  }
                  if ($e) {
                    $errors++
                    $msg = ($e.message -replace "`r?`n", ' ').Substring(0, [Math]::Min(200, $e.message.Length))
                    Write-Host "::error::[$label ERROR] ${cn}::${nm} -- $msg"
                  }
                  if ($r -and $r.Count -gt 0 -and -not $f -and -not $e) {
                    $reruns++
                    Write-Host "::warning::[$label FLAKY] ${cn}::${nm} -- passed after $($r.Count) rerun(s)"
                  }
                }
                Write-Host "  $label summary: $fails fail, $errors error, $reruns flaky-but-recovered"
              } catch {
                Write-Host "::error::Failed to parse ${xmlPath}: $($_.Exception.Message)"
              }
            } elseif (Test-Path $logPath) {
              # No junit XML -- pytest likely crashed.  Surface the
              # tail of the stdout log so the failing test is at least
              # in the workflow log (the LAB worker log is a fallback).
              Write-Host "::error::[$label] pytest crashed without writing junit XML -- last 30 stdout lines:"
              Get-Content $logPath -Tail 30 | ForEach-Object { Write-Host "  $_" }
            }
          }
          if (-not $found) {
            Write-Host "::warning::No junit XML found (test step may have been skipped)"
          }

      # ----------------------------------------------------------------
      # L2 (2026-05-30): Archive junit + stdout to a per-SHA folder on
      # the self-hosted runner.  This makes historical CI data live on
      # LAB disk (not just GitHub artifact storage), so we can later
      # `grep` C:\actions-runner\test-history\<sha>\ without hitting
      # the 60-req/hour unauthenticated GitHub API rate limit.
      # ----------------------------------------------------------------
      - name: Archive junit on self-hosted runner
        if: always() && runner.environment == 'self-hosted'
        shell: pwsh
        working-directory: ${{ github.workspace }}
        continue-on-error: true
        run: |
          $dst = "C:\actions-runner\test-history\${{ github.sha }}_${{ github.run_id }}_${{ github.run_attempt }}"
          New-Item -ItemType Directory -Force -Path $dst | Out-Null
          foreach ($f in @(
            'test-results.xml','golden-test-results.xml',
            'panel-test-results.xml','panel-golden-test-results.xml','mcp-test-results.xml',
            'pytest-basic-stdout.log','pytest-golden-stdout.log',
            'pytest-panel-stdout.log','pytest-panel-golden-stdout.log'
          )) {
            if (Test-Path $f) {
              Copy-Item $f -Destination $dst -Force
              Write-Host "  archived $f"
            }
          }
          Write-Host "Archived under: $dst"

      # ----------------------------------------------------------------
      # Upload test results for GitHub Actions summary
      # ----------------------------------------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results.xml
            golden-test-results.xml
            panel-test-results.xml
            panel-golden-test-results.xml
            pytest-basic-stdout.log
            pytest-golden-stdout.log
            pytest-panel-stdout.log
            pytest-panel-golden-stdout.log
          retention-days: 30

      # ----------------------------------------------------------------
      # Build wheel (DryRun: build + verify only, no upload)
      # ----------------------------------------------------------------
      - name: Build wheel
        if: success()
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          & "${{ github.workspace }}\Build_Wheel.ps1" -DryRun
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::Wheel build failed"
            exit $LASTEXITCODE
          }

      # ----------------------------------------------------------------
      # Upload native binaries as an artifact for the CD workflow to consume
      # ----------------------------------------------------------------
      - name: Upload native binary artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radia-pyd
          path: |
            src/radia/*.pyd
            src/radia/*.dll
            src/radia/*.so
            src/radia/*.dylib
          retention-days: 7

      # ----------------------------------------------------------------
      # Upload wheel as artifact for PyPI publishing
      # ----------------------------------------------------------------
      - name: Upload wheel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radia-wheel
          path: dist/*.whl
          retention-days: 7

      # ----------------------------------------------------------------
      # Build cubit-mesh-export wheel (includes .pyd, .ccm, .ccl)
      # ----------------------------------------------------------------
      - name: Build cubit-mesh-export wheel
        if: success()
        shell: pwsh
        env:
          # Skip the dev-side mtime freshness gate in CI: self-hosted
          # runners have persistent workspaces and git checkout does not
          # reliably normalise mtimes, producing false positives that
          # block unrelated commits (2026-04-14 incident: 2D axisym
          # validation commit blocked by stale-binary false alarm). CI
          # has its own wheel-content guard in release-cubit-mesh-export
          # .yml that verifies .ccm/.ccl are present at publish time.
          CUBIT_MESH_EXPORT_SKIP_FRESHNESS_CHECK: "1"
        run: |
          $pkgDir = "${{ github.workspace }}\packages\cubit-mesh-export\src\cubit_mesh_export"
          # Tier-2 (2026-06): Build.ps1 propagates the .ccm + .pyd DIRECTLY
          # into the cubit-mesh-export package (src/radia no longer carries
          # them -- cme is the sole shipper).  Verify they are present
          # in-place; missing any is a MANDATORY fail (refuse a partial
          # wheel, per the 2026-04-24 PyPI 0.6.0 partial-wheel incident).
          $binaries = @("cubit_mesh_curver.pyd", "cubit_mesh_export.ccm")
          $missing = @()
          foreach ($b in $binaries) {
            if (Test-Path "$pkgDir\$b") {
              Write-Host "Present in cubit-mesh-export package: $b"
            } else {
              $missing += $b
            }
          }
          if ($missing.Count -gt 0) {
            Write-Host "::error::cubit-mesh-export package missing required binaries: $($missing -join ', ')"
            Write-Host "         Build.ps1 did not propagate them. Refusing to build a partial wheel."
            exit 1
          }
          pip install build wheel --quiet
          Push-Location "${{ github.workspace }}\packages\cubit-mesh-export"
          python -m build --wheel
          # All 3 binaries are present (verified above) → retag as cp312/win_amd64
          $whl = Get-ChildItem dist\*.whl | Select-Object -First 1
          python -m wheel tags --python-tag cp312 --abi-tag cp312 --platform-tag win_amd64 --remove $whl.FullName
          Write-Host "Retagged: $(Get-ChildItem dist\*.whl | Select-Object -First 1)"
          Pop-Location

      - name: Upload cubit-mesh-export wheel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cubit-mesh-export-wheel
          path: packages/cubit-mesh-export/dist/*.whl
          retention-days: 7

      # ----------------------------------------------------------------
      # Build radia-mcp wheel (pure Python, no binaries)
      # ----------------------------------------------------------------
      - name: Build radia-mcp wheel
        if: success()
        shell: pwsh
        run: |
          pip install build --quiet
          Push-Location "${{ github.workspace }}\packages\radia-mcp"
          python -m build --wheel
          Pop-Location

      - name: Upload radia-mcp wheel
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: radia-mcp-wheel
          path: packages/radia-mcp/dist/*.whl
          retention-days: 7

      # ----------------------------------------------------------------
      # Post-install selftest: install the just-built radia-mcp wheel
      # and invoke --selftest on every public MCP server.  This catches:
      #   - broken CLI entrypoint (console_scripts mis-wired)
      #   - missing imports only reachable from __main__
      #   - lint-rule regressions against the fixture examples
      # It's complementary to `tests/mcp_server/test_selftest.py` (which
      # calls _selftest() directly in the source tree) — here we verify
      # the *installed* wheel behaves the same.
      # ----------------------------------------------------------------
      - name: Post-install MCP selftest (5 core public servers)
        # Gated to main-only (2026-05-25) to avoid the concurrency
        # race that bit radia-mcp-v0.73.0 + v0.74.0 tag CIs:
        # main + tag CI fire simultaneously on the same self-hosted
        # LAB runner, both run `pip install --force-reinstall
        # packages/radia-mcp/dist/*.whl`, and one loses the race for
        # Scripts/mcp-server-*.exe -> WinError 32 file-in-use ->
        # job FAIL -> workflow_run.conclusion != 'success' ->
        # publish-pypi skipped silently.  The Post-install selftest's
        # job is "did we break server import in this commit", which
        # main CI catches just fine; tag CI doesn't need to repeat it.
        # The "MCP response regression tests" pytest step below still
        # runs on tag CI and validates the same surface area without
        # touching Scripts/mcp-server-*.exe.
        if: success() && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          # radia_mcp resolved from THIS checkout via PYTHONPATH -- we do
          # NOT pip-install it into the shared system Python (that rewrites
          # LAB's editable radia-mcp pointer to the CI clone and breaks the
          # LAB dev loop every run; 2026-05-26/27/28 recurring drift).
          # `python -m radia_mcp.X.server --selftest` below exercises the
          # same module main()/imports/lint as the built wheel (the wheel is
          # a verbatim package of this source), without touching system Python.
          PYTHONPATH: '${{ github.workspace }}\packages\radia-mcp\src;${{ github.workspace }}\src;${{ github.workspace }}\src\radia'
        run: |
          $whl = Get-ChildItem "${{ github.workspace }}\packages\radia-mcp\dist\*.whl" `
                 | Select-Object -First 1
          if (-not $whl) {
            Write-Host "::error::No radia-mcp wheel found"
            exit 1
          }
          Write-Host "Wheel built OK: $($whl.Name). Running --selftest against source (PYTHONPATH)."

          # Drive each server via `python -m` rather than the .exe shim.
          # Equivalent entrypoint (same module main()), but bypasses the
          # console-script wrapper entirely — matches how end users would
          # invoke these from `uv run --with radia-mcp -m ...` or
          # `python -m radia_mcp.X.server`.
          $servers = @(
            @{ name = 'mcp-server-radia-ngsolve';  mod = 'radia_mcp.radia_ngsolve.server' },
            @{ name = 'mcp-server-cubit';          mod = 'radia_mcp.cubit.server' },
            @{ name = 'mcp-server-build123d';      mod = 'radia_mcp.build123d.server' },
            @{ name = 'mcp-server-gmsh';           mod = 'radia_mcp.gmsh.server' },
            @{ name = 'mcp-server-radia-streamfunction';  mod = 'radia_mcp.streamfunction.server' }
          )
          $failed = @()
          foreach ($s in $servers) {
            Write-Host ""
            Write-Host "=== $($s.name) --selftest ==="
            python -m $s.mod --selftest
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error::$($s.name) --selftest exited $LASTEXITCODE"
              $failed += $s.name
            }
          }
          if ($failed.Count -gt 0) {
            Write-Host "::error::selftest failed on: $($failed -join ', ')"
            exit 1
          }
          Write-Host ""
          Write-Host "All 5 core MCP servers passed --selftest."

      # ----------------------------------------------------------------
      # MCP response regression tests (topic coverage + unknown-topic
      # graceful-degrade checks across all knowledge servers). These
      # run against the installed wheel so they also serve as a second
      # validation pass on the --selftest step above.
      # ----------------------------------------------------------------
      - name: MCP response regression tests
        if: success()
        shell: pwsh
        env:
          # radia_mcp from THIS checkout via PYTHONPATH (no system install).
          PYTHONPATH: '${{ github.workspace }}\packages\radia-mcp\src;${{ github.workspace }}\src;${{ github.workspace }}\src\radia'
        run: |
          python -m pytest tests/mcp_server/ -v --tb=short `
            --durations=25 --durations-min=0.5 `
            --junitxml=mcp-test-results.xml
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::MCP response regression tests failed"
            exit $LASTEXITCODE
          }

      - name: Upload MCP test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-test-results
          path: mcp-test-results.xml
          retention-days: 30
