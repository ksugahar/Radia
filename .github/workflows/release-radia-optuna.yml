name: Release radia-optuna

# Manager dispatches on the exact radia-optuna-v<version> tag. Both jobs consume
# the same immutable successful main-CI wheel; neither builds a distribution.
on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: "Successful main push/manual CI run gated by release-quad"
        required: true
        type: string
      candidate_sha256:
        description: "SHA256 emitted by release_quad optuna-done"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: radia-optuna-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      proof_artifact_id: ${{ steps.proof.outputs.artifact-id }}
      artifact_id: ${{ steps.audit.outputs.artifact_id }}
      wheel_sha256: ${{ steps.audit.outputs.wheel_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify exact tag, successful main CI and immutable wheel before approval
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.ci_run_id }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          python packages/radia-optuna/tools/verify_publication.py \
            --run-id "$RUN_ID" --candidate-sha256 "$CANDIDATE_SHA256" \
            --destination dist --receipt publication-proof.json
      - name: Freeze the approval proof
        id: proof
        uses: actions/upload-artifact@v4
        with:
          name: radia-optuna-publication-proof
          path: publication-proof.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/radia-optuna-v') &&
      needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download the immutable approval proof
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.verify.outputs.proof_artifact_id }}
          run-id: ${{ github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: proof
      - name: Recheck the same source, CI attempt, artifact ID and wheel after approval
        id: audit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.ci_run_id }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
        run: |
          python packages/radia-optuna/tools/verify_publication.py \
            --run-id "$RUN_ID" --candidate-sha256 "$CANDIDATE_SHA256" \
            --destination dist --receipt publication-after-approval.json \
            --approved-receipt proof/publication-proof.json
      - name: Publish the exact candidate to PyPI
        if: steps.audit.outputs.pypi_exists == 'false'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
      - name: Publish or resume the same GitHub Release bytes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.audit.outputs.tag }}
          VERSION: ${{ steps.audit.outputs.version }}
          WHEEL_NAME: ${{ steps.audit.outputs.wheel }}
          WHEEL_SHA256: ${{ steps.audit.outputs.wheel_sha256 }}
          RELEASE_EXISTS: ${{ steps.audit.outputs.release_exists }}
          ASSET_EXISTS: ${{ steps.audit.outputs.github_asset_exists }}
        run: |
          printf 'Shared CUDA kernels with Python and plain MEX adapters; Optuna 5.0.0 oracle checks. CPU/GPU selection is explicit; management and sequential RNG remain on the host. See the tagged package documentation for qualification scope.\n\nWheel SHA256: `%s`\n' "$WHEEL_SHA256" > release-notes.txt
          if [ "$RELEASE_EXISTS" == "false" ]; then
            gh release create "$TAG_NAME" "dist/$WHEEL_NAME" --verify-tag \
              --title "radia-optuna v${VERSION}" --notes-file release-notes.txt
          elif [ "$ASSET_EXISTS" == "false" ]; then
            gh release upload "$TAG_NAME" "dist/$WHEEL_NAME"
          else
            echo "Existing release asset has the verified candidate SHA256; resuming without upload."
          fi
