[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cubit-mesh-export"
version = "1.0.2"
description = "Solver-neutral mesh export from Coreform Cubit: high-order curved .vol/.msh/.bdf, Kelvin transformation, Dirichlet/symmetry label conventions"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.13"
authors = [
    {name = "Kengo Sugahara"},
]
keywords = ["cubit", "mesh", "netgen", "ngsolve", "finite-element", "hex-mesh"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    # The bundled native curver uses Netgen's C++ ABI. Keep both packages on
    # the exact version used to build the wheel and deployed Cubit DLLs.
    "netgen-mesher==6.2.2606",
    "ngsolve==6.2.2606",
    "numpy",
]

[project.urls]
Homepage = "https://github.com/ksugahar/Radia"

[project.scripts]
cubit-plugin-install = "cubit_mesh_export.install:main"
cubit-smoke-test = "cubit_mesh_export.smoke_test:main"
cubit-toolbar-smoke-test = "cubit_mesh_export.toolbar_smoke:main"
check-vol = "cubit_mesh_export.check:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Note (radia 4.80.0): "*.ccl" removed.  The Qt5 GUI .ccl was deleted
# (RadiaComp.cpp gone); exporter-owned PySide6 toolbar in cubit_gui
# replaces it.  cubit-plugin-install now treats any deployed .ccl as stale.
cubit_mesh_export = ["*.pyd", "*.so", "*.ccm", "native_payloads.json"]
"cubit_mesh_export.cubit_helpers" = ["*.py"]
"cubit_mesh_export.cubit_gui" = ["*.jou", "cubit_toolbar/scripts/*.py", "cubit_toolbar/icons/*.svg", "cubit_toolbar/toolbars/*.tmpl"]

[tool.setuptools.exclude-package-data]
cubit_mesh_export = ["bridge.py"]
