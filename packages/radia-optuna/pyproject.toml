[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radia-optuna"
version = "0.1.2"
description = "Independent MATLAB optimization implementation differentially verified against Optuna 4.9.0"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [{name = "Radia Development Team"}]
keywords = ["matlab", "optuna", "optimization", "tpe", "cma-es", "simulink"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
# Required only by MATLAB features whose upstream Optuna 4.9.0 behavior is
# deliberately executed through Python: GP acquisition, scrambled QMC, and
# parameter-importance evaluators. Native Random/TPE/evolutionary/pruner use
# does not import Python at run time.
upstream = [
    "optuna==4.9.0",
    "scipy>=1.11",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "cmaes>=0.12.0",
]
test = [
    "build>=1.2",
    "pytest>=8",
    "wheel>=0.45",
]

[project.urls]
Homepage = "https://github.com/ksugahar/Radia"
Repository = "https://github.com/ksugahar/Radia"
Documentation = "https://github.com/ksugahar/Radia/blob/main/matlab/README.md"

[project.scripts]
radia-optuna-path = "radia_optuna.cli:path_main"
radia-optuna-doctor = "radia_optuna.cli:doctor_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radia_optuna = ["manifest.json"]
