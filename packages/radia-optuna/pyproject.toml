[build-system]
requires = ["setuptools>=77", "wheel", "cmake>=3.20", "ninja", "pybind11==3.0.2"]
build-backend = "setuptools.build_meta"

[project]
name = "radia-optuna"
version = "0.5.0"
description = "Shared native CPU/CUDA optimization with Python and MATLAB/Simulink adapters, verified against Optuna 5.0.0"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0 AND MIT AND BSD-3-Clause"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Radia Development Team"}]
keywords = ["matlab", "pybind11", "cuda", "optuna", "optimization", "tpe", "simulink"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
# Existing approved CUDA runtime pin from root [project.optional-dependencies]
# and radia-simulink; no MATLAB runtime discovery from Python.
native = ["nvidia-cuda-runtime-cu12==12.8.57; sys_platform == 'win32'"]
# Required only by MATLAB features whose upstream Optuna 5.0.0 behavior is
# deliberately executed through Python: GP acquisition, scrambled QMC,
# parameter-importance/terminator evaluators, storage transports,
# visualization, and lazy integrations. Native Random/TPE/evolutionary/pruner
# use does not import Python at run time. Target-specific Optuna integration
# dependencies remain optional exactly as they are upstream.
upstream = [
    "optuna==5.0.0",
    "scipy>=1.11",
    "torch>=2.0",
    "scikit-learn>=1.3",
    "cmaes>=0.12.0",
]
test = [
    "build>=1.2",
    "pytest>=8",
    "wheel>=0.45",
]

[project.urls]
Homepage = "https://github.com/ksugahar/Radia"
Repository = "https://github.com/ksugahar/Radia"
Documentation = "https://github.com/ksugahar/Radia/blob/main/matlab/README.md"

[project.scripts]
radia-optuna-path = "radia_optuna.cli:path_main"
radia-optuna-doctor = "radia_optuna.cli:doctor_main"
radia-optuna-bridge = "radia_optuna.bridge:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radia_optuna = ["manifest.json", "evidence_manifest.json", "native_build.json"]
