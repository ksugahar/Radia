[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radia-mcp"
version = "0.2.2"
description = "MCP servers for Radia CAE ecosystem (radia-ngsolve, ih, electromagnet, peec, cubit, gmsh)"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [{name = "Kengo Sugahara"}]
dependencies = [
    "radia",
    "mcp>=1.0",
]

[project.urls]
Repository = "https://github.com/ksugahar/Radia"

[project.scripts]
mcp-server-radia-ngsolve = "radia.mcp_server.radia_ngsolve.server:main"
mcp-server-ih = "radia.mcp_server.ih.server:main"
mcp-server-electromagnet = "radia.mcp_server.electromagnet.server:main"
mcp-server-peec = "radia.mcp_server.peec.server:main"
mcp-server-cubit = "radia.mcp_server.cubit.server:main"
mcp-server-gmsh = "radia.mcp_server.gmsh.server:main"
mcp-server-elf = "radia.mcp_server.elf.server:main"
mcp-server-build123d = "radia.mcp_server.build123d.server:main"

[tool.setuptools.packages.find]
where = ["src"]
