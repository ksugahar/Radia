[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radia-mcp"
version = "2.0.3"
# IMPORTANT: PyPI Warehouse enforces Summary max length = 512 chars.
# 0.72.0-0.74.0 silently failed publish-pypi (twine reject) because
# the per-release changelog accumulated >512 chars here.  Keep this
# short and stable; release-specific notes go in CHANGELOG.md.
description = "MCP workflows and executable engineering guidance for Radia: build123d, Gmsh post-processing, NGSolve, mixed-omega, PEEC, induction heating and optimization. Cubit MCP, the curved .vol worker and check-vol."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{name = "Kengo Sugahara"}]
# Core servers import without Radia, Cubit, MKL or a native build.
# Optional execution backends are installed only for their selected workflows.
dependencies = [
    "mcp>=1.21.1,<2",
]

[project.optional-dependencies]
maintenance = ["tomlkit>=0.13,<1"]
# build123d analysis uses check-vol (radia.vol_check, no Cubit licence), Netgen,
# and the post-migration Radia serializer. Publish that Radia release before
# distributing this extra: the published 5.3.3 writer has no PayloadV42.
build123d = [
    "build123d>=0.6",
    "Pillow>=10.0",
    "ngsolve==6.2.2608",
    "netgen-mesher==6.2.2608",
    "radia>5.3.3",
]
# Cubit MCP. Licensed Cubit is found at run time; check-vol comes from radia
# (radia.vol_check, first released after 5.4.6); the curved .vol export
# additionally needs the locally built plugin (native/cubit_vol_export).
cubit = [
    "numpy>=1.24",
    "ngsolve==6.2.2608",
    "netgen-mesher==6.2.2608",
    "radia>5.4.6",
]
# CadQuery interop: `execute_cadquery` + `cadquery_to_cubit_hex` let
# users author geometry in either sibling OCCT CAD library and route
# through the same Cubit hex-mesh pipeline. Enables interop with
# rishigundakaram/cadquery-mcp-server via the STEP boundary.
cadquery = [
    "cadquery>=2.5",
]
# gmsh_post: MSH v4.2 inspect / validate / convert / write_node_data, plus
# the NumPy/SciPy field post-processing and Matplotlib raster tools.
gmsh = [
    "gmsh>=5.0.0.dev0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.8",
    "Pillow>=10.0",
]
# blender_field_animation caller side: HDF5 dataset I/O and the rendered-glyph
# checks. bpy itself lives only in the separate Blender worker interpreter.
blender = [
    "numpy>=1.24",
    "h5py>=3.8",
]
# Solver-neutral optimization, Krylov and inverse-problem helpers
# (radia-mcp-optimize / matrix-solvers tools).
numeric = [
    "numpy>=1.24",
    "scipy>=1.10",
]
# Topology-optimization shape regeneration: Radia density/level-set output
# -> watertight STL -> headless Cubit -> gated `.vol` / `.msh` artifacts.
# `trimesh` is also the independent STL closure/volume referee used before
# Cubit consumes the surface.
# The STL/marching-cubes stack belongs to radia's own `topopt-cad` extra.
shape-regeneration = [
    "numpy>=1.24",
    "radia[topopt-cad]>=4.95.51",
    "scipy>=1.10",
    "gmsh>=5.0.0.dev0",
]
# YouTube transcript scraping for Cubit/build123d/gmsh tutorial
# absorption (cubit_youtube / build123d_youtube / gmsh_youtube
# sub-sources). stdlib-only otherwise.
youtube = [
    "youtube-transcript-api>=1.0",
]
# radia-ngsolve pulls in ngsolve + radia core for full-fidelity FEM
# scripting help (example snippets referenced in `radia_knowledge.py`).
# The MCP server itself loads without radia installed; users only need
# radia for tools that embed radia computation. Install with:
#   pip install radia-mcp[radia]
radia = [
    "radia>=4.6.1",
    "scipy>=1.10",
]
# Universal response network fitting (radia_ngsolve urn tools).
urn = [
    "radia[urn]>=4.6.1",
]
# All MCP servers including the radia-coupled knowledge base.
full = [
    "radia-mcp[blender,build123d,cadquery,cubit,gmsh,numeric,shape-regeneration,youtube,radia,urn]",
]

[project.urls]
Repository = "https://github.com/ksugahar/Radia"

[project.scripts]
# One command; servers are selected by catalog key: radia-mcp serve <key>.
radia-mcp = "radia_mcp.maintenance:main"
radia-acoustic-fembem-mcp-config = "radia_mcp.acoustic_fembem.integration:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"radia_mcp.blender" = ["colormaps.json"]
"radia_mcp.ih" = ["prompts/*.md"]
"radia_mcp.peec" = ["prompts/*.md"]
"radia_mcp.onshape" = ["knowledge/*.md"]
"radia_mcp.cubit" = ["README.md"]
"radia_mcp.matlab" = [
    "skill.md",
    "extensions/*.json",
    "matlab/+radia_mcp_matlab/*.m",
]
"radia_mcp.acoustic_fembem" = [
    "skill.md",
    "extensions/*.json",
]
"radia_mcp.matlab_agentic_ml" = [
    "skill.md",
]
"radia_mcp.mathematica" = [
    "*.md",
    "basis_functions/*.md",
    "basis_functions/*.m",
    "basis_functions/*.wls",
    "differential_geometry/*.md",
    "differential_geometry/*.wls",
]
