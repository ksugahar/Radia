[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "radia-mcp"
version = "0.33.7"
description = "MCP servers for the Radia CAE ecosystem. 0.33.7 (2026-04-28): peec_inductance knowledge updated for radia 4.12.0 m-only policy (auto-detect removed). 0.33.6: security fix (drop hardcoded Coreform Learn credentials from license_warmup.py); CLN tree-cotree gauge knowledge corrected to use R-weighted accumulated Apotential (validated against analytic Cauer-I); knowledge/ subdir refactor; redundant cubit_ prefix removed from radia_mcp.cubit.* modules. 0.33.5: peec_inductance_knowledge updated to reflect radia_peec_inductance.py merge into IHWindow Method (radia 4.10.0 panel unification)."
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.10"
authors = [{name = "Kengo Sugahara"}]
# Core dependencies cover the Cubit + build123d MCP servers which are
# standalone (no radia core, no MKL, no C++ build). Companies that only
# need Cubit integration can `pip install radia-mcp` without pulling in
# the full radia wheel.
dependencies = [
    "mcp>=1.0",
]

[project.optional-dependencies]
# build123d-side tools need the build123d library itself.
build123d = [
    "build123d>=0.6",
]
# CadQuery interop: `execute_cadquery` + `cadquery_to_cubit_hex` let
# users author geometry in either sibling OCCT CAD library and route
# through the same Cubit hex-mesh pipeline. Enables interop with
# rishigundakaram/cadquery-mcp-server via the STEP boundary.
cadquery = [
    "cadquery>=2.5",
]
# gmsh_post: MSH v4.1 inspect / validate / convert / write_node_data.
# Depends only on the gmsh Python bindings (pure pip wheel, no MKL).
gmsh = [
    "gmsh>=4.10",
]
# YouTube transcript scraping for Cubit/build123d/gmsh tutorial
# absorption (cubit_youtube / build123d_youtube / gmsh_youtube
# sub-sources). stdlib-only otherwise.
youtube = [
    "youtube-transcript-api>=1.0",
]
# radia-ngsolve pulls in ngsolve + radia core for full-fidelity FEM
# scripting help (example snippets referenced in `radia_knowledge.py`).
# The MCP server itself loads without radia installed; users only need
# radia for tools that embed radia computation. Install with:
#   pip install radia-mcp[radia]
radia = [
    "radia>=4.6.1",
]
# All MCP servers including the radia-coupled knowledge base.
full = [
    "radia-mcp[build123d,cadquery,gmsh,youtube,radia]",
]

[project.urls]
Repository = "https://github.com/ksugahar/Radia"

[project.scripts]
# Public MCP servers. All load standalone (mcp>=1.0 only). The
# "radia-coupled" ones reference radia from inside example snippets in
# their knowledge modules, but importing the server does not require
# radia to be installed.
mcp-server-cubit = "radia_mcp.cubit.server:main"
mcp-server-build123d = "radia_mcp.build123d.server:main"
mcp-server-radia-interop = "radia_mcp.interop.server:main"
mcp-server-gmsh = "radia_mcp.gmsh.server:main"
mcp-server-elf = "radia_mcp.elf.server:main"
mcp-server-radia-ngsolve = "radia_mcp.radia_ngsolve.server:main"
mcp-server-ih = "radia_mcp.ih.server:main"
mcp-server-peec = "radia_mcp.peec.server:main"
mcp-server-electromagnet = "radia_mcp.electromagnet.server:main"

[tool.setuptools.packages.find]
where = ["src"]
