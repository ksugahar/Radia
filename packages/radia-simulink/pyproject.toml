[build-system]
requires = ["setuptools>=77", "wheel>=0.45", "tomli>=2; python_version < '3.11'"]
build-backend = "setuptools.build_meta"

[project]
name = "radia-simulink"
version = "0.1.5rc1"
description = "Experimental Radia MATLAB/Simulink native backends and LTspice integration"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Radia"
authors = [{name = "Radia Development Team"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
gpu = ["numpy>=1.26", "ngsolve==6.2.2608",
       "nvidia-cuda-runtime-cu12==12.8.57; sys_platform == 'win32'",
       "nvidia-cublas-cu12==12.8.3.14; sys_platform == 'win32'",
       "nvidia-cusolver-cu12==11.7.2.55; sys_platform == 'win32'",
       "nvidia-cusparse-cu12==12.5.7.53; sys_platform == 'win32'",
       "nvidia-nvjitlink-cu12==12.8.61; sys_platform == 'win32'"]
exchange = ["numpy>=1.26", "h5py>=3.10"]
coupling = ["radia>=5.3.1"]
ltspice = ["schemdraw>=0.18"]
test = ["pytest>=8", "build>=1.2", "numpy>=1.26", "h5py>=3.10", "schemdraw>=0.18", "mcp>=1.21.1,<2"]

[project.urls]
Repository = "https://github.com/ksugahar/Radia"
Documentation = "https://github.com/ksugahar/Radia/tree/main/packages/radia-simulink"

[project.scripts]
radia-ih-assemble = "radia_simulink.simulink.ih_operator_assembly:main"
radia-simulink-path = "radia_simulink.cli:path_main"
radia-simulink-doctor = "radia_simulink.cli:doctor_main"

radia-ltspice = "radia_simulink.ltspice.cli:main"
radia-spice-lab = "radia_simulink.ltspice.cli:main"
spice-circuit-lab = "radia_simulink.ltspice.cli:main"
ltspice-convert = "radia_simulink.ltspice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radia_simulink = ["manifest.json"]
"radia_simulink.ltspice" = ["LICENSE", "py.typed"]

"radia_simulink.simulink" = ["contracts/*.json"]
