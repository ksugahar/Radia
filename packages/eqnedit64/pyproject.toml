[build-system]
requires = [
    "scikit-build-core>=0.10",
    "pybind11>=2.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "eqnedit64"
version = "3.0.3"
description = "Fast TeX equation editing, rendering, and Office clipboard tools"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{name = "Kengo Sugahara"}]
keywords = ["tex", "latex", "equation", "mathml", "powerpoint", "office"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
test = ["build>=1.2", "pytest>=8"]

[project.urls]
Homepage = "https://github.com/ksugahar/Radia/tree/main/tools/eqnedit64"
Repository = "https://github.com/ksugahar/Radia"
Issues = "https://github.com/ksugahar/Radia/issues"

[project.scripts]
eqnedit64 = "eqnedit64.cli:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/eqnedit64"]
build-dir = "build/{wheel_tag}"
