[build-system]
requires = ["setuptools>=77", "wheel>=0.45", "tomli>=2; python_version < '3.11'"]
build-backend = "setuptools.build_meta"

[project]
name = "radia-gpu"
version = "0.1.1"
description = "Radia CUDA MEX kernels with Simulink blocks and LTspice integration"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Radia"
authors = [{name = "Radia Development Team"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
exchange = ["numpy>=1.26", "h5py>=3.10"]
coupling = ["radia>=5.3.1"]
ltspice = ["schemdraw>=0.18"]
test = ["pytest>=8", "build>=1.2", "numpy>=1.26", "h5py>=3.10", "schemdraw>=0.18", "mcp>=1.21.1,<2"]

[project.urls]
Repository = "https://github.com/ksugahar/Radia"
Documentation = "https://github.com/ksugahar/Radia/tree/main/packages/radia-gpu"

[project.scripts]
radia-ih-assemble = "radia_gpu.simulink.ih_operator_assembly:main"
radia-gpu-path = "radia_gpu.cli:path_main"
radia-gpu-doctor = "radia_gpu.cli:doctor_main"

radia-ltspice = "radia_gpu.ltspice.cli:main"
radia-spice-lab = "radia_gpu.ltspice.cli:main"
spice-circuit-lab = "radia_gpu.ltspice.cli:main"
ltspice-convert = "radia_gpu.ltspice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radia_gpu = ["manifest.json"]
"radia_gpu.ltspice" = ["LICENSE", "py.typed"]

"radia_gpu.simulink" = ["contracts/*.json"]
