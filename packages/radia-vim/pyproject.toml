# radia-vim — Volume Integral Method on a single hex cell, NGSolve addon.
#
# Implements the Newton-kernel volume Galerkin method for HDiv div-free
# interior basis on an axis-aligned hex (cuboid). Supplements NGSolve's
# native FEM by adding the integral-equation route to eddy-current Cauer
# ladder extraction, where ngsolve.bem (ngbem) is surface-only.
#
# Templated on numeric precision (double / __float128 / MPFR) so that the
# K matrix entries can be assembled at the precision the downstream Cauer
# extraction actually needs (16 digits = 6-15 stages, 32 digits = 25 stages,
# 60+ digits = 50+ stages — see scripts/precision_sensitivity_study.py).
#
# Part of the Sugahara-lab Radia public extension family. See:
#   https://github.com/ksugahar/radia-vim

[project]
name = "radia-vim"
version = "0.1.0"
description = "Volume Integral Method (Newton-kernel volume Galerkin BEM) for cuboid eddy currents — NGSolve extension"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Kengo Sugahara", email = "ksugahar@ele.kindai.ac.jp"},
]
keywords = ["ngsolve", "bem", "vim", "volume-integral", "eddy-current",
            "cauer-ladder", "hdiv", "radia"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]
dynamic = ["dependencies"]

[project.urls]
Homepage = "https://github.com/ksugahar/radia-vim"
Repository = "https://github.com/ksugahar/radia-vim"
Issues = "https://github.com/ksugahar/radia-vim/issues"

[build-system]
requires = [
            "ngsolve>=6.2.2405.post22.dev0",
            "scikit-build-core>=0.9.0",
            "pybind11_stubgen",
            "cmake",
            "toml;  python_version >= '3.11'",
            "tomli>=1.1.0; python_version < '3.11'"
]
build-backend = "scikit_build_core.build"

##########################################################################
# scikit-build / cibuildwheel settings (pinned NGSolve version, matrix wheels)
##########################################################################

[tool.scikit-build]
experimental = true
metadata.dependencies.provider = "ngsolve._scikit_build_core_dependencies"

[tool.cibuildwheel]
manylinux-x86_64-image = "manylinux_2_28"
skip = """
  pp*
  *_i686
  *musllinux*
  *win32
"""

[tool.cibuildwheel.linux]
repair-wheel-command = "mv {wheel} {dest_dir} && rename linux_x86_64 manylinux_2_28_x86_64.manylinux2014_x86_64 {dest_dir}/*-linux_x86_64*.whl"

[tool.cibuildwheel.macos]
environment = {MACOSX_DEPLOYMENT_TARGET="10.15"}
repair-wheel-command = ""
archs = ["universal2"]
